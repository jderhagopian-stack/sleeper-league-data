name: Projection Injury Shock Diagnostic

on:
  pull_request:
    paths:
      - 'script/diagnose_external_benchmark_injury_shocks.py'
      - '.github/workflows/projection-injury-shock-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run post-hoc injury shock diagnostic
        run: python script/diagnose_external_benchmark_injury_shocks.py
      - uses: actions/upload-artifact@v4
        with:
          name: projection-injury-shock-diagnostic
          path: data/model_validation/native_v2_fftoday_injury_shock_diagnostic.json
