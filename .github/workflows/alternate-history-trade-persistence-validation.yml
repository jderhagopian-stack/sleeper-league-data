name: Alternate History Trade Persistence Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/alternate-history-0.1
    paths:
      - script/alternate_history_trade_persistence_runtime.py
      - script/alternate_history_trade_persistence_v3_runtime.py
      - script/validate_alternate_history_trade_persistence.py
      - script/run_gm30_alternate_history_review.py
      - .github/workflows/alternate-history-trade-persistence-validation.yml

jobs:
  validate-trade-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Simulator runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile trade-persistence modules
        run: python -m py_compile script/alternate_history_trade_persistence_runtime.py script/alternate_history_trade_persistence_v3_runtime.py script/validate_alternate_history_trade_persistence.py script/run_gm30_alternate_history_review.py
      - name: Validate behavioral trade persistence invariants
        run: PYTHONPATH=script python script/validate_alternate_history_trade_persistence.py
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Backfill authoritative raw Sleeper history
        run: PYTHONPATH=script python script/backfill_alternate_history_sleeper.py
      - name: Run representative integrated review
        run: PYTHONPATH=script python script/run_gm30_alternate_history_review.py data/alternate_history/scenarios/puka_vs_van_2023.json --particles 20 --sims 100 --seed 20260824
      - name: Verify integrated probability mass and narrative output
        run: |
          python - <<'PY'
          import json
          p='data/alternate_history/results/puka_vs_van_2023/final_report_1_1.json'
          r=json.load(open(p))
          assert r['summary']['present_day_probability_mass'] == 1.0
          assert r['configuration']['particles'] == 20
          assert r['configuration']['simulator_sims'] == 100
          print('PASS: integrated trade-persistence review preserves full probability mass')
          PY
