name: Native No-History Role

on:
  pull_request:
    paths:
      - 'script/run_native_no_history_role_benchmark.py'
      - '.github/workflows/native-no-history-role.yml'
      - 'script/build_native_preseason_projections.py'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run no-history benchmark
        run: python script/run_native_no_history_role_benchmark.py
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: native-no-history-role
          path: data/model_validation/native_no_history_role_benchmark.json
