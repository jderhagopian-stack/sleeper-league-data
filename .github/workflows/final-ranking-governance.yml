name: Final Trade Ranking Governance

on:
  pull_request:
    paths:
      - 'script/audit_final_trade_ranking_governance.py'
      - 'script/audit_final_score_ablation.py'
      - 'script/run_trade_market_sweep_v20.py'
      - 'script/run_trade_market_sweep_v23.py'
      - 'script/decision_lab_state_aware.py'
      - 'data/model_parameter_registry.json'
      - '.github/workflows/final-ranking-governance.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run structural final-ranking governance audit
        run: python script/audit_final_trade_ranking_governance.py
      - name: Validate findings
        run: |
          python - <<'PY'
          import json
          r=json.load(open('data/audit/final_trade_ranking_governance_audit.json'))
          f={x['id']:x for x in r['findings']}
          assert r['production_behavior_changed'] is False
          assert r['summary']['post_sim_formula_markers_detected'] is True
          assert r['summary']['nested_strategic_channel_overlap_detected'] is True
          assert r['summary']['behavior_reused_inside_and_outside_acceptance'] is False
          assert r['summary']['existing_final_score_ablation_tool_detected'] is True
          assert r['summary']['governed_final_ranking_families_non_authoritative'] is True
          assert f['FINAL-NEGOTIATION-BEHAVIOR-REUSE-001']['status']=='NO_REUSE_DETECTED'
          assert f['FINAL-RANK-WEIGHTS-001']['authoritative_empirical_claim_allowed'] is False
          print(json.dumps(r,indent=2))
          PY
