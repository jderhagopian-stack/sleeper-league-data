name: Final Trade Ranking Governance

on:
  pull_request:
    paths:
      - 'script/audit_final_trade_ranking_governance.py'
      - 'script/audit_final_score_ablation.py'
      - 'script/run_trade_market_sweep_v20.py'
      - 'script/run_trade_market_sweep_v23.py'
      - 'script/decision_lab_state_aware.py'
      - 'script/build_fsffl_gm_engine.py'
      - 'data/model_parameter_registry.json'
      - '.github/workflows/final-ranking-governance.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Compile final-ranking modules
        run: python -m py_compile script/build_fsffl_gm_engine.py script/decision_lab_state_aware.py script/run_trade_market_sweep_v20.py script/audit_final_trade_ranking_governance.py
      - name: Run structural final-ranking governance audit
        run: python script/audit_final_trade_ranking_governance.py
      - name: Validate findings
        run: |
          python - <<'PY'
          import json
          r=json.load(open('data/audit/final_trade_ranking_governance_audit.json'))
          f={x['id']:x for x in r['findings']}
          assert r['production_behavior_changed'] is True
          assert r['policy']['primitive_channels_only_in_final_score'] is True
          assert r['policy']['composite_gm_channels_are_diagnostic_only'] is True
          assert r['summary']['primitive_post_sim_formula_detected'] is True
          assert r['summary']['old_nested_formula_detected'] is False
          assert r['summary']['nested_strategic_channel_overlap_detected'] is False
          assert r['summary']['direct_roster_replacement_resilience_detected'] is True
          assert r['summary']['composite_channels_still_available_for_diagnostics'] is True
          assert r['summary']['prior_grouped_ablation_evidence_preserved'] is True
          assert r['summary']['behavior_reused_inside_and_outside_acceptance'] is False
          assert r['summary']['trade_score_registry_consistent'] is True
          assert f['FINAL-SCORE-OVERLAP-001']['status']=='STRUCTURALLY_DEDUPLICATED_PRIMITIVE_CHANNELS'
          assert f['FINAL-RANK-SCALING-001']['authoritative_empirical_claim_allowed'] is False
          print(json.dumps(r,indent=2))
          PY
