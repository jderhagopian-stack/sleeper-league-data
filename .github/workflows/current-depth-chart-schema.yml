name: Current Depth Chart Schema

on:
  pull_request:
    paths:
      - 'script/probe_current_depth_chart_schema.py'
      - '.github/workflows/current-depth-chart-schema.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe current depth chart schema
        run: python script/probe_current_depth_chart_schema.py --season 2026
      - uses: actions/upload-artifact@v4
        with:
          name: current-depth-chart-schema
          path: data/model_validation/current_depth_chart_schema_probe.json
