name: Temporary Skattebo Stevenson Model Reports

on:
  push:
    branches:
      - tmp/skattebo-stevenson-model-report-20260829
    paths:
      - '.github/workflows/tmp-skattebo-stevenson-model-report.yml'

jobs:
  model-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install report dependencies
        run: python -m pip install 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Run Chef Niners production trade report
        run: |
          mkdir -p /tmp/fsffl-trade-output
          python script/run_trade_report.py \
            --scenario data/decision_lab/tmp_chef_niners_skattebo_offer.json \
            --out-dir /tmp/fsffl-trade-output \
            --basename Chef_Niners_Skattebo_Trade_Report \
            --quick-sims 200 \
            --adaptive-confirm-sims 1000 \
            --search-depth 60 \
            --seed 20260821
      - name: Run Hurts So Good production trade report
        run: |
          python script/run_trade_report.py \
            --scenario data/decision_lab/tmp_hurts_so_good_skattebo_offer.json \
            --out-dir /tmp/fsffl-trade-output \
            --basename Hurts_So_Good_Skattebo_Trade_Report \
            --quick-sims 200 \
            --adaptive-confirm-sims 1000 \
            --search-depth 60 \
            --seed 20260821
      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          root=Path('/tmp/fsffl-trade-output')
          for base in ('Chef_Niners_Skattebo_Trade_Report','Hurts_So_Good_Skattebo_Trade_Report'):
              a=json.loads((root/f'{base}.json').read_text())
              s=json.loads((root/f'{base}-summary.json').read_text())
              assert a['model_version']=='FSFFL-Counter-Market-Sweep-1.24'
              assert s['pipeline_model_version']=='FSFFL-Trade-Query-Pipeline-1.17'
              assert s['report_model_version']=='FSFFL-Trade-Decision-Report-1.10'
              pdf=root/f'{base}.pdf'
              assert pdf.exists() and 1 <= len(PdfReader(str(pdf)).pages) <= 3
              print(base, s['short_answer'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: skattebo-stevenson-actual-model-reports
          path: /tmp/fsffl-trade-output/*
          if-no-files-found: error
          retention-days: 7
