name: One-off Chef Bodini No-Truncation Trade Report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-chef-bodini-no-truncation.yml'

jobs:
  trade-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Write scenario
        run: |
          cat > /tmp/chef-bodini-trade.json <<'JSON'
          {
            "scenario_id":"chef-bodini-skattebo-no-truncation-2026-08-27",
            "description":"Chef Niners gives Cam Skattebo to Hurts So Good and receives Rhamondre Stevenson, Hurts So Good's own 2028 2nd, and Hurts So Good's own 2029 3rd.",
            "focus_user_id":"709546576091090944",
            "participant_user_ids":["709546576091090944","846634401482792960"],
            "transaction_status":"proposed",
            "actions":[
              {"type":"trade","from_user_id":"709546576091090944","to_user_id":"846634401482792960","players":["12481"],"picks":[]},
              {"type":"trade","from_user_id":"846634401482792960","to_user_id":"709546576091090944","players":["7611"],"picks":["pick:2028:R2:orig9","pick:2029:R3:orig9"]}
            ]
          }
          JSON
      - name: Run canonical trade pipeline
        run: |
          mkdir -p /tmp/trade-output
          python script/run_trade_report.py \
            --scenario /tmp/chef-bodini-trade.json \
            --out-dir /tmp/trade-output \
            --basename chef-bodini-no-truncation \
            --quick-sims 200 \
            --adaptive-confirm-sims 1000 \
            --search-depth 60
      - name: Validate full prose
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          p='/tmp/trade-output/chef-bodini-no-truncation.pdf'
          reader=PdfReader(p)
          text='\n'.join((x.extract_text() or '') for x in reader.pages)
          assert '...' not in text and '\u2026' not in text, text
          banned=('state-aware','break-glass','liquidity value','objective weights','competitive externality','heuristic acceptance','post-sim','adaptive confirmation','simulation multiverse')
          low=text.lower()
          assert not [x for x in banned if x in low], low
          print('pages',len(reader.pages))
          print(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chef-bodini-no-truncation-trade-20260827
          path: /tmp/trade-output/*
          if-no-files-found: error
          retention-days: 30
