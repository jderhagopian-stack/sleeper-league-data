name: Alternate History Optimized Benchmark Once

on:
  pull_request:
    paths:
      - '.github/workflows/alternate-history-benchmark-once.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Benchmark optimized Puka 16 particles
        run: /usr/bin/time -f 'BENCHMARK_16 elapsed=%e maxrss_kb=%M' python script/run_fsffl_generic_alternate_history.py data/alternate_history/scenarios/puka_vs_van_2023.json --particles 16 --seed 20260824
      - name: Benchmark optimized Puka 32 particles
        run: /usr/bin/time -f 'BENCHMARK_32 elapsed=%e maxrss_kb=%M' python script/run_fsffl_generic_alternate_history.py data/alternate_history/scenarios/puka_vs_van_2023.json --particles 32 --seed 20260824
