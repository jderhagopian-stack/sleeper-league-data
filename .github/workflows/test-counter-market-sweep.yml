name: Test Counter Market Sweep

on:
  pull_request:
    paths:
      - 'script/run_trade_market_sweep.py'
      - 'script/run_trade_market_sweep_v12.py'
      - 'script/run_trade_market_sweep_v13.py'
      - 'script/run_trade_market_sweep_v14.py'
      - 'script/run_trade_market_sweep_v15.py'
      - 'script/run_trade_market_sweep_v16.py'
      - 'script/run_trade_market_sweep_v17.py'
      - 'data/decision_lab/counter_market_engine_architecture.json'
      - '.github/workflows/test-counter-market-sweep.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile engine
        run: python -m py_compile script/run_trade_market_sweep.py script/run_trade_market_sweep_v12.py script/run_trade_market_sweep_v13.py script/run_trade_market_sweep_v14.py script/run_trade_market_sweep_v15.py script/run_trade_market_sweep_v16.py script/run_trade_market_sweep_v17.py script/run_roster_decision_lab.py

      - name: Validate fast optimizer equivalence
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          def load(path, name):
              spec = importlib.util.spec_from_file_location(name, path)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod
          fast = load(Path('script/run_trade_market_sweep_v13.py'), 'fast13')
          dl = load(Path('script/run_roster_decision_lab.py'), 'dl')
          simmod, league, rosters, users, players, season, projections, raw_schedule = dl.load_model_inputs()
          roster = rosters[0]
          for week in (1, 15):
              legacy = simmod.optimize_weekly_lineup(roster, week, league, players, projections)
              quick = fast.fast_optimize_weekly_lineup(simmod, roster, week, league, players, projections)
              lv = round(sum(float(x['mean']) * float(x['active_probability']) for x in legacy), 8)
              qv = round(sum(float(x['mean']) * float(x['active_probability']) for x in quick), 8)
              assert lv == qv, (week, lv, qv)
          print('Fast exact lineup DP matches legacy optimizer objective')
          PY

      - name: Run acceptance-frontier market sweep
        run: |
          SECONDS=0
          python script/run_trade_market_sweep_v17.py \
            --scenario data/decision_lab/full_validation_scenario.json \
            --quick-sims 100 \
            --confirm-sims 0 \
            --search-depth 60 \
            --output /tmp/counter-market-sweep.json \
            > /tmp/counter-market-sweep.log
          elapsed=$SECONDS
          echo "Acceptance-frontier market sweep runtime: ${elapsed}s"
          test "$elapsed" -le 180
          tail -n 40 /tmp/counter-market-sweep.log

      - name: Validate output invariants
        run: |
          python - <<'PY'
          import json
          d = json.load(open('/tmp/counter-market-sweep.json'))
          assert d['model_version'] == 'FSFFL-Counter-Market-Sweep-1.7'
          assert d['simulation']['canonical_state_mutated'] is False
          assert d['simulation']['lineup_reoptimization'] == 'exact_slot_mask_dynamic_programming'
          assert d['simulation']['execution_path'] == 'acceptance_frontier_prescreen_then_fast_decision_lab'
          assert d['policy']['fast_exact_lineup_dp'] is True
          assert d['policy']['buyer_current_state_rationality_gate'] is True
          assert d['policy']['acceptance_frontier_search'] is True
          assert d['policy']['state_change_dependent_candidates_separated'] is True
          assert d['policy']['heuristic_acceptance_fit_not_probability'] is True
          assert d['policy']['actionable_normal_slot_requires_acceptance_fit'] == ['HIGH','MEDIUM']
          assert d['policy']['swing_for_fences_max_count'] == 1
          assert d['policy']['swing_for_fences_can_drive_action'] is False
          assert d['current_offer_evaluation']['candidate_type'] == 'CURRENT_OFFER'
          assert 'buyer_rationality' in d['current_offer_evaluation']
          assert d['candidate_counts']['frontier_selected_for_simulation'] >= 30
          assert d['candidate_counts']['simulated'] >= 30
          assert len(d['top_5_alternatives']) <= 5
          swings = [x for x in d['top_5_alternatives'] if x.get('report_role') == 'SWING_FOR_FENCES']
          realistic = [x for x in d['top_5_alternatives'] if x.get('report_role') == 'REALISTIC_BILATERAL']
          assert len(swings) <= 1
          assert all(x['championship_equity_constraint'] == 'PASS' for x in d['top_5_alternatives'])
          assert all(x['plausibility'] in {'HIGH','MEDIUM'} for x in d['top_5_alternatives'])
          assert all(x['buyer_rationality']['current_state_viable'] is True for x in d['top_5_alternatives'])
          assert all(x['buyer_rationality']['heuristic_acceptance_fit'] in {'HIGH','MEDIUM'} for x in realistic)
          assert all(x['buyer_rationality']['heuristic_acceptance_fit'] in {'LOW','VERY_LOW'} for x in swings)
          assert all('comparison_to_current_offer' in x for x in d['top_5_alternatives'])
          assert d['recommended_next_action'] in {'ACCEPT_NOW','COUNTER_CURRENT_OFFEROR','SHOP_BEFORE_ACCEPTING','DECLINE'}
          print('Counter & Market Sweep 1.7 acceptance-frontier smoke test passed')
          PY

      - name: Upload full counter report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-market-sweep-report
          path: |
            /tmp/counter-market-sweep.json
            /tmp/counter-market-sweep.log
          if-no-files-found: error
          retention-days: 14
