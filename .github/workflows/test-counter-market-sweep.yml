name: Test Counter Market Sweep

on:
  workflow_call:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Compile engine
        run: python -m py_compile script/run_trade_market_sweep.py script/run_trade_market_sweep_v12.py script/run_trade_market_sweep_v13.py script/run_trade_market_sweep_v14.py script/run_trade_market_sweep_v15.py script/run_trade_market_sweep_v16.py script/run_trade_market_sweep_v17.py script/run_trade_market_sweep_v18.py script/run_trade_market_sweep_v19.py script/run_trade_market_sweep_v20.py script/run_trade_market_sweep_v23.py script/negotiation_ranking.py script/decision_lab_state_aware.py script/gm_state_weighting.py script/run_roster_decision_lab.py script/audit_final_score_ablation.py script/audit_negotiation_ranking_dedup.py
      - name: Validate fast optimizer equivalence
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); return m
          fast=load(Path('script/run_trade_market_sweep_v13.py'),'fast13'); dl=load(Path('script/run_roster_decision_lab.py'),'dl')
          simmod,league,rosters,users,players,season,projections,raw_schedule=dl.load_model_inputs(); roster=rosters[0]
          for week in (1,15):
              legacy=simmod.optimize_weekly_lineup(roster,week,league,players,projections); quick=fast.fast_optimize_weekly_lineup(simmod,roster,week,league,players,projections)
              assert round(sum(float(x['mean'])*float(x['active_probability']) for x in legacy),8)==round(sum(float(x['mean'])*float(x['active_probability']) for x in quick),8)
          PY
      - name: Run reserved-swing market sweep
        run: |
          SECONDS=0
          python script/run_trade_market_sweep_v19.py --scenario data/decision_lab/full_validation_scenario.json --quick-sims 100 --confirm-sims 0 --search-depth 60 --output /tmp/counter-market-sweep.json > /tmp/counter-market-sweep.log
          test "$SECONDS" -le 180
      - name: Validate legacy output invariants
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/counter-market-sweep.json')); assert d['model_version']=='FSFFL-Counter-Market-Sweep-1.11'; assert d['simulation']['canonical_state_mutated'] is False; assert d['policy']['swing_for_fences_can_drive_action'] is False; assert d['recommended_next_action'] in {'ACCEPT_NOW','COUNTER_CURRENT_OFFEROR','SHOP_BEFORE_ACCEPTING','DECLINE'}
          PY
      - name: Run continuous state-aware market sweep
        run: |
          SECONDS=0
          python script/run_trade_market_sweep_v20.py --scenario data/decision_lab/full_validation_scenario.json --quick-sims 100 --confirm-sims 0 --search-depth 40 --output /tmp/state-aware-market-sweep.json > /tmp/state-aware-market-sweep.log
          test "$SECONDS" -le 180
      - name: Validate continuous state-aware output
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/state-aware-market-sweep.json')); assert d['model_version']=='FSFFL-Counter-Market-Sweep-1.14'; p=d['policy']; assert p['focal_post_trade_gm_profiles_recomputed'] is True; assert p['continuous_state_weighting'] is True; assert p['final_negotiation_ranking_uses_state_aware_post_sim_score'] is True
          cur=d['current_offer_evaluation']['simulation']['strategic']; assert cur['hypothetical_profiles_recomputed'] is True; assert abs(sum(cur['objective_weights'].values())-1)<1e-5; assert all(x['profile_source']=='post_trade_focal_gm' for x in cur['received'])
          for row in d['top_5_alternatives']:
              nr=row['negotiation_ranking']; assert nr['focal_strategic_gain_source']=='state_aware_post_sim_score'; assert abs(float(nr['state_aware_post_sim_score'])-float(row['post_sim_score']))<1e-6
              assert nr['ranking_model_version']=='FSFFL-Negotiation-Ranking-3.0'
              assert nr['weights']=={'focal_strategic_gain':1.0,'acceptance_fit':0.0,'owner_behavior_match':0.0}
              assert nr['behavior_already_in_acceptance_fit'] is True
          print('Counter Market Sweep 1.14 state-aware ranking compatibility passed')
          PY
      - name: Audit negotiation-ranking behavior de-duplication
        run: |
          python script/audit_negotiation_ranking_dedup.py --report /tmp/state-aware-market-sweep.json --output /tmp/negotiation-ranking-dedup.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/negotiation-ranking-dedup.json'))
          assert d['interpretation']['historical_validation'] is False
          assert d['interpretation']['coefficient_tuning'] is False
          assert d['interpretation']['structural_double_count_ablation'] is True
          assert d['summary']['candidate_count'] > 0
          assert d['summary']['current_report_matches_deduplicated_formula'] is True
          print(json.dumps(d['summary'],indent=2))
          PY
      - name: Audit final-score overlap sensitivity
        run: |
          python script/audit_final_score_ablation.py --report /tmp/state-aware-market-sweep.json --output /tmp/final-score-ablation.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/final-score-ablation.json'))
          assert d['interpretation']['historical_validation'] is False
          assert d['interpretation']['coefficient_tuning'] is False
          assert d['summary']['candidate_count'] > 0
          print(json.dumps(d['summary'],indent=2))
          print(json.dumps(d['comparisons'],indent=2))
          PY
      - name: Upload full counter reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-market-sweep-report
          path: |
            /tmp/counter-market-sweep.json
            /tmp/counter-market-sweep.log
            /tmp/state-aware-market-sweep.json
            /tmp/state-aware-market-sweep.log
            /tmp/final-score-ablation.json
            /tmp/negotiation-ranking-dedup.json
          if-no-files-found: error
          retention-days: 14