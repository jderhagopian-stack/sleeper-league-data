name: Projection Ensemble Governance

on:
  pull_request:
    paths:
      - 'data/projection_source_registry.json'
      - 'script/build_fsffl_projection_ensemble.py'
      - 'script/normalize_*projection_source.py'
      - 'script/fetch_fantasypros_projection_source.py'
      - 'script/projection_source_uncertainty.py'
      - 'script/run_fsffl_season_simulator_projection_uncertainty.py'
      - 'script/test_projection_uncertainty_simulator.py'
      - 'script/audit_projection_ensemble_governance.py'
      - 'script/test_projection_ensemble.py'
      - '.github/workflows/projection-ensemble-governance.yml'
  workflow_dispatch:

jobs:
  projection-ensemble-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install simulator test dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Compile projection ensemble code
        run: |
          python -m py_compile \
            script/build_fsffl_projection_ensemble.py \
            script/normalize_razzball_projection_source.py \
            script/fetch_fantasypros_projection_source.py \
            script/projection_source_uncertainty.py \
            script/run_fsffl_season_simulator_projection_uncertainty.py \
            script/test_projection_uncertainty_simulator.py \
            script/audit_projection_ensemble_governance.py \
            script/test_projection_ensemble.py

      - name: Run static projection governance audit
        run: python script/audit_projection_ensemble_governance.py

      - name: Run fast projection ensemble regression tests
        working-directory: script
        run: |
          python test_projection_ensemble.py
          python test_projection_uncertainty_simulator.py
