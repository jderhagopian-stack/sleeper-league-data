name: Projection Ensemble Governance

on:
  pull_request:
    paths:
      - 'data/projection_source_registry.json'
      - 'script/build_fsffl_projection_ensemble.py'
      - 'script/normalize_*projection_source.py'
      - 'script/fetch_fftoday_projection_source.py'
      - 'script/fetch_fantasypros_projection_source.py'
      - 'script/projection_source_uncertainty.py'
      - 'script/run_fsffl_season_simulator_projection_uncertainty.py'
      - 'script/test_projection_uncertainty_simulator.py'
      - 'script/audit_projection_ensemble_governance.py'
      - 'script/test_projection_ensemble.py'
      - '.github/workflows/projection-ensemble-governance.yml'
  workflow_dispatch:

jobs:
  projection-ensemble-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install simulator test dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Compile projection ensemble code
        run: |
          python -m py_compile \
            script/build_fsffl_projection_ensemble.py \
            script/normalize_razzball_projection_source.py \
            script/fetch_fftoday_projection_source.py \
            script/fetch_fantasypros_projection_source.py \
            script/projection_source_uncertainty.py \
            script/run_fsffl_season_simulator_projection_uncertainty.py \
            script/test_projection_uncertainty_simulator.py \
            script/audit_projection_ensemble_governance.py \
            script/test_projection_ensemble.py

      - name: Run static projection governance audit
        run: python script/audit_projection_ensemble_governance.py

      - name: Run fast projection ensemble regression tests
        working-directory: script
        run: |
          python test_projection_ensemble.py
          python test_projection_uncertainty_simulator.py

      - name: Exercise real projection adapters and authority gate
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          python script/normalize_razzball_projection_source.py
          python script/fetch_fftoday_projection_source.py
          if [ -n "${FANTASYPROS_API_KEY:-}" ]; then
            echo "FantasyPros credential available; exercising optional third-source adapter."
            python script/fetch_fantasypros_projection_source.py
          else
            echo "FantasyPros credential unavailable; Razzball + FFToday remain the required independent baseline."
          fi
          python script/build_fsffl_projection_ensemble.py
          python - <<'PY'
          import json
          from pathlib import Path
          league=json.load(open('data/league.json'))
          season=str(league['season'])
          audit=json.load(open(Path('data/simulator')/season/'outputs'/'projection_ensemble_audit.json'))
          print(json.dumps({
              'independent_sources_used': audit['independent_sources_used'],
              'player_authority_coverage': audit['player_authority_coverage'],
              'authoritative_projection_allowed': audit['authoritative_projection_allowed'],
              'missing_or_invalid_sources': audit['missing_or_invalid_sources'],
          }, indent=2))
          assert 'razzball' in audit['independent_sources_used']
          assert 'fftoday' in audit['independent_sources_used']
          assert audit['authoritative_projection_allowed'] is True
          assert audit['player_authority_coverage'] >= audit['quality_gate']['minimum_player_authority_coverage_for_production']
          PY
