name: Alternate History Runtime Performance Benchmark Once

on:
  workflow_dispatch:
  push:
    branches:
      - feature/alternate-history-0.1
    paths:
      - '.github/alternate-history-benchmark-trigger.txt'

concurrency:
  group: alternate-history-runtime-performance-once
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Simulator runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Validate exact performance primitive equivalence
        run: python script/validate_alternate_history_performance_equivalence.py
      - name: Validate season-row ledger fingerprint equivalence
        run: python script/validate_alternate_history_ledger_key_equivalence.py
      - name: Validate memoized Simulator fallback equivalence
        run: python script/validate_alternate_history_simulator_dp_equivalence.py
      - name: Benchmark optimized review at 20 particles / 100 draws
        shell: bash
        run: |
          mkdir -p data/alternate_history/results/puka_vs_van_2023
          /usr/bin/time -v python script/run_gm30_alternate_history_review.py \
            data/alternate_history/scenarios/puka_vs_van_2023.json \
            --particles 20 --sims 100 --seed 20260824 \
            2> data/alternate_history/results/puka_vs_van_2023/performance_time_20x100.txt
      - name: Print benchmark summary
        run: cat data/alternate_history/results/puka_vs_van_2023/performance_time_20x100.txt
      - uses: actions/upload-artifact@v4
        with:
          name: alternate-history-performance-20x100-once
          path: |
            data/alternate_history/results/puka_vs_van_2023/final_report_1_0.json
            data/alternate_history/results/puka_vs_van_2023/performance_time_20x100.txt
