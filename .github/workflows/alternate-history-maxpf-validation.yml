name: Alternate History MaxPF Validation

on:
  pull_request:
    paths:
      - 'script/run_fsffl_maxpf_draft_order.py'
      - 'script/run_fsffl_maxpf_draft_order_v2.py'
      - 'script/diagnose_fsffl_weekly_scoring_source.py'
      - 'script/run_fsffl_historical_usage_policy.py'
      - 'script/run_fsffl_postseason_consequences_v3.py'
      - 'data/stats/fsffl/**'
      - 'data/alternate_history/**'
      - '.github/workflows/alternate-history-maxpf-validation.yml'
  workflow_dispatch:

concurrency:
  group: alternate-history-maxpf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-maxpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile Max PF and scoring-source validation
        run: |
          python -m py_compile script/run_fsffl_maxpf_draft_order.py
          python -m py_compile script/run_fsffl_maxpf_draft_order_v2.py
          python -m py_compile script/diagnose_fsffl_weekly_scoring_source.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Validate comprehensive historical weekly scoring source
        run: python script/diagnose_fsffl_weekly_scoring_source.py --season 2023
      - name: Backvalidate FSFFL non-playoff Max PF draft order with record tiebreak
        run: python script/run_fsffl_maxpf_draft_order_v2.py data/alternate_history/scenarios/puka_vs_van_2023.json
