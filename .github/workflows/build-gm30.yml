name: Build and Validate GM 3.0

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fsffl-gm30
  cancel-in-progress: false

jobs:
  gm30:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build GM 3.0 prospect intelligence
        run: python script/build_gm30_prospect_engine.py

      - name: Normalize prospect-board contract
        shell: bash
        run: |
          mkdir -p data/gm
          if [ -f data/gm/gm30_prospect_radar.json ]; then
            cp data/gm/gm30_prospect_radar.json data/gm/prospect_board.json
          fi

      - name: Build GM 3.0 calibration audit
        run: python script/build_gm30_calibration.py

      - name: Build GM 3.0 league-wide intelligence
        run: python script/build_fsffl_gm30.py

      - name: Run GM 3.0 validation gate
        run: python script/validate_gm30.py

      - name: Show validated GM 3.0 outputs
        run: find data/gm -maxdepth 2 -type f -print | sort

      - name: Commit validated GM 3.0 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gm/

          if git diff --cached --quiet; then
            echo "No GM 3.0 output changes to commit."
          else
            git commit -m "Build validated FSFFL GM 3.0 league-wide outputs"
            git push origin HEAD:main
          fi
