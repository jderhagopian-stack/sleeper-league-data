name: Build and Validate GM 3.0

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fsffl-gm30
  cancel-in-progress: false

jobs:
  gm30:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # PHASE 1 — REFRESH THE PROVEN GM 2.2 CORE
      # ---------------------------------------------------------

      - name: Build proven GM 2.2 core
        run: python script/build_fsffl_gm_engine.py

      - name: Preserve GM 2.2 regression baseline
        shell: bash
        run: |
          rm -rf data/gm22_reference
          mkdir -p data/gm22_reference
          cp -a data/gm/. data/gm22_reference/

          echo "GM 2.2 reference snapshot preserved."
          find data/gm22_reference -type f -print | sort

      # ---------------------------------------------------------
      # PHASE 2 — CLEAN THE PRODUCTION GM NAMESPACE
      # ---------------------------------------------------------

      - name: Clean GM 3.0 production output
        shell: bash
        run: |
          rm -rf data/gm
          mkdir -p data/gm

          echo "Clean GM 3.0 production namespace created."

      # ---------------------------------------------------------
      # PHASE 3 — BUILD GM 3.0 UPGRADES
      # ---------------------------------------------------------

      - name: Build GM 3.0 prospect intelligence
        run: python script/build_gm30_prospect_engine.py

      - name: Normalize prospect-board contract
        shell: bash
        run: |
          mkdir -p data/gm

          if [ -f data/gm/gm30_prospect_radar.json ]; then
            cp data/gm/gm30_prospect_radar.json \
               data/gm/prospect_board.json
          fi

      - name: Build GM 3.0 calibration audit
        run: python script/build_gm30_calibration.py

      - name: Build GM 3.0 league-wide intelligence
        run: python script/build_fsffl_gm30.py

      # ---------------------------------------------------------
      # PHASE 4 — VALIDATION
      # ---------------------------------------------------------

      - name: Run GM 3.0 architecture validation
        run: python script/validate_gm30.py

      - name: Verify GM 2.2 core was preserved
        shell: bash
        run: |
          test -d data/gm22_reference/teams
          test -d data/gm22_reference/league

          test -f data/gm22_reference/franchise_index.json
          test -f data/gm22_reference/league/mutual_trade_map.json

          echo "GM 2.2 core preservation: PASS"

      - name: Verify GM 3.0 league-wide outputs
        shell: bash
        run: |
          test -f data/gm/manifest.json
          test -f data/gm/team_command_centers.json
          test -f data/gm/team_trade_routes.json
          test -f data/gm/league_intelligence.json
          test -f data/gm/validation_report.json

          echo "GM 3.0 league-wide output contract: PASS"

      # ---------------------------------------------------------
      # PHASE 5 — REPORT
      # ---------------------------------------------------------

      - name: Show GM 3.0 outputs
        shell: bash
        run: |
          echo "=============================="
          echo "GM 3.0 PRODUCTION"
          echo "=============================="
          find data/gm -type f -print | sort

          echo ""
          echo "=============================="
          echo "GM 2.2 REGRESSION REFERENCE"
          echo "=============================="
          find data/gm22_reference -type f -print | sort

      # ---------------------------------------------------------
      # PHASE 6 — COMMIT ONLY AFTER EVERYTHING PASSES
      # ---------------------------------------------------------

      - name: Commit validated GM system
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gm/
          git add data/gm22_reference/

          if git diff --cached --quiet; then
            echo "No GM output changes to commit."
          else
            git commit -m \
              "Build GM 3.0 on preserved GM 2.2 core"
            git push origin HEAD:main
          fi
