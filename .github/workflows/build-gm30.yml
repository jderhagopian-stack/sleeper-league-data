name: Build and Validate GM 3.0

on:
  workflow_dispatch:
    inputs:
      perspective_user_id:
        description: "Optional Sleeper user ID for team perspective; blank = league view"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fsffl-gm30
  cancel-in-progress: false

jobs:
  gm30:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve GM perspective
        shell: bash
        run: |
          if [ -n "${{ inputs.perspective_user_id }}" ]; then
            echo "GM30_USER_ID=${{ inputs.perspective_user_id }}" >> "$GITHUB_ENV"
          elif [ -n "${{ vars.GM30_USER_ID }}" ]; then
            echo "GM30_USER_ID=${{ vars.GM30_USER_ID }}" >> "$GITHUB_ENV"
          else
            echo "No team perspective supplied; GM 3.0 will run in league-view mode."
          fi

      - name: Build GM 3.0 prospect intelligence
        run: python script/build_gm30_prospect_engine.py

      - name: Normalize prospect-board contract
        shell: bash
        run: |
          mkdir -p data/gm
          if [ -f data/gm/gm30_prospect_radar.json ]; then
            cp data/gm/gm30_prospect_radar.json data/gm/prospect_board.json
          fi

      - name: Build GM 3.0 calibration audit
        run: python script/build_gm30_calibration.py

      - name: Build GM 3.0
        run: python script/build_fsffl_gm30.py

      - name: Run GM 3.0 architecture validation gate
        run: python script/validate_gm30.py

      - name: Show GM 3.0 output summary
        shell: bash
        run: |
          echo "GM 3.0 validation passed."
          find data/gm -maxdepth 2 -type f -print | sort

      - name: Commit validated GM 3.0 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gm/

          if git diff --cached --quiet; then
            echo "No GM 3.0 output changes to commit."
          else
            git commit -m "Build validated FSFFL GM 3.0 outputs"
            git push origin HEAD:main
          fi
