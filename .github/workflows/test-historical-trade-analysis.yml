name: Test Historical Trade Analysis

on:
  pull_request:
    paths:
      - 'script/run_historical_trade_analysis.py'
      - 'script/render_historical_trade_report.py'
      - 'script/fsffl_historical_state_provider.py'
      - 'script/build_behavioral_action_context.py'
      - '.github/workflows/test-historical-trade-analysis.yml'
  workflow_dispatch:

jobs:
  historical-trade-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install reportlab pypdf
      - name: Compile
        run: python -m py_compile script/run_historical_trade_analysis.py script/render_historical_trade_report.py
      - name: Run known 2023 Josh Allen trade
        run: |
          python script/run_historical_trade_analysis.py \
            --season 2023 \
            --transaction-id 950954472107368448 \
            --output /tmp/historical-trade.json
          python script/render_historical_trade_report.py \
            --input /tmp/historical-trade.json \
            --output /tmp/FSFFL_Historical_Trade_Analysis.pdf
      - name: Validate no hindsight leakage and point-in-time state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          d=json.loads(Path('/tmp/historical-trade.json').read_text())
          assert d['model_version']=='FSFFL-GM-Historical-Trade-Analysis-1.0'
          assert d['transaction_id']=='950954472107368448'
          assert d['season']==2023
          assert d['policy']['decision_quality_uses_only_information_available_before_trade'] is True
          assert d['policy']['same_season_future_results_leakage_forbidden'] is True
          assert d['policy']['outcome_grade_separate_from_process_grade'] is True
          assert d['policy']['exact_historical_market_values_are_not_invented'] is True
          assert d['policy']['alternate_history_state_provider_reused'] is True
          assert len(d['sides'])==2
          assert d['historical_state_provider']['source'] in {'incremental_reverse_transaction_cache','timestamp_reverse_replay'}
          for side in d['sides'].values():
              q=side['decision_quality_at_time']
              assert q['uses_same_season_future_results'] is False
              assert q['exact_historical_market_value_used'] is False
              assert q['grade'] in {'A','B','C','D','F'}
              assert 0.25 <= float(q['confidence']) <= 1.0
              assert side['pretrade_roster']['summary']['roster_size'] > 0
          pdf=PdfReader('/tmp/FSFFL_Historical_Trade_Analysis.pdf')
          assert len(pdf.pages)==1
          print(json.dumps({
              'trade_time_utc':d['trade_time_utc'],
              'state':d['historical_state_provider'],
              'grades':{u:s['decision_quality_at_time'] for u,s in d['sides'].items()},
          },indent=2))
          PY
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-trade-analysis-audit
          path: |
            /tmp/historical-trade.json
            /tmp/FSFFL_Historical_Trade_Analysis.pdf
          if-no-files-found: error
          retention-days: 14
