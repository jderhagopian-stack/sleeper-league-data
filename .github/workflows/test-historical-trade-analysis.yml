name: Test Historical Trade Analysis

on:
  pull_request:
    paths:
      - 'script/run_historical_trade_analysis.py'
      - 'script/historical_trade_gm3_adapter.py'
      - 'script/build_historical_gm3_bundle.py'
      - 'data/historical_gm3/sources/**'
      - 'script/render_historical_trade_report.py'
      - 'script/run_roster_decision_lab.py'
      - 'script/fsffl_historical_state_provider.py'
      - 'script/build_behavioral_action_context.py'
      - '.github/workflows/test-historical-trade-analysis.yml'
  workflow_dispatch:

jobs:
  historical-trade-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install reportlab pypdf
      - name: Compile
        run: python -m py_compile script/run_historical_trade_analysis.py script/historical_trade_gm3_adapter.py script/build_historical_gm3_bundle.py script/render_historical_trade_report.py script/run_roster_decision_lab.py script/run_team_improvement_lab.py
      - name: Validate shared intrinsic-market separation
        run: |
          python - <<'PY'
          import copy, importlib.util
          from pathlib import Path
          path=Path('script/build_fsffl_gm_engine.py')
          spec=importlib.util.spec_from_file_location('gm_intrinsic_contract',path)
          gm=importlib.util.module_from_spec(spec); spec.loader.exec_module(gm)
          projections={'players':{
              'A':{'season_baseline_ppg':22.0,'position':'QB'},
              'B':{'season_baseline_ppg':16.0,'position':'QB'},
              'C':{'season_baseline_ppg':14.0,'position':'RB'},
              'D':{'season_baseline_ppg':11.0,'position':'WR'},
          }}
          base={
              'A':{'position':'QB','age':26,'market_dynasty':1000},
              'B':{'position':'QB','age':27,'market_dynasty':2000},
              'C':{'position':'RB','age':23,'market_dynasty':3000},
              'D':{'position':'WR','age':24,'market_dynasty':4000},
          }
          changed=copy.deepcopy(base)
          changed['A']['market_dynasty']=99999
          changed['B']['market_dynasty']=1
          a=gm.build_intrinsic_player_values(copy.deepcopy(base),projections)
          b=gm.build_intrinsic_player_values(copy.deepcopy(changed),projections)
          assert {k:v['intrinsic_dynasty'] for k,v in a.items()} == {k:v['intrinsic_dynasty'] for k,v in b.items()}
          x={'intrinsic_dynasty':5000,'market_dynasty':1}
          y={'intrinsic_dynasty':5000,'market_dynasty':99999}
          assert gm.fsffl_league_value(x)==gm.fsffl_league_value(y)==5000
          print('Intrinsic valuation is invariant to market-price changes.')
          PY
      - name: Validate intrinsic pick curve
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path('script/build_fsffl_gm_engine.py')
          spec=importlib.util.spec_from_file_location('gm_pick_curve',path)
          gm=importlib.util.module_from_spec(spec); spec.loader.exec_module(gm)
          vals={}
          for i,v in enumerate(range(600,10001,200),1):
              vals[str(i)]={'intrinsic_dynasty':float(v)}
          p106=gm.intrinsic_pick_value(2023,1,vals,2023,slot=6)
          fut1=gm.intrinsic_pick_value(2024,1,vals,2023,tier='mid')
          fut2=gm.intrinsic_pick_value(2025,1,vals,2023,tier='mid')
          fut3=gm.intrinsic_pick_value(2026,1,vals,2023,tier='mid')
          early=gm.intrinsic_pick_value(2023,1,vals,2023,slot=2)
          late=gm.intrinsic_pick_value(2023,1,vals,2023,slot=10)
          assert early > p106 > late
          assert p106 > fut1 > fut2 > fut3
          assert fut2 < p106 * .80
          print({'1.02':early,'1.06':p106,'1.10':late,'future1':fut1,'future2':fut2,'future3':fut3})
          PY
      - name: Build frozen April 2023 GM3 inputs
        run: |
          python script/build_historical_gm3_bundle.py \
            --season 2023 \
            --transaction-id 950954472107368448 \
            --output data/historical_gm3/2023/950954472107368448.json
      - name: Run known 2023 Josh Allen trade through GM3
        run: |
          python script/run_historical_trade_analysis.py \
            --season 2023 \
            --transaction-id 950954472107368448 \
            --sims 1000 \
            --output /tmp/historical-trade.json
          python script/render_historical_trade_report.py \
            --input /tmp/historical-trade.json \
            --output /tmp/FSFFL_Historical_Trade_Analysis.pdf
      - name: Validate GM3 wrapper and no fallback scoring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          d=json.loads(Path('/tmp/historical-trade.json').read_text())
          assert d['model_version']=='FSFFL-GM-Historical-Trade-Analysis-1.2'
          assert d['transaction_id']=='950954472107368448'
          assert d['season']==2023
          assert d['policy']['historical_module_is_time_travel_wrapper_not_scoring_model'] is True
          assert d['policy']['same_gm3_core_as_current_trade_analysis'] is True
          assert d['policy']['same_season_future_results_leakage_forbidden'] is True
          assert d['policy']['outcome_layer_separate_from_decision_layer'] is True
          assert d['policy']['hindsight_traces_draft_conversions_and_downstream_trades'] is True
          assert d['policy']['mixed_lineage_attribution_is_flagged_not_overclaimed'] is True
          assert d['policy']['keep_assets_reference_is_descriptive_not_causal_counterfactual'] is True
          assert d['policy']['hindsight_winner_requires_dominance_on_production_and_remaining_value'] is True
          assert d['policy']['current_player_values_not_backfilled_into_historical_grade'] is True
          assert d['policy']['standalone_v1_process_score_retired'] is True
          assert d['policy']['missing_historical_inputs_result_in_not_graded'] is True
          assert d['policy']['alternate_history_state_provider_reused'] is True
          assert d['gm3_evaluation']['standalone_historical_score_used'] is False
          assert d['gm3_evaluation']['current_values_used'] is False
          assert d['gm3_evaluation']['status']=='GRADED_BY_GM3_CORE'
          assert d['gm3_evaluation']['n_sims']==1000
          assert d['gm3_evaluation']['same_gm3_core_as_current_trade_analysis'] is True
          assert d['gm3_evaluation']['baseline_lineup_source']=='frozen_bundle_cache'
          assert d['gm3_evaluation']['package_economics_source']=='canonical_GM3_nonlinear_package_effective_value'
          assert d['gm3_evaluation']['standalone_historical_score_used'] is False
          assert d['gm3_evaluation']['current_values_used'] is False
          assert d['gm3_evaluation']['input_bundle_provenance']['same_season_results_used'] is False
          assert d['gm3_evaluation']['input_bundle_provenance']['future_schedule_used'] is False
          assert d['gm3_evaluation']['input_bundle_provenance']['completed_draft_pick_rows_used_for_slot_resolution'] is False
          assert d['gm3_evaluation']['input_bundle_provenance']['draft_slot_source']=='sleeper_draft_order_metadata_no_pick_results'
          assert d['gm3_evaluation']['input_bundle_provenance']['resolved_draft_slots_by_original_roster_id'].get('1')==6
          assert d['gm3_evaluation']['input_bundle_provenance']['external_market_anchor_is_final_value'] is False
          assert d['gm3_evaluation']['input_bundle_provenance']['external_market_anchor_used_in_intrinsic_value'] is False
          assert d['gm3_evaluation']['input_bundle_provenance']['valuation_architecture']=='Intrinsic FSFFL Value -> Market Sanity Check -> Team-Specific Value'
          assert d['gm3_evaluation']['input_bundle_provenance']['final_team_specific_value_source']=='GM3_intrinsic_plus_team_specific_buy_hold_plus_strategic_profile_plus_trade_impact'
          assert d['gm3_evaluation']['input_bundle_provenance']['incoming_assets_use_team_specific_buy_values'] is True
          assert d['gm3_evaluation']['input_bundle_provenance']['canonical_package_economics_available'] is True
          assert d['gm3_evaluation']['input_bundle_provenance']['frozen_historical_state_injected_into_strategic_profiles'] is True
          assert d['gm3_evaluation']['input_bundle_provenance']['frozen_historical_state_injected_into_package_economics'] is True
          for uid,row in d['gm3_evaluation']['team_results'].items():
              pkg_state=((row.get('strategic') or {}).get('trade_strategic_utility') or {}).get('team_state')
              assert pkg_state == row.get('team_state'), (uid,pkg_state,row.get('team_state'))
          assert 'decision_quality_at_time' not in next(iter(d['sides'].values()))
          assert len(d['sides'])==2
          assert d['historical_state_provider']['source'] in {'incremental_reverse_transaction_cache','timestamp_reverse_replay'}
          assert d['historical_state_provider']['analysis_state_source_mode']=='frozen_bundle_snapshot'
          pdf=PdfReader('/tmp/FSFFL_Historical_Trade_Analysis.pdf')
          assert len(pdf.pages)==2
          page1=pdf.pages[0].extract_text() or ''
          page2=pdf.pages[1].extract_text() or ''
          text=page1+'\n'+page2
          page1_flat=' '.join(page1.split())
          page2_flat=' '.join(page2.split())
          assert 'ANALYSIS AT THE TIME' in page1
          assert 'WHAT THE ASSETS BECAME & WHAT THEY PRODUCED' not in page1
          assert 'DEAL IN HINDSIGHT' in page2
          assert 'WHAT THE ASSETS BECAME & WHAT THEY PRODUCED' in page2
          assert 'HOLD-THE-ORIGINAL-ASSETS REFERENCE' in page2
          assert 'FINAL RETROSPECTIVE VERDICT' in page2
          assert 'Fantasy production received since the trade' in page2_flat
          assert 'Hold-reference totals' in page2
          assert 'AUDIT / METHODOLOGY NOTES' not in page1
          assert 'AUDIT / METHODOLOGY NOTES' in page2
          assert '2023 1.06' in page1 and '2025 1.09' in page1 and '2025 2.03' in page1
          assert 'Jaxon Smith-Njigba' not in page1
          assert 'Quinshon Judkins' not in page1
          assert 'Bhayshul Tuten' not in page1
          assert 'Overall Team Fit' not in page1
          assert 'Package value' not in page1
          assert 'current intrinsic value' not in text
          assert 'Long-term trade value' in page1_flat
          assert 'Overall deal effect' in page1_flat
          assert 'Model points are relative trade-value scores' in page1_flat
          assert 'percentage points' in page1_flat
          assert 'season-long swing' in page1_flat
          assert 'asset genealogy' not in text.lower()
          assert 'asset tree' not in text.lower()
          assert 'If a later trade mixed these assets with unrelated pieces' in page2_flat
          assert 'Trade-chain note' in page2
          assert 'Fantasy production received since the trade' in page2_flat
          assert 'RETOOL - Balancing current competitiveness with future value' in page1_flat
          assert 'league fantasy points' in page2_flat
          assert 'very high remaining value' in page2_flat
          assert 'remaining value' in page2.lower()
          assert 'pick:2023:R1:orig1' not in text
          for uid,side in d['sides'].items():
              assert 'hindsight' in side
              lin=side['hindsight']['asset_lineage']
              assert 'terminal_assets' in lin
              assert 'events' in lin
              assert side['hindsight']['keep_assets_reference']['note']
              assert 'captured_production' in lin
              assert lin['captured_production']['captured_fsffl_points'] >= 0
              keep=side['hindsight']['keep_assets_reference']
              assert 'observed_reference_points' in keep
              assert 'current_reference_intrinsic_value' in keep
          assert d['hindsight_assessment']['classification'] in {'CLEAR_HINDSIGHT_EDGE','SPLIT_HINDSIGHT_RESULT','NEAR_EVEN_HINDSIGHT'}
          hd=d['gm3_evaluation']['team_results']['833709164739014656']
          assert hd['decision']['band']!='needs_context'
          assert hd['decision']['market_value_used_for_decision_label'] is False
          print(json.dumps({
              'trade_time_utc':d['trade_time_utc'],
              'state':d['historical_state_provider'],
              'gm3_status':d['gm3_evaluation']['status'],
              'assessment':d['gm3_evaluation'].get('bilateral_assessment'),
              'team_results':{u:{
                  'state':r.get('team_state'),
                  'state_evidence':r.get('team_state_evidence'),
                  'decision':r.get('decision'),
                  'utility':r.get('state_aware_utility_delta'),
                  'delta':r.get('delta'),
                  'strategic':r.get('strategic'),
                  'intrinsic_dynasty_delta':(r.get('strategic') or {}).get('intrinsic_dynasty_delta'),
                  'market_dynasty_delta':(r.get('strategic') or {}).get('market_dynasty_delta'),
                  'package_effective_value_delta':(r.get('strategic') or {}).get('package_effective_value_delta'),
                  'package_economics_model':(r.get('strategic') or {}).get('package_economics_model')
              } for u,r in d['gm3_evaluation'].get('team_results',{}).items()},
          },indent=2))
          PY
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-trade-analysis-josh-allen-gm3
          path: |
            /tmp/historical-trade.json
            /tmp/FSFFL_Historical_Trade_Analysis.pdf
            data/historical_gm3/2023/950954472107368448.json
          if-no-files-found: error
          retention-days: 14
