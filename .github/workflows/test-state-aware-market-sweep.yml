name: Test State-Aware Market Sweep

on:
  pull_request:
    paths:
      - 'script/decision_lab_state_aware.py'
      - 'script/gm_state_weighting.py'
      - 'script/calibrate_gm_state_weights.py'
      - 'script/run_trade_market_sweep_v20.py'
      - 'script/run_trade_market_sweep_v23.py'
      - 'script/negotiation_ranking.py'
      - 'data/gm/state_weight_calibration.json'
      - '.github/workflows/test-state-aware-market-sweep.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Compile state-aware modules
        run: python -m py_compile script/decision_lab_state_aware.py script/gm_state_weighting.py script/calibrate_gm_state_weights.py script/run_trade_market_sweep_v20.py script/run_trade_market_sweep_v23.py script/negotiation_ranking.py
      - name: Verify continuous weights and no threshold cliffs
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('script/gm_state_weighting.py'); spec=importlib.util.spec_from_file_location('w',p); w=importlib.util.module_from_spec(spec); spec.loader.exec_module(w)
          cal=w.load_calibration()
          xs=[0,.10,.349,.350,.351,.549,.550,.551,.779,.780,.781,.90,1.0]
          vals=[w.interpolate(x,cal['anchor_points']) for x in xs]
          assert all(abs(sum(v.values())-1.0)<1e-5 for v in vals)
          assert all(vals[i]['current'] <= vals[i+1]['current']+1e-6 for i in range(len(vals)-1))
          assert all(vals[i]['future'] >= vals[i+1]['future']-1e-6 for i in range(len(vals)-1))
          assert abs(vals[8]['current']-vals[9]['current']) < .01
          assert abs(vals[4]['current']-vals[5]['current']) < .05
          hsg=w.resolve({'contender_score':.20,'dynasty_roster_score':.458,'user_id':'846634401482792960'})
          hsg2=w.resolve({'contender_score':.90,'dynasty_roster_score':.458,'user_id':'846634401482792960'})
          assert hsg['weights']==hsg2['weights'], (hsg,hsg2)
          assert hsg['inputs']['competitive_strength_score'] > .80
          assert hsg['adjustments']['championship_future_to_current']==0
          weak=w.resolve({'contender_score':.50,'dynasty_roster_score':.10,'user_id':'846634401482792960'})
          assert weak['weights']['future'] > hsg['weights']['future']
          print('Competitive-strength weighting is normalized, monotone, cliff-free, and separated from roster strength')
          PY
      - name: Verify runtime isolation and fallback
        run: |
          python - <<'PY'
          import importlib.util, time
          from pathlib import Path
          p=Path('script/gm_state_weighting.py'); spec=importlib.util.spec_from_file_location('w',p); w=importlib.util.module_from_spec(spec); spec.loader.exec_module(w)
          league=__import__('json').loads(w.LEAGUE_PATH.read_text())
          season=str(league.get('season'))
          allowed={
              w.CALIBRATION_PATH.resolve(), w.SIM_CONTEXT_PATH.resolve(), w.LEAGUE_PATH.resolve(),
              (w.DATA/'simulator'/season/'outputs'/'standings_projection.json').resolve(),
              (w.DATA/'simulator'/season/'outputs'/'season_simulation.json').resolve(),
          }; original=Path.read_text; seen=[]
          def guarded(self,*a,**k):
              rp=self.resolve(); seen.append(rp); assert rp in allowed, f'unexpected file read: {rp}'; return original(self,*a,**k)
          Path.read_text=guarded
          try:
              w.load_calibration.cache_clear(); w.simulator_index.cache_clear(); start=time.perf_counter()
              for i in range(1000): w.resolve({'contender_score':(i%100)/100,'dynasty_roster_score':.4,'user_id':'none'}, simulator_row={'championship_probability':.08})
              elapsed=time.perf_counter()-start
          finally: Path.read_text=original
          assert elapsed < 1.0; assert all(x in allowed for x in seen)
          print(f'1000 runtime resolutions completed in {elapsed:.4f}s; no historical reads')
          PY
      - name: Verify offline calibrator is isolated
        run: |
          python script/calibrate_gm_state_weights.py --input /tmp/does-not-exist.json --output /tmp/candidate.json --report /tmp/report.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/report.json')); c=json.load(open('/tmp/candidate.json'))
          assert r['status']=='INSUFFICIENT_EVIDENCE_KEEP_PRIOR'; assert r['promotion_allowed'] is False; assert 'PRIOR_RETAINED' in c['status']
          assert r['eligible_sample']==0
          PY
      - name: Verify component outcomes cannot self-identify state weights
        run: |
          python - <<'PY'
          import json
          rows=[]
          for season in (2023,2024,2025):
              for i in range(20):
                  rows.append({
                    'inputs':{'contender_score':(i%10)/10},
                    'outcome':{
                      'current_success':0.8,'future_value_success':0.2,
                      'liquidity_success':0.5,'resilience_success':0.5
                    },
                    'metadata':{'season':season}
                  })
          json.dump(rows,open('/tmp/unlabeled-state-training.json','w'))
          PY
          python script/calibrate_gm_state_weights.py --input /tmp/unlabeled-state-training.json --output /tmp/unlabeled-candidate.json --report /tmp/unlabeled-report.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/unlabeled-report.json'))
          assert r['sample']==60
          assert r['eligible_sample']==0
          assert r['excluded_without_independent_target']==60
          assert r['promotion_allowed'] is False
          assert r['status']=='INSUFFICIENT_EVIDENCE_KEEP_PRIOR'
          print('Unlabeled component outcomes cannot promote state weights')
          PY
      - name: Verify state changes ranking emphasis
        run: |
          python - <<'PY'
          import copy, importlib.util
          from pathlib import Path
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,Path(path)); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); return m
          m=load('script/run_trade_market_sweep_v20.py','v20'); w=load('script/gm_state_weighting.py','weights')
          class E:
              @staticmethod
              def contender_title_cap(state): return {'elite_contender':.025,'contender':.03,'retool':.06}.get(state)
          base={'plausibility_score':.7,'plausibility':'HIGH','simulation':{'focus_delta':{'championship_probability':0,'playoff_probability':0,'expected_wins':0,'expected_points_for':0},'net_title_equity_swing_against_focus':0,'strategic':{'market_dynasty_delta':1000,'break_glass_delta':1000,'liquidity_value_delta':1000,'strategic_value_delta':1000,'optionality_value_delta':1000}}}
          rebuild=copy.deepcopy(base); rebuild['simulation']['strategic']['objective_weights']=w.resolve({'contender_score':.15,'dynasty_roster_score':.3},simulator_row={'championship_probability':.01})['weights']
          elite=copy.deepcopy(base); elite['simulation']['strategic']['objective_weights']=w.resolve({'contender_score':.9,'dynasty_roster_score':.8},simulator_row={'championship_probability':.20})['weights']
          assert m.state_aware_post_sim_score(E,rebuild,'rebuild') > m.state_aware_post_sim_score(E,elite,'elite_contender')
          PY
      - name: Run state-aware market sweep smoke scenario
        run: |
          SECONDS=0
          python script/run_trade_market_sweep_v20.py --scenario data/decision_lab/full_validation_scenario.json --quick-sims 100 --confirm-sims 0 --search-depth 40 --output /tmp/state-aware-market-sweep.json > /tmp/state-aware-market-sweep.log
          test "$SECONDS" -le 180
      - name: Validate hypothetical profiles and final ranking provenance
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/state-aware-market-sweep.json')); assert d['model_version']=='FSFFL-Counter-Market-Sweep-1.14'
          p=d['policy']; assert p['focal_post_trade_gm_profiles_recomputed'] is True; assert p['continuous_state_weighting'] is True; assert p['final_negotiation_ranking_uses_state_aware_post_sim_score'] is True
          cur=d['current_offer_evaluation']['simulation']['strategic']; assert cur['hypothetical_profiles_recomputed'] is True; assert abs(sum(cur['objective_weights'].values())-1)<1e-5; assert all(x['profile_source']=='post_trade_focal_gm' for x in cur['received'])
          for row in d['top_5_alternatives']:
              nr=row['negotiation_ranking']; assert nr['focal_strategic_gain_source']=='state_aware_post_sim_score'; assert abs(float(nr['state_aware_post_sim_score'])-float(row['post_sim_score']))<1e-6
              assert nr['ranking_model_version']=='FSFFL-Negotiation-Ranking-2.0'
              assert nr['weights']=={'focal_strategic_gain':0.625,'acceptance_fit':0.375,'owner_behavior_match':0.0}
          print('Final negotiation ranking preserves GM 3.0 state-aware utility')
          PY
