name: Native Projection Opening Role

on:
  pull_request:
    paths:
      - 'script/run_native_projection_opening_role_benchmark.py'
      - '.github/workflows/native-projection-opening-role.yml'
      - 'script/native_projection_challenger.py'
      - 'script/run_native_projection_nflverse_benchmark.py'
      - 'script/run_native_projection_core_context_benchmark.py'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run opening-role benchmark
        run: python script/run_native_projection_opening_role_benchmark.py
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: native-projection-opening-role
          path: data/model_validation/native_projection_opening_role_benchmark.json
