name: One-off Skattebo Trade Report 2026-08-27

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-skattebo-trade-20260827.yml'

jobs:
  trade-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Write scenario
        run: |
          cat > /tmp/skattebo-trade.json <<'JSON'
          {
            "scenario_id": "hurts-so-good-skattebo-offer-2026-08-27",
            "description": "Hurts So Good receives Cam Skattebo from Chef Niners for Rhamondre Stevenson and the 2027 2nd originally belonging to Ball Knower (ddersimon).",
            "focus_user_id": "846634401482792960",
            "participant_user_ids": ["846634401482792960","709546576091090944"],
            "transaction_status": "proposed",
            "actions": [
              {
                "type": "trade",
                "from_user_id": "846634401482792960",
                "to_user_id": "709546576091090944",
                "players": ["7611"],
                "picks": ["pick:2027:R2:orig5"]
              },
              {
                "type": "trade",
                "from_user_id": "709546576091090944",
                "to_user_id": "846634401482792960",
                "players": ["12481"],
                "picks": []
              }
            ]
          }
          JSON
      - name: Run canonical trade pipeline
        run: |
          mkdir -p /tmp/trade-output
          python script/run_trade_report.py \
            --scenario /tmp/skattebo-trade.json \
            --out-dir /tmp/trade-output \
            --basename skattebo-trade-report \
            --quick-sims 200 \
            --adaptive-confirm-sims 1000 \
            --search-depth 60
      - name: Show summary
        run: cat /tmp/trade-output/skattebo-trade-report-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: skattebo-trade-report-20260827
          path: /tmp/trade-output/*
          if-no-files-found: error
          retention-days: 30
