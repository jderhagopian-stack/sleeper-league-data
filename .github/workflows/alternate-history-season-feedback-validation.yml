name: Alternate History Season Feedback Validation

on:
  pull_request:
    paths:
      - 'script/alternate_history_branch_scoring.py'
      - 'script/alternate_history_maxpf.py'
      - 'script/alternate_history_postseason.py'
      - 'script/run_fsffl_multiseason_particle_replay.py'
      - 'script/run_fsffl_multiseason_particle_replay_v3.py'
      - 'script/run_fsffl_season_boundary_particles.py'
      - 'script/validate_fsffl_fork_season_feedback.py'
      - 'script/validate_fsffl_season_boundary_particles.py'
      - 'script/run_fsffl_historical_usage_policy.py'
      - 'data/stats/fsffl/**'
      - 'data/alternate_history/**'
      - '.github/workflows/alternate-history-season-feedback-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-season-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile season feedback modules
        run: |
          python -m py_compile script/alternate_history_branch_scoring.py
          python -m py_compile script/alternate_history_maxpf.py
          python -m py_compile script/alternate_history_postseason.py
          python -m py_compile script/run_fsffl_multiseason_particle_replay.py
          python -m py_compile script/run_fsffl_multiseason_particle_replay_v3.py
          python -m py_compile script/run_fsffl_season_boundary_particles.py
          python -m py_compile script/validate_fsffl_fork_season_feedback.py
          python -m py_compile script/validate_fsffl_season_boundary_particles.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Validate fork-season standings and nonplayoff draft slots
        run: python script/validate_fsffl_fork_season_feedback.py
      - name: Validate full season-boundary playoffs and draft slots
        run: python script/validate_fsffl_season_boundary_particles.py
