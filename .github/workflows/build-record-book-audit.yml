name: Build FSFFL Record Book Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-record-book-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build audited record-book datasets
        run: python script/build_record_book_audit.py

      - name: Show audit report
        run: cat data/record_book/audit_report.json

      - name: Commit generated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/record_book/

          if git diff --cached --quiet; then
            echo "No record-book data changes to commit."
          else
            git commit -m "Build audited FSFFL record book data"
            git push
          fi
