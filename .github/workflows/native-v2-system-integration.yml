name: Provisional Projection Ensemble System Integration

on:
  pull_request:
    paths:
      - 'script/publish_preseason_projection_ensemble.py'
      - 'script/run_native_preseason_production.py'
      - 'script/build_native_preseason_projections.py'
      - 'script/nativeize_no_history_output.py'
      - '.github/workflows/native-v2-system-integration.yml'
  push:
    branches: [main]
    paths:
      - 'script/publish_preseason_projection_ensemble.py'
      - 'script/run_native_preseason_production.py'
      - 'script/build_native_preseason_projections.py'
      - 'script/nativeize_no_history_output.py'
      - '.github/workflows/native-v2-system-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-system:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install simulator dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile ensemble publication path
        run: |
          python -m py_compile script/run_native_preseason_production.py
          python -m py_compile script/publish_preseason_projection_ensemble.py
      - name: Self-test ensemble publisher
        run: python script/publish_preseason_projection_ensemble.py --self-test
      - name: Refresh mapping and ECR QC sources
        run: python script/build_fsffl_player_projections.py
      - name: Build incumbent Razzball reference baseline
        run: python script/build_fsffl_scoring_baseline.py
      - name: Build validated FSFFL Native V2 challenger projections
        run: python script/run_native_preseason_production.py --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Publish evidence-respecting provisional ensemble
        run: python script/publish_preseason_projection_ensemble.py --season 2026
      - name: Validate ensemble authority and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/simulator/2026/sources/preseason_fsffl_points.json')
          x=json.loads(p.read_text())
          assert x['source']=='FSFFL 2026 PERSONAL_RESEARCH_PROVISIONAL_ENSEMBLE'
          a=x['authority']
          assert a['role']=='SIMULATOR_PRESEASON_PLAYER_PROJECTION_AUTHORITY'
          assert a['deployment_context']=='PERSONAL_RESEARCH'
          assert a['commercial_default_eligible'] is False
          assert a['policy']['QB']=='Razzball incumbent 100%'
          assert a['policy']['RB']=='Razzball incumbent 100%'
          assert a['policy']['WR'].startswith('50% Razzball')
          assert a['policy']['TE'].startswith('50% Razzball')
          assert a['learned_weights_used'] is False
          assert x['audit']['published_players'] >= 220
          assert x['audit']['missing_required_native_wr_te'] == 0
          assert Path('data/simulator/2026/sources/razzball_preseason_fsffl_points_reference.json').exists()
          assert Path('data/simulator/2026/sources/native_preseason_fsffl_points.json').exists()
          policies={r.get('position'):r.get('projection_source_policy') for r in x['players'].values()}
          assert policies['QB']=='RAZZBALL_INCUMBENT'
          assert policies['RB']=='RAZZBALL_INCUMBENT'
          assert policies['WR']=='EQUAL_WEIGHT_RAZZBALL_NATIVE'
          assert policies['TE']=='EQUAL_WEIGHT_RAZZBALL_NATIVE'
          print({'source':x['source'],'players':len(x['players']),'counts':x['audit']['source_counts']})
          PY
      - name: Build NFL schedule and matchup layer
        run: python script/build_fsffl_nfl_schedule_matchups.py
      - name: Build FSFFL weekly projections from ensemble authority
        run: python script/build_fsffl_weekly_projections.py
      - name: Apply dynamic in-season updates
        run: python script/apply_fsffl_dynamic_updates.py
      - name: Run 50,000-simulation season model
        env:
          FSFFL_SIMULATIONS: '50000'
        run: python script/run_fsffl_season_simulator.py
      - name: Validate fresh Simulator outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('data/simulator/2026/sources/preseason_fsffl_points.json').read_text())
          weekly=json.loads(Path('data/simulator/2026/inputs/player_weekly_projections.json').read_text())
          standings=json.loads(Path('data/simulator/2026/outputs/standings_projection.json').read_text())
          validation=json.loads(Path('data/simulator/2026/outputs/validation_report.json').read_text())
          assert src['source']=='FSFFL 2026 PERSONAL_RESEARCH_PROVISIONAL_ENSEMBLE'
          players=weekly.get('players') or weekly.get('player_projections') or {}
          assert len(players) >= 200
          assert len(standings.get('teams') or []) == 12
          assert validation.get('validation_passed') is True
          assert standings.get('generated_at_utc')
          print({'weekly_players':len(players),'teams':12,'generated_at':standings['generated_at_utc']})
          PY
      - name: Promote fresh Simulator outputs into canonical GM context
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'script')
          import build_fsffl_gm30 as gm30
          season=gm30.active_season()
          gm30.promote_universal_outputs(season)
          print(f'Promoted fresh Simulator outputs into GM context for {season}.')
          PY
      - name: Validate GM Simulator context freshness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          standings=json.loads(Path('data/simulator/2026/outputs/standings_projection.json').read_text())
          validation=json.loads(Path('data/simulator/2026/outputs/validation_report.json').read_text())
          ctx=json.loads(Path('data/gm/league/simulator_context.json').read_text())
          assert ctx.get('teams') == standings.get('teams')
          assert ctx.get('validation') == validation
          assert ctx.get('simulator_model_version') == standings.get('model_version')
          assert len(ctx.get('teams') or []) == 12
          print({'status':'PASS','teams':12,'simulator_generated_at':standings.get('generated_at_utc')})
          PY
      - name: Generate League Intelligence against refreshed Simulator context
        run: |
          python script/league_intelligence/application.py \
            --focus-user-id 846634401482792960 \
            --team-context data/league_intelligence/hurts_so_good_team_context.json \
            --output /tmp/provisional-ensemble-league-intelligence.json
      - name: Persist authoritative ensemble and Simulator state
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/simulator/2026/sources/preseason_fsffl_points.json \
            data/simulator/2026/sources/native_preseason_fsffl_points.json \
            data/simulator/2026/sources/native_raw_stat_projections.json \
            data/simulator/2026/sources/razzball_preseason_fsffl_points_reference.json \
            data/simulator/2026/inputs/player_weekly_projections.json \
            data/simulator/2026/outputs/ \
            data/gm/league/simulator_context.json
          if git diff --cached --quiet; then
            echo "No authoritative ensemble state changes to commit."
          else
            git commit -m "Refresh 2026 system with provisional FSFFL projection ensemble"
            git push origin HEAD:main
          fi
      - name: Upload full ensemble integration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: provisional-projection-ensemble-system-run
          path: |
            data/simulator/2026/sources/preseason_fsffl_points.json
            data/simulator/2026/sources/native_preseason_fsffl_points.json
            data/simulator/2026/sources/native_raw_stat_projections.json
            data/simulator/2026/sources/razzball_preseason_fsffl_points_reference.json
            data/simulator/2026/inputs/player_weekly_projections.json
            data/simulator/2026/outputs/
            data/gm/league/simulator_context.json
            /tmp/provisional-ensemble-league-intelligence.json
          retention-days: 14
