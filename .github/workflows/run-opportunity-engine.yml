name: Run Opportunity Engine
on:
  workflow_dispatch:
    inputs:
      focus_user_id: {description: 'Sleeper user id', required: true, default: '846634401482792960', type: string}
  push:
    branches: [main]
    paths: ['.oe-run-request.json']
jobs:
  opportunity-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    env:
      FOCUS_USER_ID: ${{ inputs.focus_user_id || '846634401482792960' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install runtime dependencies
        run: python -m pip install numpy 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Build full fantasy-relevant projection universe
        run: python script/build_fsffl_full_projection_universe.py
      - name: Refresh Behavioral Intelligence cache
        run: python script/refresh_behavioral_intelligence_v3.py
      - name: Run Opportunity Engine executable-opportunity search
        run: |
          mkdir -p /tmp/opportunity-engine
          python script/opportunity_engine/application_v2.py --focus-user-id "$FOCUS_USER_ID" --quick-sims 500 --confirm-sims 2500 --trade-screen 75 --waiver-screen 50 --trade-packages-per-target 12 --confirm-top 15 --portfolio-depth 15 --portfolio-max-moves 3 --portfolio-beam-width 10 --portfolio-sims 1000 --portfolio-confirm-sims 5000 --portfolio-confirm-top 3 --trade-review-depth 3 --trade-review-confirm-sims 50000 --output /tmp/opportunity-engine/opportunity-board.json | tee /tmp/opportunity-engine/summary.log
      - name: Render reports
        run: |
          python script/render_opportunity_engine_report.py --input /tmp/opportunity-engine/opportunity-board.json --output /tmp/opportunity-engine/Opportunity_Engine_Report.md
          python script/render_opportunity_engine_pdf.py --input /tmp/opportunity-engine/opportunity-board.json --output /tmp/opportunity-engine/Opportunity_Engine_Report.pdf
      - name: Validate governed executable-opportunity output
        run: |
          python - <<'PY'
          import json
          b=json.load(open('/tmp/opportunity-engine/opportunity-board.json'))
          assert b['model_version']=='FSFFL-Opportunity-Engine-2.1'
          assert b['policy']['creates_new_valuation_model'] is False
          assert b['policy']['creates_new_cross_channel_utility'] is False
          assert b['policy']['negotiation_frontier_creates_new_utility'] is False
          assert b['policy']['heuristic_acceptance_fit_is_probability'] is False
          assert b['policy']['theoretical_counterparty_failures_can_be_headline_action'] is False
          assert b['capability_status']['negotiation_frontier'] is True
          f=b['negotiation_frontier']; assert f['policy']['no_arbitrary_utility_acceptance_exchange_rate'] is True
          assert b['portfolio_optimization']['excludes_theoretical_counterparty_failures'] is True
          print('Opportunity Engine 2.1 executable-opportunity governance passed')
          PY
      - name: Validate PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          p=Path('/tmp/opportunity-engine/Opportunity_Engine_Report.pdf'); assert p.exists() and p.stat().st_size>5000; assert len(PdfReader(str(p)).pages)>=2
          PY
      - uses: actions/upload-artifact@v4
        with: {name: fsffl-opportunity-engine, path: '/tmp/opportunity-engine/*', if-no-files-found: error, retention-days: 90}
