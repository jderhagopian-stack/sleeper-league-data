name: Run Opportunity Engine

on:
  workflow_dispatch:
    inputs:
      focus_user_id:
        description: 'Sleeper user id of franchise to optimize'
        required: true
        default: '846634401482792960'
        type: string
      quick_sims:
        description: 'Single-step screening simulations'
        required: false
        default: '500'
        type: string
      confirm_sims:
        description: 'Single-step deep confirmation simulations'
        required: false
        default: '2500'
        type: string
      trade_screen:
        description: 'Trade candidates to screen'
        required: false
        default: '75'
        type: string
      waiver_screen:
        description: 'Waiver candidates to screen'
        required: false
        default: '50'
        type: string
      trade_packages_per_target:
        description: 'Upstream GM3 packages considered per trade target'
        required: false
        default: '12'
        type: string
      price_frontier_targets:
        description: 'Attractive trade targets receiving expanded price-frontier search'
        required: false
        default: '16'
        type: string
      price_frontier_packages_per_target:
        description: 'Packages sampled densely around each target price frontier'
        required: false
        default: '18'
        type: string
      portfolio_depth:
        description: 'Top governed single-step moves eligible for adaptive bundle search'
        required: false
        default: '15'
        type: string
      portfolio_max_moves:
        description: 'Maximum moves in an adaptive portfolio'
        required: false
        default: '3'
        type: string
      portfolio_beam_width:
        description: 'Leading bundles retained between adaptive-search levels'
        required: false
        default: '10'
        type: string
      portfolio_sims:
        description: 'Screening simulations per portfolio bundle'
        required: false
        default: '1000'
        type: string
      portfolio_confirm_sims:
        description: 'Deep confirmation simulations per portfolio finalist'
        required: false
        default: '5000'
        type: string
      robustness_seeds:
        description: 'Additional independent seed diagnostics for leading options; 0 disables'
        required: false
        default: '0'
        type: string
      robustness_sims:
        description: 'Simulations per robustness seed'
        required: false
        default: '500'
        type: string
      trade_review_depth:
        description: 'Leading generated trades routed through Trade Decision'
        required: false
        default: '3'
        type: string
  push:
    branches: [main]
    paths:
      - '.oe-run-request.json'

jobs:
  opportunity-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FOCUS_USER_ID: ${{ inputs.focus_user_id || '846634401482792960' }}
      QUICK_SIMS: ${{ inputs.quick_sims || '500' }}
      CONFIRM_SIMS: ${{ inputs.confirm_sims || '2500' }}
      TRADE_SCREEN: ${{ inputs.trade_screen || '75' }}
      WAIVER_SCREEN: ${{ inputs.waiver_screen || '50' }}
      TRADE_PACKAGES_PER_TARGET: ${{ inputs.trade_packages_per_target || '12' }}
      PRICE_FRONTIER_TARGETS: ${{ inputs.price_frontier_targets || '16' }}
      PRICE_FRONTIER_PACKAGES_PER_TARGET: ${{ inputs.price_frontier_packages_per_target || '18' }}
      PORTFOLIO_DEPTH: ${{ inputs.portfolio_depth || '15' }}
      PORTFOLIO_MAX_MOVES: ${{ inputs.portfolio_max_moves || '3' }}
      PORTFOLIO_BEAM_WIDTH: ${{ inputs.portfolio_beam_width || '10' }}
      PORTFOLIO_SIMS: ${{ inputs.portfolio_sims || '1000' }}
      PORTFOLIO_CONFIRM_SIMS: ${{ inputs.portfolio_confirm_sims || '5000' }}
      ROBUSTNESS_SEEDS: ${{ inputs.robustness_seeds || '0' }}
      ROBUSTNESS_SIMS: ${{ inputs.robustness_sims || '500' }}
      TRADE_REVIEW_DEPTH: ${{ inputs.trade_review_depth || '3' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install numpy 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Build full fantasy-relevant projection universe
        run: python script/build_fsffl_full_projection_universe.py
      - name: Refresh Behavioral Intelligence cache
        run: python script/refresh_behavioral_intelligence_v3.py
      - name: Rebuild governed GM3 trade opportunity curves
        run: python script/build_fsffl_gm30.py
      - name: Run Opportunity Engine
        run: |
          mkdir -p /tmp/opportunity-engine
          python script/opportunity_engine/application_v21.py \
            --focus-user-id "$FOCUS_USER_ID" \
            --quick-sims "$QUICK_SIMS" \
            --confirm-sims "$CONFIRM_SIMS" \
            --trade-screen "$TRADE_SCREEN" \
            --waiver-screen "$WAIVER_SCREEN" \
            --trade-packages-per-target "$TRADE_PACKAGES_PER_TARGET" \
            --price-frontier-targets "$PRICE_FRONTIER_TARGETS" \
            --price-frontier-packages-per-target "$PRICE_FRONTIER_PACKAGES_PER_TARGET" \
            --confirm-top '15' \
            --portfolio-depth "$PORTFOLIO_DEPTH" \
            --portfolio-max-moves "$PORTFOLIO_MAX_MOVES" \
            --portfolio-beam-width "$PORTFOLIO_BEAM_WIDTH" \
            --portfolio-sims "$PORTFOLIO_SIMS" \
            --portfolio-confirm-sims "$PORTFOLIO_CONFIRM_SIMS" \
            --portfolio-confirm-top '3' \
            --robustness-seeds "$ROBUSTNESS_SEEDS" \
            --robustness-sims "$ROBUSTNESS_SIMS" \
            --trade-review-depth "$TRADE_REVIEW_DEPTH" \
            --trade-review-confirm-sims '50000' \
            --output /tmp/opportunity-engine/opportunity-board.json \
            | tee /tmp/opportunity-engine/summary.log
      - name: Render Opportunity Engine machine-readable summary
        run: |
          python script/render_opportunity_engine_report.py \
            --input /tmp/opportunity-engine/opportunity-board.json \
            --output /tmp/opportunity-engine/Opportunity_Engine_Report.md
      - name: Render standardized Opportunity Engine PDF
        run: |
          python script/render_opportunity_engine_pdf.py \
            --input /tmp/opportunity-engine/opportunity-board.json \
            --output /tmp/opportunity-engine/Opportunity_Engine_Report.pdf
      - name: Validate governed output
        run: |
          python - <<'PY'
          import json, os
          b=json.load(open('/tmp/opportunity-engine/opportunity-board.json'))
          assert b['model_version']=='FSFFL-Opportunity-Engine-2.3'
          assert b['policy']['creates_new_valuation_model'] is False
          assert b['policy']['creates_new_cross_channel_utility'] is False
          assert b['policy']['adaptive_search_creates_new_utility'] is False
          assert b['policy']['waiver_discovery_fixed_cross_unit_coefficients_active'] is False
          assert b['policy']['negotiation_frontier_creates_new_utility'] is False
          assert b['policy']['theoretical_counterparty_failures_can_be_headline_action'] is False
          assert b['capability_status']['discrete_price_frontier'] is True
          assert b['capability_status']['progressive_price_frontier_search'] is True
          assert b['capability_status']['targeted_adaptive_price_discovery'] is True
          assert b['policy']['theoretical_packages_can_occupy_actionable_ranking'] is False
          assert b['policy']['non_positive_focal_utility_can_occupy_actionable_ranking'] is False
          assert b['policy']['targeted_adaptive_price_discovery_creates_new_utility'] is False
          assert b['policy']['targeted_adaptive_price_discovery_creates_new_trade_value'] is False
          assert b['policy']['targeted_adaptive_price_discovery_package_economics_owned_by_gm3'] is True
          assert int(b['search_configuration']['price_frontier_packages_per_target']) >= 18
          if not b.get('best_actionable_trade') and not b.get('best_trade_to_explore'):
              assert b.get('best_trade_opportunity') is None
          nf=b.get('negotiation_frontier') or {}
          assert nf.get('authority')=='Trade Decision'
          assert nf.get('policy',{}).get('price_frontier_uses_discrete_evaluated_packages') is True
          assert b['provenance']['portfolio_scores_owned_by_gm3_team_improvement'] is True
          assert b['provenance']['adaptive_portfolio_scores_owned_by_gm3_team_improvement'] is True
          assert b['capability_status']['single_step_trade_search'] is True
          assert b['capability_status']['single_step_waiver_search'] is True
          assert b['capability_status']['adaptive_multi_step_portfolio_optimization'] is True
          assert b['capability_status']['prospective_validation_snapshots'] is True
          if int(os.environ['PORTFOLIO_DEPTH']) >= 2:
              assert b['portfolio_optimization']['adaptive_search'] is True
              assert int(b['portfolio_optimization'].get('candidate_bundles_evaluated') or 0) >= 0
              if int(b['portfolio_optimization'].get('candidate_bundles_evaluated') or 0) == 0:
                  assert b['portfolio_optimization'].get('best_portfolio') is None
          if int(os.environ['TRADE_REVIEW_DEPTH']) > 0 and (b.get('best_actionable_trade') or b.get('best_trade_to_explore')):
              assert b['trade_decision_reviews']
              for x in b['trade_decision_reviews']:
                  assert x['authority']=='Trade Decision'
                  assert x['trade_decision']['generated_proposal_willingness_observed'] is False
          print('Opportunity Engine 2.3 governed production validation passed')
          PY
      - name: Validate standardized PDF deliverable
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          p=Path('/tmp/opportunity-engine/Opportunity_Engine_Report.pdf')
          assert p.exists() and p.stat().st_size > 5000
          r=PdfReader(str(p))
          assert len(r.pages) >= 2
          text='\n'.join((page.extract_text() or '') for page in r.pages)
          assert 'FSFFL OPPORTUNITY ENGINE' in text
          assert 'RANKED OPPORTUNITY BOARD' in text
          assert 'EXECUTION, UNCERTAINTY & GOVERNANCE' in text
          print(f'Validated standardized Opportunity Engine PDF: {len(r.pages)} pages, {p.stat().st_size} bytes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsffl-opportunity-engine
          path: /tmp/opportunity-engine/*
          if-no-files-found: error
          retention-days: 90
