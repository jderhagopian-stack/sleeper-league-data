name: Run Opportunity Engine

on:
  workflow_dispatch:
    inputs:
      focus_user_id:
        description: 'Sleeper user id of franchise to optimize'
        required: true
        default: '846634401482792960'
        type: string
      quick_sims:
        description: 'Single-step screening simulations'
        required: false
        default: '200'
        type: string
      confirm_sims:
        description: 'Single-step deep confirmation simulations'
        required: false
        default: '1000'
        type: string
      trade_screen:
        description: 'Trade candidates to screen'
        required: false
        default: '30'
        type: string
      waiver_screen:
        description: 'Waiver candidates to screen'
        required: false
        default: '30'
        type: string
      trade_packages_per_target:
        description: 'Upstream GM3 packages considered per trade target'
        required: false
        default: '5'
        type: string
      portfolio_depth:
        description: 'Top governed single-step moves eligible for adaptive bundle search'
        required: false
        default: '8'
        type: string
      portfolio_max_moves:
        description: 'Maximum moves in an adaptive portfolio'
        required: false
        default: '3'
        type: string
      portfolio_beam_width:
        description: 'Leading bundles retained between adaptive-search levels'
        required: false
        default: '8'
        type: string
      portfolio_sims:
        description: 'Screening simulations per portfolio bundle'
        required: false
        default: '500'
        type: string
      portfolio_confirm_sims:
        description: 'Deep confirmation simulations per portfolio finalist'
        required: false
        default: '5000'
        type: string
      robustness_seeds:
        description: 'Additional independent seed diagnostics for leading options; 0 disables'
        required: false
        default: '0'
        type: string
      robustness_sims:
        description: 'Simulations per robustness seed'
        required: false
        default: '500'
        type: string
      trade_review_depth:
        description: 'Leading generated trades routed through Trade Decision'
        required: false
        default: '1'
        type: string

jobs:
  opportunity-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install numpy 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Build full fantasy-relevant projection universe
        run: python script/build_fsffl_full_projection_universe.py
      - name: Refresh Behavioral Intelligence cache
        run: python script/refresh_behavioral_intelligence_v3.py
      - name: Run Opportunity Engine
        run: |
          mkdir -p /tmp/opportunity-engine
          python script/opportunity_engine/application_v2.py \
            --focus-user-id '${{ inputs.focus_user_id }}' \
            --quick-sims '${{ inputs.quick_sims }}' \
            --confirm-sims '${{ inputs.confirm_sims }}' \
            --trade-screen '${{ inputs.trade_screen }}' \
            --waiver-screen '${{ inputs.waiver_screen }}' \
            --trade-packages-per-target '${{ inputs.trade_packages_per_target }}' \
            --confirm-top '5' \
            --portfolio-depth '${{ inputs.portfolio_depth }}' \
            --portfolio-max-moves '${{ inputs.portfolio_max_moves }}' \
            --portfolio-beam-width '${{ inputs.portfolio_beam_width }}' \
            --portfolio-sims '${{ inputs.portfolio_sims }}' \
            --portfolio-confirm-sims '${{ inputs.portfolio_confirm_sims }}' \
            --portfolio-confirm-top '3' \
            --robustness-seeds '${{ inputs.robustness_seeds }}' \
            --robustness-sims '${{ inputs.robustness_sims }}' \
            --trade-review-depth '${{ inputs.trade_review_depth }}' \
            --trade-review-confirm-sims '50000' \
            --output /tmp/opportunity-engine/opportunity-board.json \
            | tee /tmp/opportunity-engine/summary.log
      - name: Render Opportunity Engine summary
        run: |
          python script/render_opportunity_engine_report.py \
            --input /tmp/opportunity-engine/opportunity-board.json \
            --output /tmp/opportunity-engine/Opportunity_Engine_Report.md
      - name: Validate governed output
        run: |
          python - <<'PY'
          import json
          b=json.load(open('/tmp/opportunity-engine/opportunity-board.json'))
          assert b['model_version']=='FSFFL-Opportunity-Engine-2.0'
          assert b['policy']['creates_new_valuation_model'] is False
          assert b['policy']['creates_new_cross_channel_utility'] is False
          assert b['policy']['adaptive_search_creates_new_utility'] is False
          assert b['policy']['waiver_discovery_fixed_cross_unit_coefficients_active'] is False
          assert b['provenance']['portfolio_scores_owned_by_gm3_team_improvement'] is True
          assert b['provenance']['adaptive_portfolio_scores_owned_by_gm3_team_improvement'] is True
          assert b['capability_status']['single_step_trade_search'] is True
          assert b['capability_status']['single_step_waiver_search'] is True
          assert b['capability_status']['adaptive_multi_step_portfolio_optimization'] is True
          assert b['capability_status']['prospective_validation_snapshots'] is True
          if int('${{ inputs.portfolio_depth }}') >= 2:
              assert b['portfolio_optimization']['adaptive_search'] is True
              assert b['portfolio_optimization']['candidate_bundles_evaluated'] > 0
          if int('${{ inputs.trade_review_depth }}') > 0 and b.get('best_trade_opportunity'):
              assert b['trade_decision_reviews']
              for x in b['trade_decision_reviews']:
                  assert x['authority']=='Trade Decision'
                  assert x['trade_decision']['generated_proposal_willingness_observed'] is False
          print('Opportunity Engine 2.0 governed production validation passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fsffl-opportunity-engine
          path: /tmp/opportunity-engine/*
          if-no-files-found: error
          retention-days: 90
