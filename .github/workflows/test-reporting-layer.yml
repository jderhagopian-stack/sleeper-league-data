name: Test FSFFL Reporting Layer

on:
  pull_request:
    paths:
      - 'script/fsffl_report_style.py'
      - 'script/report_language.py'
      - 'script/report_context.py'
      - 'script/report_visuals.py'
      - 'script/reporting/**'
      - 'script/render_gm_franchise_report.py'
      - 'script/render_simulator_report.py'
      - 'script/render_roster_decision_report.py'
      - 'script/run_roster_decision_lab.py'
      - 'script/decision_attribution.py'
      - 'script/decision_utility.py'
      - 'script/render_league_power_report.py'
      - 'script/render_player_dossier.py'
      - 'script/render_market_movement_report.py'
      - 'script/render_draft_recap_report.py'
      - 'script/render_record_book_report.py'
      - 'script/render_trade_review_report.py'
      - 'script/render_historical_trade_report.py'
      - 'script/render_gm_action_report_v10.py'
      - 'data/reporting/fsffl_reporting_architecture.json'
      - '.github/workflows/build-standardized-reports.yml'
      - '.github/workflows/test-reporting-layer.yml'
  workflow_dispatch:

jobs:
  report-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF dependencies
        run: python -m pip install numpy 'reportlab>=4,<5' 'pypdf>=4,<7'

      - name: Compile reporting layer
        run: python -m py_compile script/report_language.py script/report_context.py script/report_visuals.py script/reporting/__init__.py script/fsffl_report_style.py script/render_gm_franchise_report.py script/render_simulator_report.py script/render_roster_decision_report.py script/run_roster_decision_lab.py script/decision_attribution.py script/decision_utility.py script/render_league_power_report.py script/render_player_dossier.py script/render_market_movement_report.py script/render_draft_recap_report.py script/render_record_book_report.py script/render_multiverse_outliers_report.py script/render_trade_review_report.py script/render_historical_trade_report.py script/render_gm_action_report_v10.py

      - name: Render standardized reports
        run: |
          mkdir -p /tmp/fsffl-reports
          python script/render_gm_franchise_report.py --user-id 846634401482792960 --output /tmp/fsffl-reports/gm-franchise.pdf
          python script/render_simulator_report.py --user-id 846634401482792960 --output /tmp/fsffl-reports/simulator-outlook.pdf
          python script/render_league_power_report.py --output /tmp/fsffl-reports/league-power.pdf
          python script/run_roster_decision_lab.py --scenario data/decision_lab/full_validation_scenario.json --sims 100 --output /tmp/fsffl-reports/decision.json > /tmp/fsffl-reports/decision.log
          python script/render_roster_decision_report.py --input /tmp/fsffl-reports/decision.json --output /tmp/fsffl-reports/roster-decision.pdf
          python script/render_player_dossier.py --player-id 6786 --output /tmp/fsffl-reports/player-dossier.pdf
          python script/render_market_movement_report.py --output /tmp/fsffl-reports/market-movement.pdf
          python script/render_draft_recap_report.py --season 2026 --user-id 846634401482792960 --output /tmp/fsffl-reports/draft-recap.pdf
          python script/render_record_book_report.py --output /tmp/fsffl-reports/record-book.pdf
          python script/render_multiverse_outliers_report.py --output /tmp/fsffl-reports/multiverse-outliers.pdf

      - name: Validate reporting contract and readable output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          arch=json.loads(Path('data/reporting/fsffl_reporting_architecture.json').read_text())
          decision=json.loads(Path('/tmp/fsffl-reports/decision.json').read_text())
          assert decision['shared_decision_utility_model_version']=='FSFFL-Shared-Decision-Utility-2.0'
          assert decision['decision_attribution']['reconciles'] is True
          assert decision['decision_attribution']['creates_independent_score'] is False
          assert abs(float(decision['decision_attribution']['final_shared_decision_utility'])-float(decision['shared_decision_utility_score'])) <= .03
          assert decision['recommendation']['authority']=='Shared Decision Utility / GM3 Team Improvement'
          assert decision['recommendation']['no_independent_roster_decision_score_created'] is True
          assert decision['recommendation'].get('pareto_diagnostic')
          assert decision.get('roster_resolution')
          assert all(x.get('roster_legal') is True for x in decision['roster_resolution'].values())
          assert decision['projection_input_coverage']['coverage_complete'] is True
          assert decision['projection_input_coverage']['missing_player_ids']==[]
          assert arch['principles']['raw_model_output_is_source_of_truth'] is True
          assert arch['principles']['chatgpt_reads_raw_output_not_pdf'] is True
          assert arch['principles']['pdf_is_presentation_only'] is True
          assert arch['principles']['pdf_must_not_rescore_or_reinterpret'] is True
          assert arch['principles']['conversational_response_precedes_attachment'] is True
          assert arch['principles']['aesthetic_quality_is_required'] is True
          assert arch['principles']['user_facing_prose_must_not_be_truncated'] is True
          assert arch['principles']['multi_page_reports_preferred_over_cutoff_text'] is True
          assert arch['principles']['context_required_for_user_facing_numbers'] is True
          assert arch['principles']['narrative_reasoning_required'] is True
          assert arch['principles']['decision_reports_explain_alternatives'] is True
          assert arch['principles']['one_page_is_preference_not_constraint'] is True
          assert arch['principles']['shared_reporting_module_applies_across_workflows'] is True
          assert arch['principles']['visuals_are_evidence_triggered_not_decorative'] is True
          assert arch['module']['stable_facade']=='script/reporting/__init__.py'
          assert arch['module']['decision_authority'] is False
          assert arch['module']['rescore_authority'] is False
          assert arch['narrative_contract']['language_policy']['narrative_must_be_derived_from_existing_model_outputs'] is True
          assert arch['narrative_contract']['language_policy']['renderer_must_not_create_new_model_scores'] is True
          assert 'avoid spreadsheet-dump layouts' in arch['design_system']['rules']
          names=('gm-franchise.pdf','simulator-outlook.pdf','league-power.pdf','roster-decision.pdf','player-dossier.pdf','market-movement.pdf','draft-recap.pdf','record-book.pdf','multiverse-outliers.pdf')
          for name in names:
              p=Path('/tmp/fsffl-reports')/name
              assert p.exists() and p.stat().st_size > 2500
              assert p.read_bytes()[:4] == b'%PDF'
              reader=PdfReader(str(p))
              assert 1 <= len(reader.pages) <= 3, f"{name}: unexpected page count {len(reader.pages)}"
              text='\\n'.join((pg.extract_text() or '') for pg in reader.pages).lower()
              banned=('state-aware','break-glass','liquidity value','objective weights','competitive externality','heuristic acceptance','post-sim','adaptive confirmation','simulation multiverse')
              assert not [x for x in banned if x in text], f"{name}: {text}"
              assert '...' not in text and '\u2026' not in text, f"{name}: {text}"
          print('FSFFL reporting layer standardized smoke test passed')
          PY

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fsffl-reporting-layer-samples
          path: |
            /tmp/fsffl-reports/*.pdf
            /tmp/fsffl-reports/decision.json
          if-no-files-found: error
          retention-days: 14
