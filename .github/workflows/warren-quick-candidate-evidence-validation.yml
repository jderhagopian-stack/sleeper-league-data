name: Warren Quick Candidate Evidence Validation

on:
  push:
    branches:
      - fix/trade-market-current-evidence-parity
    paths:
      - '.github/workflows/warren-quick-candidate-evidence-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trade-market-current-evidence-parity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Build Warren scenario
        run: |
          cat > /tmp/mocha.json <<'JSON'
          {
            "scenario_id":"mocha_warren_quick_candidate_evidence",
            "focus_user_id":"844785316274483200",
            "actions":[
              {"type":"trade","from_user_id":"844785316274483200","to_user_id":"850548458887704576","players":["12518"],"picks":[]},
              {"type":"trade","from_user_id":"850548458887704576","to_user_id":"844785316274483200","players":["5012","5846"],"picks":["pick:2029:R2:orig11","pick:2029:R3:orig11","pick:2029:R3:orig4"]}
            ]
          }
          JSON
      - name: Run quick market sweep
        run: |
          python script/run_trade_market_sweep_v31.py --scenario /tmp/mocha.json --quick-sims 200 --confirm-sims 0 --search-depth 60 --output /tmp/warren-market.json > /tmp/warren-market.log
      - name: Validate three-signal evidence on quick candidates
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/warren-market.json'))
          rows=(d.get('ranked_finalists') or []) + (d.get('alternate_buyer_candidates') or [])
          # De-duplicate because alternate-buyer candidates may also be finalists.
          dedup={}
          for row in rows:
              key=(str(row.get('buyer_user_id') or ''),tuple(row.get('outgoing_assets') or []),tuple(row.get('return_assets') or []))
              dedup[key]=row
          rows=list(dedup.values())
          assert rows, 'expected simulated generated trade candidates'
          checked=[]
          for row in rows:
              sim=row.get('simulation') or {}
              diag=sim.get('roster_diagnosis') or {}
              before=diag.get('before') or {}
              after=diag.get('after') or {}
              assert before.get('starter_redraft_value') is not None
              assert after.get('starter_redraft_value') is not None
              attr=row.get('decision_attribution') or {}
              ev=((attr.get('diagnostics') or {}).get('current_value_evidence') or {})
              assert 'optimized_starter_redraft_delta' in ev, (row.get('buyer_team'),ev)
              assert len(ev) >= 3, (row.get('buyer_team'),ev)
              checked.append({
                  'buyer':row.get('buyer_team'),
                  'return_asset_names':row.get('return_asset_names'),
                  'shared_utility':row.get('shared_decision_utility_score'),
                  'current_evidence':ev,
                  'starter_redraft_before':before.get('starter_redraft_value'),
                  'starter_redraft_after':after.get('starter_redraft_value'),
              })
          out={'checked_count':len(checked),'rows':checked}
          open('/tmp/quick-evidence-results.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: warren-quick-candidate-evidence
          path: |
            /tmp/warren-market.json
            /tmp/warren-market.log
            /tmp/quick-evidence-results.json
          retention-days: 14
