name: Alternate History Predraft Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-predraft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile predraft modules
        run: |
          python -m py_compile script/alternate_history_historical_state.py
          python -m py_compile script/alternate_history_postseason.py
          python -m py_compile script/run_fsffl_season_boundary_particles.py
          python -m py_compile script/run_fsffl_predraft_particles.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Replay through exact 2024 rookie-draft boundary
        run: python script/run_fsffl_predraft_particles.py data/alternate_history/scenarios/puka_vs_van_2023.json --particles 100 --seed 20260824
