name: Test Automatic Trade PDF Report

on:
  pull_request:
    paths:
      - 'script/render_trade_decision_report_v15.py'
      - 'script/render_trade_decision_report_v14.py'
      - 'script/render_trade_decision_report_v13.py'
      - 'script/run_trade_report.py'
      - 'script/run_trade_market_sweep_v27.py'
      - 'script/run_trade_market_sweep_v26.py'
      - 'script/historical_state_behavior.py'
      - 'script/behavioral_intelligence.py'
      - 'script/behavioral_intelligence_v3.py'
      - 'script/behavioral_intelligence_v3_production.py'
      - 'script/refresh_behavioral_intelligence_v3.py'
      - '.github/workflows/test-trade-report.yml'
      - '.github/workflows/run-trade-analysis.yml'
  workflow_dispatch:

jobs:
  report-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Compile report pipeline
        run: python -m py_compile script/render_trade_decision_report_v15.py script/render_trade_decision_report_v14.py script/render_trade_decision_report_v13.py script/run_trade_report.py script/run_trade_market_sweep_v27.py script/run_trade_market_sweep_v26.py script/historical_state_behavior.py script/behavioral_intelligence.py script/behavioral_intelligence_v3.py script/behavioral_intelligence_v3_production.py script/refresh_behavioral_intelligence_v3.py
      - name: Build production BI3 cache
        run: python script/refresh_behavioral_intelligence_v3.py > /tmp/bi3-refresh.log
      - name: Run trade query pipeline
        run: |
          mkdir -p /tmp/fsffl-trade-report
          SECONDS=0
          python script/run_trade_report.py --scenario data/decision_lab/full_validation_scenario.json --out-dir /tmp/fsffl-trade-report --basename validation-trade --quick-sims 100 --confirm-sims 0 --search-depth 60 > /tmp/fsffl-trade-report/pipeline.log
          test "$SECONDS" -le 60
      - name: Validate JSON PDF and behavioral policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          root=Path('/tmp/fsffl-trade-report');a=json.loads((root/'validation-trade.json').read_text());s=json.loads((root/'validation-trade-summary.json').read_text());pdf=root/'validation-trade.pdf'
          assert a['model_version']=='FSFFL-Counter-Market-Sweep-1.21'
          p=a['policy'];assert p['behavioral_intelligence_version']=='FSFFL-Behavioral-Intelligence-3.0';assert p['bi3_opportunity_normalized'] is True;assert p['counter_and_market_pools_separate'] is True;assert p['suggested_counteroffers_max']==2;assert p['market_sweep_max']==5;assert p['market_sweep_excludes_current_partner'] is True;assert p['suggested_counteroffers_never_padded'] is True;assert p['market_sweep_never_padded'] is True
          assert len(a.get('suggested_counteroffers') or [])<=2;assert len(a.get('market_sweep_alternatives') or [])<=5
          partner=str(a.get('current_offer_partner_user_id') or '')
          assert all(str(x.get('buyer_user_id') or '')==partner for x in a.get('suggested_counteroffers') or [])
          assert all(str(x.get('buyer_user_id') or '')!=partner for x in a.get('market_sweep_alternatives') or [])
          assert s['pipeline_model_version']=='FSFFL-Trade-Query-Pipeline-1.12';assert s['report_model_version']=='FSFFL-Trade-Decision-Report-1.5';assert s['canonical_model_entry_point'].endswith('run_trade_market_sweep_v27.py')
          assert pdf.exists() and pdf.stat().st_size>2000 and 1<=len(PdfReader(str(pdf)).pages)<=3
          print('Market Sweep 1.21 / BI3 / concise plain-English report 1.5 test passed')
          PY
      - name: Upload trade report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-trade-report
          path: |
            /tmp/fsffl-trade-report/*
            /tmp/bi3-refresh.log
          if-no-files-found: error
          retention-days: 14
