name: Test Automatic Trade PDF Report

on:
  workflow_call:
jobs:
  report-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Compile report pipeline
        run: python -m py_compile script/render_trade_decision_report_v19.py script/render_trade_decision_report_v18.py script/render_trade_decision_report_v17.py script/render_trade_decision_report_v16.py script/run_trade_report.py script/trade_engine.py script/run_trade_market_sweep_v31.py script/run_trade_market_sweep_v30.py script/run_trade_market_sweep_v29.py script/run_trade_market_sweep_v28.py script/run_trade_market_sweep_v23.py script/negotiation_ranking.py script/run_trade_market_sweep_v13.py script/decision_attribution.py script/decision_utility.py script/audit_roster_cut_sensitivity.py script/roster_aware_trade.py script/roster_interaction.py script/roster_interaction_overlay.py script/roster_resolution_governance.py script/trade_candidate_pools.py script/trade_decision/behavior_integration.py script/trade_decision/historical_behavior_policy.py script/trade_negotiation_family.py script/trade_bilateral_gate.py script/trade_bilateral_composition.py script/trade_multi_asset_packages.py script/trade_multi_asset_composition.py script/trade_state_policy.py script/trade_candidate_selector.py script/trade_state_selector_composition.py script/historical_state_behavior.py script/behavioral_intelligence.py script/behavioral_intelligence_v3.py script/behavioral_intelligence_v3_production.py script/refresh_behavioral_intelligence_v3.py
      - name: Unit test final cut-plan optimizer overrides retention prescreen
        run: |
          python - <<'PY'
          import copy, importlib.util
          spec=importlib.util.spec_from_file_location('v13','script/run_trade_market_sweep_v13.py')
          v13=importlib.util.module_from_spec(spec);spec.loader.exec_module(v13)

          class DL:
              def roster_maps(self, rosters):
                  return ({str(r['user_id']):r for r in rosters},{int(r['roster_id']):r for r in rosters})
              def remove_player(self, roster, pid):
                  roster['players']=[x for x in roster.get('players',[]) if str(x)!=str(pid)]
              def simulate_from_lineups(self,*args,**kwargs):
                  return {'teams':[]}

          class Engine:
              def team_state(self,uid): return 'test'
              def post_sim_score(self,row,state):
                  remaining=set((row.get('simulation') or {}).get('remaining') or [])
                  # B is the downstream-optimal cut even though A has lower retention cost.
                  return 100.0 if 'B' not in remaining else 10.0

          dl=DL(); engine=Engine()
          canonical=[{'user_id':'u','roster_id':1,'players':['A','B','C'],'taxi':[],'reserve':[]}]
          pre=copy.deepcopy(canonical)
          default=[{'user_id':'u','roster_id':1,'players':['B','C'],'taxi':[],'reserve':[]}]
          res={'u':{
              'required_cuts':1,
              'selected_cuts':[{'player_id':'A','retention_cost':1,'base_franchise_value':1,'market_dynasty':1}],
              'cut_candidate_pool':[
                  {'player_id':'A','retention_cost':1,'base_franchise_value':1,'market_dynasty':1},
                  {'player_id':'B','retention_cost':2,'base_franchise_value':2,'market_dynasty':2},
                  {'player_id':'C','retention_cost':3,'base_franchise_value':3,'market_dynasty':3},
              ],
          }}
          actions=[{'type':'trade'}]
          old=v13._simulate_resolved_candidate
          try:
              v13._simulate_resolved_candidate=lambda engine,dl,model_inputs,baseline_lineups,baseline,focus_uid,buyer_uid,actions,hyp,effective,resolution,cuts,sims,seed: {
                  'remaining': list(dl.roster_maps(hyp)[0]['u']['players']),
                  'strategic': {'objective_weights': {'current':.4,'future':.35,'liquidity':.1,'resilience':.15}},
              }
              model_inputs=(object(),{},canonical,{}, {},'2026',{},[])
              out_rosters,out_res,out_actions=v13._optimize_final_focus_cut_plan(
                  engine,dl,model_inputs,{},'u','b',actions,pre,default,res,
                  [{'type':'cut','user_id':'u','players':['A']}],
                  50000,123,[{'asset_id':'player:X'}],[{'asset_id':'player:Y'}]
              )
          finally:
              v13._simulate_resolved_candidate=old
          selected=[x['player_id'] for x in out_res['u']['selected_cuts']]
          assert selected==['B'], selected
          meta=out_res['u']['final_cut_plan_optimization']
          assert meta['status']=='EXACT_TRACTABLE_PLAN_SEARCH'
          assert meta['selected_plan_differs_from_retention_prescreen'] is True
          assert out_actions[0]['players']==['B']
          print('Final cut-plan optimizer correctly overrides retention prescreen')
          PY

      - name: Unit test GM3 roster-need parity
        run: |
          python - <<'PY'
          import importlib.util,json
          spec=importlib.util.spec_from_file_location('v13','script/run_trade_market_sweep_v13.py');v13=importlib.util.module_from_spec(spec);spec.loader.exec_module(v13)
          engine=v13.load_module(v13.BASE_ENGINE,'need_parity_engine')
          rosters=json.load(open('data/rosters.json'))
          idx=json.load(open('data/gm/franchise_index.json'))
          for team in idx.get('teams') or []:
              uid=str(team['user_id'])
              got=v13.position_need_snapshot(engine,rosters,uid)['position_need']
              cc=json.load(open((team.get('paths') or {})['command_center']))
              expected={str(x['position']):float(x['need_score']) for x in cc.get('biggest_position_needs') or []}
              assert got==expected,(uid,got,expected)
          print('Trade Decision roster diagnosis matches GM3 command-center needs for all teams')
          PY
      - name: Unit test adaptive trigger logic
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('p','script/run_trade_report.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          r={'current_offer_evaluation':{'simulation':{'focus_delta':{'expected_wins':-.24,'expected_points_for':-12.5,'playoff_probability':-.01,'championship_probability':.03}}},'policy':{'contender_title_loss_cap':.03},'suggested_counteroffers':[],'market_sweep_alternatives':[]}
          reasons=m.sensitivity_reasons(r)
          assert 'championship_probability_conflicts_with_expected_wins' in reasons
          assert 'championship_probability_conflicts_with_expected_points' in reasons
          print('adaptive trigger unit test passed',reasons)
          PY
      - name: Unit test final counter action governance
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('g','script/trade_option_governance.py');g=importlib.util.module_from_spec(spec);spec.loader.exec_module(g)
          current={'post_sim_score':-100,'simulation':{'strategic':{'objective_state':'retool'}},'buyer_rationality':{'current_state_viable':True}}
          worse={'comparison_to_current_offer':{'verdict_vs_current_offer':'WORSE'}}
          better_market={'comparison_to_current_offer':{'verdict_vs_current_offer':'BETTER'}}
          r={'current_offer_evaluation':current,'suggested_counteroffers':[worse],'market_sweep_alternatives':[]}
          action,basis=g.recompute_action(r,'COUNTER_CURRENT_OFFEROR')
          assert action=='DECLINE', (action,basis)
          r['market_sweep_alternatives']=[better_market]
          action,basis=g.recompute_action(r,'COUNTER_CURRENT_OFFEROR')
          assert action=='SHOP_BEFORE_ACCEPTING', (action,basis)
          r['suggested_counteroffers']=[{'comparison_to_current_offer':{'verdict_vs_current_offer':'BETTER'}}]
          action,basis=g.recompute_action(r,'DECLINE')
          assert action=='COUNTER_CURRENT_OFFEROR', (action,basis)
          print('final counter action governance passed')
          PY
      - name: Unit test roster legalization
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('r','script/roster_aware_trade.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          class DL:
              @staticmethod
              def roster_maps(rs):return ({str(x['owner_id']):x for x in rs},{int(x['roster_id']):x for x in rs})
              @staticmethod
              def remove_player(r,p):
                  r['players']=[x for x in r.get('players',[]) if str(x)!=str(p)];r['taxi']=[x for x in r.get('taxi',[]) if str(x)!=str(p)];r['reserve']=[x for x in r.get('reserve',[]) if str(x)!=str(p)]
              @staticmethod
              def gm_asset_map(uid):
                  return {
                    'player:1':{'name':'CORE','base_franchise_value':5000,'break_glass_value':7000,'market_dynasty':5000,'market_redraft':5000,'is_current_optimal_starter':True,'core_status':'core_high_hold'},
                    'player:2':{'name':'WEAK_INCUMBENT','base_franchise_value':100,'break_glass_value':100,'market_dynasty':100,'market_redraft':50},
                    'player:3':{'name':'INCOMING','base_franchise_value':1,'break_glass_value':1,'market_dynasty':1,'market_redraft':1}
                  }
          before=[{'owner_id':'u','roster_id':1,'players':['1','2'],'taxi':[],'reserve':[]}]
          after=[{'owner_id':'u','roster_id':1,'players':['1','2','3'],'taxi':[],'reserve':[]}]
          league={'roster_positions':['QB','BN']};legal,res,acts=m.legalize_trade_rosters(DL,before,after,['u'],league,{})
          assert legal[0]['players']==['1','3']
          assert res['u']['required_cuts']==1
          assert res['u']['selected_cuts'][0]['name']=='WEAK_INCUMBENT'
          assert res['u']['newly_acquired_protected_from_automatic_cut']==['3']
          assert acts[0]['players']==['2']
          assert res['u']['roster_legal'] is True
          before2=[{'owner_id':'u','roster_id':1,'players':['1','2','4'],'taxi':[],'reserve':[]}]
          after2=[{'owner_id':'u','roster_id':1,'players':['1','2','4','3'],'taxi':[],'reserve':[]}]
          legal2,res2,acts2=m.legalize_trade_rosters(DL,before2,after2,['u'],league,{})
          assert res2['u']['baseline_active_overage']==1
          assert res2['u']['effective_hypothetical_active_limit']==3
          assert res2['u']['required_cuts']==1
          assert res2['u']['preexisting_overage_not_charged_to_hypothetical'] is True
          assert '3' in res2['u']['newly_acquired_protected_from_automatic_cut']
          assert res2['u']['roster_legal'] is True
          print('baseline-aware roster legalization unit tests passed')
          PY
      - name: Unit test roster interaction symmetry and bounds
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('ri','script/roster_interaction.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          p={'team':'NE','position':'RB','market_redraft':2000,'uncertainty':.5}
          s={'team':'NE','position':'RB','market_redraft':1000,'uncertainty':.3}
          assert m.pair_insurance(p,s)>0
          assert m.pair_insurance(p,{'team':'NYG','position':'RB','market_redraft':1000,'uncertainty':.3})==0
          assert m.pair_insurance(p,{'team':'NE','position':'WR','market_redraft':1000,'uncertainty':.3})==0
          assert m.pair_insurance(p,s)<=2000*m.MAX_PAIR_INSURANCE_PCT+1e-9
          print('roster interaction unit tests passed')
          PY
      - name: Build production BI3 cache
        run: python script/refresh_behavioral_intelligence_v3.py > /tmp/bi3-refresh.log
      - name: Run trade query pipeline
        run: |
          mkdir -p /tmp/fsffl-trade-report
          SECONDS=0
          python script/run_trade_report.py --scenario data/decision_lab/full_validation_scenario.json --out-dir /tmp/fsffl-trade-report --basename validation-trade --quick-sims 100 --adaptive-confirm-sims 1000 --search-depth 60 > /tmp/fsffl-trade-report/pipeline.log
          test "$SECONDS" -le 300
      - name: Validate JSON PDF roster comparison and confirmation policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          root=Path('/tmp/fsffl-trade-report');a=json.loads((root/'validation-trade.json').read_text());s=json.loads((root/'validation-trade-summary.json').read_text());pdf=root/'validation-trade.pdf'
          assert a['model_version']=='FSFFL-Counter-Market-Sweep-1.26'
          p=a['policy'];assert p['behavioral_intelligence_version']=='FSFFL-Behavioral-Intelligence-3.0';assert p['counter_and_market_pools_separate'] is True;assert p['every_recommended_option_compared_to_current_offer'] is True;assert p['adaptive_deep_confirmation_enabled'] is True;assert p['roster_aware_trade_resolution'] is True;assert p['post_trade_active_roster_limit_enforced'] is True;assert p['forced_cuts_included_in_lineup_simulation'] is True;assert p['forced_cuts_included_in_strategic_valuation'] is True;assert p['forced_cuts_included_in_buyer_acceptance_analysis'] is True;assert p['roster_specific_correlated_asset_value_enabled'] is True;assert p['interaction_rules_generic_and_symmetric'] is True;assert p['negotiation_ranking_refreshed_after_post_ranking_interaction_overlay'] is True;assert p['post_overlay_candidate_universe_limit_explicit'] is True;assert p['trade_decision_roster_interaction_overlay_internal_component'] is True;assert p['historical_v21_executed_in_current_path'] is False;assert p['trade_decision_bilateral_gate_internal_component'] is True;assert p['trade_decision_negotiation_family_internal_component'] is True;assert p['historical_v22_executed_in_current_path'] is False;assert p['trade_decision_multi_asset_package_generator_internal_component'] is True;assert p['historical_v23_executed_in_current_path'] is False;assert p['trade_decision_state_policy_internal_component'] is True;assert p['trade_decision_candidate_selector_internal_component'] is True;assert p['historical_v24_executed_in_current_path'] is False;assert p['trade_decision_historical_behavior_internal_component'] is True;assert p['historical_state_intelligence_shared_source_consumed'] is True;assert p['historical_behavior_interpretation_owned_by_trade_decision'] is True;assert p['historical_v26_executed_in_current_path'] is False;assert p['trade_decision_behavior_integration_internal_component'] is True;assert p['behavioral_intelligence_shared_source_consumed'] is True;assert p['trade_behavior_interpretation_owned_by_trade_decision'] is True;assert p['historical_v27_executed_in_current_path'] is False;assert p['trade_decision_candidate_pools_internal_component'] is True;assert p['historical_v28_executed_in_current_path'] is False;assert p['historical_v29_executed_in_current_path'] is False;assert p['historical_v30_executed_in_current_path'] is False;assert p['trade_decision_roster_resolution_governance_internal_component'] is True;assert p['legacy_v30_option_comparison_not_executed_in_current_path'] is True
          g=(a.get('governance') or {}).get('post_ranking_roster_interaction') or {};assert g.get('ranking_refreshed_after_overlay') is True;assert g.get('candidate_universe_rebuilt_after_overlay') is False
          rows=[a.get('current_offer_evaluation') or {}]+(a.get('suggested_counteroffers') or [])+(a.get('market_sweep_alternatives') or [])
          for x in rows:
              if x:
                  assert abs(float(x.get('shared_decision_utility_score') or 0)-float(x.get('post_sim_score') or 0)) < 1e-6
                  assert x.get('post_sim_score_is_shared_decision_utility_compatibility_alias') is True
                  da=x.get('decision_attribution') or {}
                  assert da.get('reconciles') is True, da
                  assert abs(float(da.get('final_shared_decision_utility') or 0)-float(x.get('shared_decision_utility_score') or 0)) <= .03
              sim=x.get('simulation') or {};rr=sim.get('roster_resolution') or {};assert rr
              assert all(v.get('roster_legal') is True for v in rr.values())
              nr=x.get('negotiation_ranking') or {}
              if nr:
                  assert abs(float(nr['state_aware_post_sim_score'])-float(x['post_sim_score']))<1e-6
                  assert nr['ranking_model_version']=='FSFFL-Negotiation-Ranking-3.0'
                  assert nr['weights']=={'focal_strategic_gain':1.0,'acceptance_fit':0.0,'owner_behavior_match':0.0}
                  assert nr['behavior_already_in_acceptance_fit'] is True
          for x in (a.get('suggested_counteroffers') or [])+(a.get('market_sweep_alternatives') or []):
              c=x.get('comparison_to_current_offer') or {};assert c.get('verdict_vs_current_offer') in {'BETTER','MIXED','WORSE'};assert c.get('reason')
              assert 'shared_decision_utility_score' in (c.get('decision_metric_deltas_vs_current_offer') or {})
              assert 'strategic_value_delta' not in (c.get('decision_metric_deltas_vs_current_offer') or {})
              assert c.get('post_sim_score_role')=='COMPATIBILITY_ALIAS_FOR_SHARED_DECISION_UTILITY_NOT_INDEPENDENT_SCORE'
          ac=(a.get('simulation') or {}).get('adaptive_confirmation') or {};assert ac.get('enabled') is True
          assert int((a.get('simulation') or {}).get('final_trade_impact_simulations') or 0)==50000
          # The live 50k trade baseline must remain statistically consistent
          # with the latest stored 50k season snapshot. Exact bit-for-bit
          # equality is not required across separate Monte Carlo runs/environments.
          season=json.load(open('data/simulator/2026/outputs/season_simulation.json'))
          uid=str(a.get('focus_user_id') or '')
          canonical=next(x for x in season['teams'] if str(x.get('user_id'))==uid)
          before=((a.get('current_offer_evaluation') or {}).get('simulation') or {}).get('focus_before') or {}
          assert abs(before['expected_wins']-canonical['expected_wins']) <= .05, (before,canonical)
          assert abs(before['expected_points_for']-canonical['expected_points_for']) <= 1.0, (before,canonical)
          for k in ('playoff_probability','bye_probability','championship_probability'):
              assert abs(before[k]-canonical[k]) <= .005, (k,before[k],canonical[k])
          assert s['pipeline_model_version']=='FSFFL-Trade-Query-Pipeline-1.19';assert s['report_model_version']=='FSFFL-Trade-Decision-Report-1.11';assert s['canonical_model_entry_point'].endswith('trade_engine.py')
          assert (a.get('value_metric_context') or {}).get('long_term_trade_value')
          assert (a.get('value_metric_context') or {}).get('incremental_asset_liquidity')
          assert (a.get('recommendation_profile') or {}).get('label')
          assert p['future_pick_outlook_uses_post_trade_simulator_ordering'] is True
          assert p['long_term_trade_value_and_incremental_liquidity_defined_separately'] is True
          assert pdf.exists() and pdf.stat().st_size>2000 and 1<=len(PdfReader(str(pdf)).pages)<=3
          text='\\n'.join((p.extract_text() or '') for p in PdfReader(str(pdf)).pages).lower()
          banned=('state-aware','break-glass','liquidity value','objective weights','competitive externality','heuristic acceptance','post-sim','adaptive confirmation','simulation multiverse')
          assert not [x for x in banned if x in text], text
          assert '...' not in text and '\u2026' not in text, text
          cur=a.get('current_offer_evaluation') or {}
          print(json.dumps({'trade_decision_reconciliation_sample':{
              'description':cur.get('description'),
              'shared_decision_utility_score':cur.get('shared_decision_utility_score'),
              'attribution':cur.get('decision_attribution'),
              'recommended_next_action':a.get('recommended_next_action'),
          }},indent=2))
          print('Market Sweep 1.26 / canonical trade-engine facade / roster interaction / baseline-aware roster resolution / plain-language report 1.11 test passed')
          PY
      - name: Audit downstream cut-plan sensitivity
        run: |
          python script/audit_roster_cut_sensitivity.py --report /tmp/fsffl-trade-report/validation-trade.json --output /tmp/fsffl-trade-report/roster-cut-sensitivity.json --sims 1000 --seed 20260821
          python - <<'PY'
          import json
          d=json.load(open('/tmp/fsffl-trade-report/roster-cut-sensitivity.json'))
          assert d['interpretation']['historical_validation'] is False
          assert d['interpretation']['coefficient_tuning'] is False
          assert d['interpretation']['uses_exact_lineup_reoptimization'] is True
          assert d['interpretation']['roster_interaction_v1_24_reapplied'] is True
          eligible=0
          report=json.load(open('/tmp/fsffl-trade-report/validation-trade.json'))
          seen=set()
          for section in ('current_offer_evaluation','suggested_counteroffers','market_sweep_alternatives','top_5_alternatives','ranked_finalists','realistic_counter_alternatives'):
              vals=[report.get(section) or {}] if section=='current_offer_evaluation' else (report.get(section) or [])
              for row in vals:
                  if not row: continue
                  key=(str(row.get('buyer_user_id') or ''),tuple(sorted(map(str,row.get('outgoing_assets') or []))),tuple(sorted(map(str,row.get('return_assets') or row.get('incoming_assets') or []))))
                  if key in seen: continue
                  seen.add(key)
                  rr=((row.get('simulation') or {}).get('roster_resolution') or {}).get(str(report.get('focus_user_id') or '')) or {}
                  required=int(rr.get('required_cuts') or 0);shortlist=list(rr.get('cut_candidate_shortlist') or [])
                  if required>0 and len(shortlist)>required: eligible+=1
          assert d['summary']['audited_candidate_count']+d['summary']['skipped_candidate_count'] == eligible
          print(json.dumps({'summary':d['summary'],'eligible_for_cut_plan_audit':eligible},indent=2))
          PY
      - name: Upload trade report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-trade-report
          path: |
            /tmp/fsffl-trade-report/*
            /tmp/bi3-refresh.log
          if-no-files-found: error
          retention-days: 14