name: Test Automatic Trade PDF Report

on:
  pull_request:
    paths:
      - 'script/render_trade_decision_report.py'
      - 'script/render_trade_decision_report_v11.py'
      - 'script/render_trade_decision_report_v12.py'
      - 'script/run_trade_report.py'
      - 'script/historical_state_behavior.py'
      - 'script/behavioral_intelligence.py'
      - 'script/behavioral_intelligence_v3.py'
      - 'script/behavioral_intelligence_v3_production.py'
      - 'script/refresh_behavioral_intelligence_v3.py'
      - 'script/run_trade_market_sweep_v26.py'
      - '.github/workflows/test-trade-report.yml'
      - '.github/workflows/run-trade-analysis.yml'
  workflow_dispatch:

jobs:
  report-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Compile report pipeline
        run: python -m py_compile script/render_trade_decision_report_v12.py script/run_trade_report.py script/historical_state_behavior.py script/behavioral_intelligence.py script/behavioral_intelligence_v3.py script/behavioral_intelligence_v3_production.py script/refresh_behavioral_intelligence_v3.py script/run_trade_market_sweep_v26.py
      - name: Build production BI3 cache
        run: python script/refresh_behavioral_intelligence_v3.py > /tmp/bi3-refresh.log
      - name: Run trade query pipeline
        run: |
          mkdir -p /tmp/fsffl-trade-report
          SECONDS=0
          python script/run_trade_report.py --scenario data/decision_lab/full_validation_scenario.json --out-dir /tmp/fsffl-trade-report --basename validation-trade --quick-sims 100 --confirm-sims 0 --search-depth 60 > /tmp/fsffl-trade-report/pipeline.log
          test "$SECONDS" -le 60
      - name: Validate JSON PDF and behavioral policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          root=Path('/tmp/fsffl-trade-report');analysis=json.loads((root/'validation-trade.json').read_text());summary=json.loads((root/'validation-trade-summary.json').read_text());pdf=root/'validation-trade.pdf'
          assert analysis['model_version']=='FSFFL-Counter-Market-Sweep-1.20'
          p=analysis['policy']
          assert p['continuous_state_weighting'] is True
          assert p['league_realistic_multi_asset_search'] is True
          assert p['historical_state_at_trade_reconstruction_enabled'] is True
          assert p['behavioral_intelligence_version']=='FSFFL-Behavioral-Intelligence-3.0'
          assert p['bi2_persistent_manager_traits_retained'] is True
          assert p['bi2_state_conditioned_full_action_behavior_retained'] is True
          assert p['bi3_context_normalized_position_signal_enabled'] is True
          assert p['bi3_opportunity_normalized'] is True
          assert p['bi3_cache_status']=='AVAILABLE'
          assert p['bi3_interactive_historical_replay'] is False
          assert p['behavioral_history_can_override_current_state_utility'] is False
          assert summary['pipeline_model_version']=='FSFFL-Trade-Query-Pipeline-1.9'
          assert summary['report_model_version']=='FSFFL-Trade-Decision-Report-1.2'
          assert summary['canonical_model_entry_point'].endswith('run_trade_market_sweep_v26.py')
          assert pdf.exists() and pdf.stat().st_size>2000 and 1 <= len(PdfReader(str(pdf)).pages) <= 2
          print('Automatic Market Sweep 1.20 / BI3 / natural-language report 1.2 test passed')
          PY
      - name: Upload trade report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-trade-report
          path: |
            /tmp/fsffl-trade-report/*
            /tmp/bi3-refresh.log
          if-no-files-found: error
          retention-days: 14
