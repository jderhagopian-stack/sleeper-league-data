name: Test Automatic Trade PDF Report

on:
  pull_request:
    paths:
      - 'script/render_trade_decision_report.py'
      - 'script/run_trade_report.py'
      - 'script/run_trade_market_sweep_v20.py'
      - 'script/run_trade_market_sweep_v21.py'
      - 'script/run_trade_market_sweep_v22.py'
      - '.github/workflows/test-trade-report.yml'
      - '.github/workflows/run-trade-analysis.yml'
  workflow_dispatch:

jobs:
  report-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF dependencies
        run: python -m pip install 'reportlab>=4,<5' 'pypdf>=4,<7'

      - name: Compile report pipeline
        run: python -m py_compile script/render_trade_decision_report.py script/run_trade_report.py script/run_trade_market_sweep_v20.py script/run_trade_market_sweep_v21.py script/run_trade_market_sweep_v22.py

      - name: Run trade query pipeline
        run: |
          mkdir -p /tmp/fsffl-trade-report
          SECONDS=0
          python script/run_trade_report.py \
            --scenario data/decision_lab/full_validation_scenario.json \
            --out-dir /tmp/fsffl-trade-report \
            --basename validation-trade \
            --quick-sims 100 \
            --confirm-sims 0 \
            --search-depth 60 \
            > /tmp/fsffl-trade-report/pipeline.log
          elapsed=$SECONDS
          echo "Trade report pipeline runtime: ${elapsed}s"
          test "$elapsed" -le 180
          tail -n 30 /tmp/fsffl-trade-report/pipeline.log

      - name: Validate JSON PDF and delivery policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader

          root = Path('/tmp/fsffl-trade-report')
          analysis = json.loads((root/'validation-trade.json').read_text())
          summary = json.loads((root/'validation-trade-summary.json').read_text())
          pdf = root/'validation-trade.pdf'

          assert analysis['model_version'] == 'FSFFL-Counter-Market-Sweep-1.16'
          assert analysis['policy']['continuous_state_weighting'] is True
          assert analysis['policy']['market_intelligence_can_veto_buyer_current_state_viability'] is True
          assert analysis['policy']['negotiation_family_deduplication'] is True
          assert analysis['policy']['league_realistic_multi_asset_search'] is True
          assert analysis['policy']['legacy_three_asset_return_ceiling_removed'] is True
          assert analysis['policy']['max_return_picks_with_players'] == 4
          assert analysis['policy']['max_return_total_assets_with_players'] == 5
          assert analysis['policy']['max_pick_only_return_assets'] == 5
          normals=[r for r in analysis.get('top_5_alternatives',[]) if r.get('report_role') != 'SWING_FOR_FENCES']
          assert all(r.get('acceptance_likelihood') in {'HIGH','MEDIUM'} for r in normals)
          assert summary['pipeline_model_version'] == 'FSFFL-Trade-Query-Pipeline-1.3'
          assert summary['analysis_model_version'] == analysis['model_version']
          assert summary['canonical_model_entry_point'].endswith('run_trade_market_sweep_v22.py')
          assert pdf.exists() and pdf.stat().st_size > 2000
          assert len(PdfReader(str(pdf)).pages) == 1
          print('Automatic Market Sweep 1.16 trade PDF report smoke test passed')
          PY

      - name: Upload trade report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-trade-report
          path: |
            /tmp/fsffl-trade-report/validation-trade.json
            /tmp/fsffl-trade-report/validation-trade.pdf
            /tmp/fsffl-trade-report/validation-trade-summary.json
            /tmp/fsffl-trade-report/pipeline.log
          if-no-files-found: error
          retention-days: 14
