name: Model Governance Audit

on:
  pull_request:
    paths:
      - 'script/audit_model_governance.py'
      - 'script/audit_model_sensitivity.py'
      - 'script/validate_model_parameter_registry.py'
      - 'script/**/*.py'
      - 'data/model_parameter_registry.json'
      - 'data/gm/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate governed parameter registry
        run: python script/validate_model_parameter_registry.py
      - name: Run model governance audit
        run: |
          python script/audit_model_governance.py
          python script/audit_model_sensitivity.py
      - name: Validate audit
        run: |
          python - <<'PY'
          import json
          r=json.load(open('data/audit/model_governance_audit.json'))
          assert r['summary']['numeric_assumptions_flagged'] > 50
          ids={x['id'] for x in r['curated_findings']}
          assert 'STATE-WEIGHTS-001' in ids
          assert 'DOUBLE-COUNT-001' in ids
          state=[x for x in r['curated_findings'] if x['id']=='STATE-WEIGHTS-001'][0]
          assert 'state_weight_calibration.json exists=True' in state['observation']
          assert 'state_weight_training_examples.json exists=False' in state['observation']
          prior=json.load(open('data/gm/state_weight_calibration.json'))
          assert prior['status']=='EXPERT_PRIOR_UNVALIDATED'
          assert prior['provenance']['empirically_validated'] is False
          s=json.load(open('data/audit/model_sensitivity_audit.json'))
          pkg=s['package_discount_divergence']
          assert pkg[-1]['difference_pct_vs_gm22'] > 10
          assert s['state_weight_source_divergence'][0]['runtime_source']=='calibration_artifact'
          print(json.dumps(r['summary'],indent=2))
          print(json.dumps(s['trade_score_elasticity'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fsffl-model-governance-audit
          path: data/audit/*
          retention-days: 30
