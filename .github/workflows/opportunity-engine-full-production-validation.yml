name: Opportunity Engine Full Production Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'script/trade_decision/negotiation_frontier.py'
      - 'script/opportunity_engine/application_v21.py'
      - 'script/opportunity_engine/focal_utility_stability.py'
      - 'script/test_focal_utility_stability.py'
      - 'script/test_opportunity_specialist_views.py'
      - 'script/render_opportunity_engine_report.py'
      - 'script/audit_contender_state_utility_calibration.py'
      - 'script/strategic_posture.py'
      - 'script/decision_lab_state_aware.py'
      - 'script/run_team_improvement_lab.py'
      - 'script/run_team_improvement_lab_v16.py'
      - 'script/gm3/team_improvement.py'
      - 'script/test_strategic_posture.py'
      - 'script/test_opportunity_engine_outbound.py'
      - '.github/workflows/opportunity-engine-full-production-validation.yml'
  # Keep this push hook so merges touching the production OE path rerun the full validation on main.
  push:
    branches: [main]
    paths:
      - 'script/trade_decision/negotiation_frontier.py'
      - 'script/opportunity_engine/application_v21.py'
      - 'script/render_opportunity_engine_report.py'
      - 'script/audit_contender_state_utility_calibration.py'
      - 'script/strategic_posture.py'
      - 'script/decision_lab_state_aware.py'
      - 'script/run_team_improvement_lab.py'
      - 'script/run_team_improvement_lab_v16.py'
      - 'script/gm3/team_improvement.py'
      - 'script/test_strategic_posture.py'
      - '.github/workflows/opportunity-engine-full-production-validation.yml'
  workflow_dispatch:

jobs:
  full-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Compile production Opportunity Engine path
        run: |
          python -m py_compile \
            script/opportunity_engine/application_v21.py \
            script/opportunity_engine/focal_utility_stability.py \
            script/trade_decision/negotiation_frontier.py \
            script/render_opportunity_engine_report.py \
            script/audit_contender_state_utility_calibration.py \
            script/strategic_posture.py \
            script/test_strategic_posture.py \
            script/test_opportunity_engine_outbound.py \
            script/test_focal_utility_stability.py \
            script/test_opportunity_specialist_views.py
          python script/test_strategic_posture.py
          python script/test_focal_utility_stability.py
          python script/test_opportunity_specialist_views.py
          python script/test_opportunity_engine_outbound.py
          python script/test_negotiation_price_frontier.py
          python script/test_opportunity_engine_price_search.py
      - name: Refresh governed inputs
        run: |
          python script/build_fsffl_full_projection_universe.py
          python script/refresh_behavioral_intelligence_v3.py
      - name: Run full Hurts So Good Opportunity Engine
        run: |
          mkdir -p /tmp/oe-full
          python script/opportunity_engine/application_v21.py \
            --focus-user-id 846634401482792960 \
            --output /tmp/oe-full/opportunity-board.json
          python script/render_opportunity_engine_report.py \
            --input /tmp/oe-full/opportunity-board.json \
            --output /tmp/oe-full/Opportunity_Engine_Report.md
          python script/render_opportunity_report.py \
            --input /tmp/oe-full/opportunity-board.json \
            --output /tmp/oe-full/Hurts_So_Good_Opportunity_Report.pdf
          python script/audit_contender_state_utility_calibration.py \
            --input /tmp/oe-full/opportunity-board.json \
            --output /tmp/oe-full/contender-state-utility-audit.json \
            --markdown /tmp/oe-full/Contender_State_Utility_Audit.md
      - name: Run owner-posture smoke
        run: |
          python script/opportunity_engine/application_v21.py \
            --focus-user-id 846634401482792960 \
            --strategic-posture PRESERVE_FUTURE_VALUE \
            --quick-sims 30 \
            --confirm-sims 60 \
            --trade-screen 8 \
            --waiver-screen 8 \
            --confirm-top 4 \
            --trade-packages-per-target 4 \
            --price-frontier-targets 4 \
            --price-frontier-packages-per-target 6 \
            --portfolio-depth 0 \
            --actionability-stability-seeds 2 \
            --actionability-stability-sims 30 \
            --trade-review-depth 0 \
            --output /tmp/oe-full/posture-smoke.json
          python - <<'PY'
          import json
          auto=json.load(open('/tmp/oe-full/opportunity-board.json'))
          b=json.load(open('/tmp/oe-full/posture-smoke.json'))
          p=b.get('strategic_posture') or {}
          assert p.get('selected_posture')=='PRESERVE_FUTURE_VALUE'
          assert p.get('posture_source')=='OWNER_OVERRIDE'
          assert p.get('competitive_state')==(auto.get('competitive_state') or auto.get('team_state'))
          assert b.get('competitive_state')==(auto.get('competitive_state') or auto.get('team_state'))
          trade=next((x for x in (b.get('negotiation_frontier') or {}).get('evaluated_trade_packages',[]) if (x.get('simulation') or {}).get('strategic')),None)
          if trade:
              sim=trade.get('simulation') or {}
              assert (sim.get('strategic') or {}).get('strategic_posture')=='PRESERVE_FUTURE_VALUE'
              cp=(sim.get('counterparty') or {}).get('strategic') or {}
              if cp:
                  assert cp.get('strategic_posture')=='AUTO'
          print({'posture':p.get('selected_posture'),'competitive_state':b.get('competitive_state')})
          PY
      - name: Validate full production output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.load(open('/tmp/oe-full/opportunity-board.json'))
          assert b['model_version']=='FSFFL-Opportunity-Engine-2.3'
          assert b['team_name']=='Hurts So Good'
          posture=b.get('strategic_posture') or {}
          assert posture.get('selected_posture')=='AUTO'
          assert posture.get('posture_source')=='MODEL_DEFAULT'
          assert posture.get('competitive_state')==b.get('team_state')
          assert b['policy']['strategic_posture_changes_competitive_state'] is False
          assert b['policy']['strategic_posture_search_guidance_creates_new_utility'] is False
          assert b['policy']['outbound_future_value_search_creates_new_utility'] is False
          assert b['policy']['outbound_future_value_candidates_require_shared_utility_recheck'] is True
          assert b['capability_status']['outbound_future_value_trade_search'] is True
          assert b['capability_status']['focal_utility_sign_stability_confirmation'] is True
          assert b['capability_status']['simulation_sensitive_trade_watchlist'] is True
          assert b['capability_status']['specialist_view_routing_status'] is True
          assert b['policy']['specialist_views_require_actionability'] is False
          assert b['policy']['specialist_views_create_recommendation_authority'] is False
          assert b['policy']['focal_utility_sign_stability_creates_new_utility'] is False
          assert b['policy']['focal_utility_sign_stability_uses_fixed_margin_threshold'] is False
          assert b['policy']['simulation_sensitive_focal_utility_can_be_headline_action'] is False
          assert b['policy']['portfolio_search_excludes_simulation_sensitive_focal_utility'] is True
          assert b['focal_utility_stability_confirmation']['enabled'] is True
          assert b['policy']['theoretical_counterparty_failures_can_be_headline_action'] is False
          assert b['policy']['near_frontier_watchlist_creates_new_trade_value'] is False
          assert b['policy']['near_frontier_watchlist_creates_acceptance_probability'] is False
          assert b['policy']['near_frontier_watchlist_uses_fixed_utility_cutoff'] is False
          nf=b.get('near_frontier_watchlist') or []
          for row in nf:
              ev=row.get('near_frontier_evidence') or {}
              assert ev.get('watchlist_eligible') is True
              assert ev.get('best_focal_positive_package_for_counterparty') is not None
          for row in b.get('ranked_single_step_opportunities') or []:
              if row.get('channel')=='TRADE':
                  f=row.get('negotiation_frontier') or {}
                  assert f.get('counterparty_bilateral_viable') is True
                  assert float(f.get('focal_team_improvement_utility') or 0)>0
                  st=row.get('focal_utility_stability_confirmation') or {}
                  assert st.get('confirmed_for_headline_action') is True
          for row in b.get('simulation_sensitive_trade_watchlist') or []:
              st=row.get('focal_utility_stability_confirmation') or {}
              assert st.get('confirmed_for_headline_action') is False
          views=b.get('specialized_views') or {}
          populated=[row for row in views.values() if row]
          assert populated, 'Expected governed specialist intelligence to remain visible'
          for row in populated:
              assert row.get('specialist_view_is_recommendation') is False
              assert row.get('opportunity_routing_status')
          assert any(
              row.get('specialist_view_preserved_despite_non_actionable_status') is True
              for row in populated
          ), 'Expected at least one non-actionable specialist view to remain visible in full production'
          assert Path('/tmp/oe-full/Opportunity_Engine_Report.md').stat().st_size > 800
          audit=json.load(open('/tmp/oe-full/contender-state-utility-audit.json'))
          assert audit['trade_case_count'] > 0
          assert audit['conclusion']['coefficient_change_supported_by_this_audit'] is False
          assert any(x['state_weight_sensitivity']=='ELITE_CONTENDER_DEPENDENT' for x in audit['cases'])
          assert any(x['state_weight_sensitivity']=='ROBUST_ACROSS_CONTENDER_AND_ELITE' for x in audit['cases'])
          assert Path('/tmp/oe-full/Contender_State_Utility_Audit.md').stat().st_size > 500
          print(json.dumps({
              'best_move': (b.get('best_move_available') or {}).get('description'),
              'best_actionable_trade': (b.get('best_actionable_trade') or {}).get('description'),
              'best_trade_to_explore': (b.get('best_trade_to_explore') or {}).get('description'),
              'best_near_frontier_target': ((b.get('best_near_frontier_target') or {}).get('target') or {}).get('name'),
              'near_frontier_count': len(nf),
              'price_gap_count': len(b.get('high_impact_price_gap_targets') or []),
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hurts-so-good-opportunity-engine-full-production
          path: /tmp/oe-full/*
          if-no-files-found: warn
          retention-days: 30
