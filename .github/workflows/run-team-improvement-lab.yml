name: Run Team Improvement Lab

on:
  workflow_dispatch:
    inputs:
      focus_user_id:
        description: 'Sleeper user id of franchise to optimize'
        required: true
        default: '846634401482792960'
        type: string
      quick_sims:
        description: 'Screening simulations per move'
        required: false
        default: '200'
        type: string
      confirm_sims:
        description: 'Deep simulations for top candidates'
        required: false
        default: '1000'
        type: string
      trade_screen:
        required: false
        default: '30'
        type: string
      waiver_screen:
        required: false
        default: '30'
        type: string
      confirm_top:
        required: false
        default: '5'
        type: string

jobs:
  improve-team:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install report dependencies
        run: python -m pip install numpy 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Build full fantasy-relevant projection universe
        run: python script/build_fsffl_full_projection_universe.py
      - name: Run Team Improvement Lab
        run: |
          mkdir -p /tmp/team-improvement
          python script/gm3/team_improvement.py \
            --focus-user-id '${{ inputs.focus_user_id }}' \
            --quick-sims '${{ inputs.quick_sims }}' \
            --confirm-sims '${{ inputs.confirm_sims }}' \
            --trade-screen '${{ inputs.trade_screen }}' \
            --waiver-screen '${{ inputs.waiver_screen }}' \
            --confirm-top '${{ inputs.confirm_top }}' \
            --output /tmp/team-improvement/gm-action-report.json \
            | tee /tmp/team-improvement/summary.log
      - name: Render GM Action Report
        run: |
          python script/render_gm_action_report_v10.py \
            --input /tmp/team-improvement/gm-action-report.json \
            --output /tmp/team-improvement/FSFFL_GM_Action_Report.pdf
          find data/simulator -name full_projection_universe_audit.json -exec cp {} /tmp/team-improvement/full_projection_universe_audit.json \;
      - name: Validate production output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          r=json.load(open('/tmp/team-improvement/gm-action-report.json'))
          assert r['model_version']=='FSFFL-GM-Team-Improvement-Lab-1.6'
          assert r['projection_universe']['model_version']=='FSFFL-Full-Projection-Universe-1.0'
          assert r['policy']['canonical_state_mutated'] is False
          assert r['policy']['roster_aware_trade_resolution'] is True
          assert r['policy']['hold_is_explicit_benchmark'] is True
          assert r['policy']['waiver_candidates_use_canonical_full_projection_universe'] is True
          assert r['policy']['hypothetical_simulator_uses_same_projection_universe_as_lineup_optimizer'] is True
          assert r['search_summary']['waiver_candidates_screened'] > 0
          assert r['recommended_action']['channel'] in {'TRADE','WAIVER','HOLD'}
          for row in r.get('top_cross_channel_options') or []:
              assert all(x.get('roster_legal') is True for x in ((row.get('simulation') or {}).get('roster_resolution') or {}).values())
          pdf=Path('/tmp/team-improvement/FSFFL_GM_Action_Report.pdf')
          assert pdf.exists() and pdf.stat().st_size > 2500
          reader=PdfReader(str(pdf))
          assert len(reader.pages)==1
          text=' '.join((p.extract_text() or '') for p in reader.pages)
          assert 'FSFFL GM ACTION REPORT' in text
          assert r['team_name'] in text
          print(r['recommended_action']['description'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fsffl-gm-action-report
          path: /tmp/team-improvement/*
          if-no-files-found: error
          retention-days: 30
