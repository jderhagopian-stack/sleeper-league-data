name: Alternate History Third Season Validation

on:
  pull_request:
    paths:
      - 'script/run_fsffl_third_season_particles.py'
      - 'script/validate_fsffl_third_season_particles.py'
      - 'script/run_fsffl_next_draft_handoff.py'
      - 'script/run_fsffl_second_season_particles.py'
      - 'script/alternate_history_dynamic_policy.py'
      - 'data/alternate_history/**'
      - '.github/workflows/alternate-history-third-season-validation.yml'
  workflow_dispatch:

concurrency:
  group: alternate-history-third-season-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-third-season:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile third-season modules
        run: |
          python -m py_compile script/run_fsffl_third_season_particles.py
          python -m py_compile script/validate_fsffl_third_season_particles.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Validate stateful 2025 season propagation
        run: python script/validate_fsffl_third_season_particles.py
