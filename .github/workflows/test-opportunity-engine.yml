name: Test Opportunity Engine

on:
  workflow_call:

jobs:
  opportunity-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Compile Opportunity Engine
        run: |
          python -m py_compile \
            script/opportunity_engine/application.py \
            script/opportunity_engine/application_v2.py \
            script/opportunity_engine/application_v21.py \
            script/opportunity_engine/negotiation_frontier.py \
            script/trade_decision/negotiation_frontier.py \
            script/gm3/team_improvement.py \
            script/decision_attribution.py \
            script/decision_utility.py \
            script/run_team_improvement_lab.py \
            script/run_team_improvement_lab_v13.py \
            script/run_team_improvement_lab_v16.py \
            script/render_opportunity_engine_report.py \
            script/render_opportunity_engine_pdf.py \
            script/audit_opportunity_engine_phase2_calibration.py \
            script/test_opportunity_engine.py \
            script/test_opportunity_engine_v2.py \
            script/test_negotiation_price_frontier.py \
            script/test_opportunity_engine_price_search.py
      - name: Run fast architecture/composition regressions
        run: |
          python script/test_opportunity_engine.py
          python script/test_opportunity_engine_v2.py
          python script/test_negotiation_price_frontier.py
          python script/test_opportunity_engine_price_search.py
      - name: Build full projection universe
        run: python script/build_fsffl_full_projection_universe.py
      - name: Run live Opportunity Engine 2.2 executable-opportunity slice
        run: |
          mkdir -p /tmp/opportunity-engine
          python script/opportunity_engine/application_v21.py \
            --focus-user-id 846634401482792960 \
            --quick-sims 30 \
            --confirm-sims 60 \
            --trade-screen 8 \
            --waiver-screen 8 \
            --trade-packages-per-target 4 \
            --price-frontier-targets 6 \
            --price-frontier-packages-per-target 8 \
            --confirm-top 3 \
            --portfolio-depth 5 \
            --portfolio-max-moves 3 \
            --portfolio-beam-width 4 \
            --portfolio-sims 20 \
            --portfolio-confirm-sims 40 \
            --portfolio-confirm-top 2 \
            --robustness-seeds 0 \
            --robustness-sims 20 \
            --trade-review-depth 1 \
            --trade-review-quick-sims 100 \
            --trade-review-confirm-sims 200 \
            --trade-review-search-depth 40 \
            --output /tmp/opportunity-engine/opportunity-board.json
          python script/render_opportunity_engine_report.py \
            --input /tmp/opportunity-engine/opportunity-board.json \
            --output /tmp/opportunity-engine/Opportunity_Engine_Report.md
      - name: Validate governed live output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.load(open('/tmp/opportunity-engine/opportunity-board.json'))
          assert b['model_version']=='FSFFL-Opportunity-Engine-2.2'
          assert b['policy']['creates_new_valuation_model'] is False
          assert b['policy']['creates_new_cross_channel_utility'] is False
          assert b['policy']['search_heuristics_have_final_decision_authority'] is False
          assert b['policy']['adaptive_search_creates_new_utility'] is False
          assert b['policy']['waiver_discovery_fixed_cross_unit_coefficients_active'] is False
          assert b['provenance']['cross_channel_order_preserved_from_source'] is True
          assert b['provenance']['opportunity_engine_rescoring_applied'] is False
          assert b['provenance']['opportunity_engine_reranking_applied'] is False
          assert b['provenance']['portfolio_scores_owned_by_gm3_team_improvement'] is True
          assert b['provenance']['adaptive_portfolio_scores_owned_by_gm3_team_improvement'] is True
          assert b['capability_status']['single_step_trade_search'] is True
          assert b['capability_status']['single_step_waiver_search'] is True
          assert b['capability_status']['adaptive_multi_step_portfolio_optimization'] is True
          assert b['capability_status']['portfolio_search_up_to_three_or_more_moves'] is True
          assert b['capability_status']['prospective_validation_snapshots'] is True
          assert b['capability_status']['negotiation_frontier'] is True
          assert b['capability_status']['discrete_price_frontier'] is True
          assert b['capability_status']['actionable_vs_explore_vs_theoretical_trade_separation'] is True
          assert b['policy']['theoretical_counterparty_failures_can_be_headline_action'] is False
          assert b['policy']['theoretical_packages_can_occupy_actionable_ranking'] is False
          assert b['policy']['portfolio_search_excludes_theoretical_counterparty_failures'] is True
          assert b['portfolio_optimization']['candidate_bundles_evaluated'] > 0
          assert b['portfolio_optimization']['authority']=='GM3 Team Improvement'
          assert b['portfolio_optimization']['deep_confirmed_portfolios'] > 0
          assert b['portfolio_optimization']['screening_and_confirmation_use_same_gm3_utility'] is True
          assert b['portfolio_optimization']['best_single_step_same_precision'] is not None
          assert isinstance(b['portfolio_optimization']['best_portfolio_preferred_to_best_single_step'], bool)
          bp=b['portfolio_optimization']['best_portfolio']
          assert bp is not None
          assert bp['decision_attribution']['reconciles'] is True
          assert abs(float(bp['decision_attribution']['final_shared_decision_utility'])-float(bp['team_improvement_score'])) <= .03
          bs=b['portfolio_optimization']['best_single_step_same_precision']
          assert bs['decision_attribution']['reconciles'] is True
          assert abs(float(bs['decision_attribution']['final_shared_decision_utility'])-float(bs['team_improvement_score'])) <= .03
          assert b['robustness']['used_for_primary_ranking'] is False
          assert b['prospective_validation']['contains_future_outcomes'] is False
          assert len(b['prospective_validation']['source_input_sha256'])==64
          frontier=b['negotiation_frontier']
          assert frontier['authority']=='Trade Decision'
          for row in b.get('ranked_single_step_opportunities') or []:
              if row.get('channel')=='TRADE':
                  nf=row.get('negotiation_frontier') or {}
                  assert nf.get('counterparty_bilateral_viable') is True
                  assert float(nf.get('focal_team_improvement_utility') or 0)>0
          for routed in b.get('trade_decision_reviews') or []:
              td=routed['trade_decision']
              assert td['trade_decision_model_version']=='FSFFL-Counter-Market-Sweep-1.26'
              assert td['generated_proposal_willingness_observed'] is False
              assert td['recommended_next_action'] in {'OPEN_NEGOTIATION','EXPLORE_PRICE','DO_NOT_PURSUE_AT_EXPECTED_COST'}
              assert td['generated_proposal_semantics_applied'] is True
              assert td['underlying_trade_decision_action'] in {'ACCEPT_NOW','ACCEPT','COUNTER_CURRENT_OFFEROR','SHOP_BEFORE_ACCEPTING','DECLINE'}
          assert Path('/tmp/opportunity-engine/Opportunity_Engine_Report.md').stat().st_size > 800
          print('Opportunity Engine 2.2 live governed regression passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opportunity-engine-smoke-test
          path: /tmp/opportunity-engine/*
          if-no-files-found: warn
          retention-days: 14
