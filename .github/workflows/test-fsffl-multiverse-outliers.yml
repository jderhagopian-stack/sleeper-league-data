name: Test FSFFL Multiverse Outliers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  multiverse-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install simulator dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run 50,000-universe outlier tracker
        env:
          FSFFL_SIMULATIONS: "50000"
        run: python script/run_fsffl_multiverse_outliers.py

      - name: Commit multiverse output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/simulator/*/outputs/multiverse_outliers.json

          if git diff --cached --quiet; then
            echo "No multiverse changes to commit."
          else
            git commit -m "Add FSFFL multiverse outlier results"
            git push origin HEAD:main
          fi
