name: Run FSFFL Trade Analysis

on:
  workflow_dispatch:
    inputs:
      scenario_json:
        description: 'Complete Decision Lab scenario JSON. Written only to /tmp; repository state is not mutated.'
        required: true
        type: string
      basename:
        required: false
        default: 'trade-decision-report'
        type: string
      quick_sims:
        required: false
        default: '100'
        type: string
      confirm_sims:
        required: false
        default: '0'
        type: string
      search_depth:
        required: false
        default: '60'
        type: string
jobs:
  trade-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Materialize ephemeral scenario
        env:
          SCENARIO_JSON: ${{ inputs.scenario_json }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads(os.environ['SCENARIO_JSON']);assert s.get('focus_user_id');assert s.get('actions');Path('/tmp/fsffl-trade-scenario.json').write_text(json.dumps(s,indent=2))
          PY
      - name: Run standardized trade pipeline
        run: |
          mkdir -p /tmp/fsffl-trade-output
          python script/run_trade_report.py --scenario /tmp/fsffl-trade-scenario.json --out-dir /tmp/fsffl-trade-output --basename '${{ inputs.basename }}' --quick-sims '${{ inputs.quick_sims }}' --confirm-sims '${{ inputs.confirm_sims }}' --search-depth '${{ inputs.search_depth }}' > /tmp/fsffl-trade-output/pipeline.log
      - name: Validate production output
        env:
          BASENAME: ${{ inputs.basename }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from pypdf import PdfReader
          base=os.environ['BASENAME'] or 'trade-decision-report';root=Path('/tmp/fsffl-trade-output');a=json.loads((root/f'{base}.json').read_text());s=json.loads((root/f'{base}-summary.json').read_text());pdf=root/f'{base}.pdf'
          assert a['model_version']=='FSFFL-Counter-Market-Sweep-1.21';assert a['simulation']['canonical_state_mutated'] is False
          p=a['policy'];assert p['behavioral_intelligence_version']=='FSFFL-Behavioral-Intelligence-3.0';assert p['bi3_opportunity_normalized'] is True;assert p['counter_and_market_pools_separate'] is True;assert p['suggested_counteroffers_max']==2;assert p['market_sweep_max']==5;assert p['market_sweep_excludes_current_partner'] is True
          assert len(a.get('suggested_counteroffers') or [])<=2;assert len(a.get('market_sweep_alternatives') or [])<=5
          assert s['pipeline_model_version']=='FSFFL-Trade-Query-Pipeline-1.10';assert s['report_model_version']=='FSFFL-Trade-Decision-Report-1.3';assert s['canonical_model_entry_point'].endswith('run_trade_market_sweep_v27.py');assert pdf.exists() and 1<=len(PdfReader(str(pdf)).pages)<=3
          print(s['short_answer'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fsffl-trade-analysis
          path: /tmp/fsffl-trade-output/*
          if-no-files-found: error
          retention-days: 30
