name: Run FSFFL Trade Analysis

on:
  workflow_dispatch:
    inputs:
      scenario_json:
        description: 'Complete Decision Lab scenario JSON. Written only to /tmp; repository state is not mutated.'
        required: true
        type: string
      basename:
        required: false
        default: 'trade-decision-report'
        type: string
      quick_sims:
        description: 'Fast screening simulations'
        required: false
        default: '200'
        type: string
      adaptive_confirm_sims:
        description: 'Deep simulation count used automatically for contradictory/close screens'
        required: false
        default: '1000'
        type: string
      search_depth:
        required: false
        default: '60'
        type: string
jobs:
  trade-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Materialize ephemeral scenario
        env:
          SCENARIO_JSON: ${{ inputs.scenario_json }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads(os.environ['SCENARIO_JSON']);assert s.get('focus_user_id');assert s.get('actions');Path('/tmp/fsffl-trade-scenario.json').write_text(json.dumps(s,indent=2))
          PY
      - name: Run standardized trade pipeline
        run: |
          mkdir -p /tmp/fsffl-trade-output
          python script/run_trade_report.py --scenario /tmp/fsffl-trade-scenario.json --out-dir /tmp/fsffl-trade-output --basename '${{ inputs.basename }}' --quick-sims '${{ inputs.quick_sims }}' --adaptive-confirm-sims '${{ inputs.adaptive_confirm_sims }}' --search-depth '${{ inputs.search_depth }}' > /tmp/fsffl-trade-output/pipeline.log
      - name: Validate production output
        env:
          BASENAME: ${{ inputs.basename }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from pypdf import PdfReader
          base=os.environ['BASENAME'] or 'trade-decision-report';root=Path('/tmp/fsffl-trade-output');a=json.loads((root/f'{base}.json').read_text());s=json.loads((root/f'{base}-summary.json').read_text());pdf=root/f'{base}.pdf'
          assert a['model_version']=='FSFFL-Counter-Market-Sweep-1.22';assert a['simulation']['canonical_state_mutated'] is False
          p=a['policy'];assert p['behavioral_intelligence_version']=='FSFFL-Behavioral-Intelligence-3.0';assert p['bi3_opportunity_normalized'] is True;assert p['counter_and_market_pools_separate'] is True;assert p['suggested_counteroffers_max']==2;assert p['market_sweep_max']==5;assert p['market_sweep_excludes_current_partner'] is True;assert p['every_recommended_option_compared_to_current_offer'] is True;assert p['adaptive_deep_confirmation_enabled'] is True
          for x in (a.get('suggested_counteroffers') or [])+(a.get('market_sweep_alternatives') or []):
              c=x.get('comparison_to_current_offer') or {};assert c.get('verdict_vs_current_offer') in {'BETTER','MIXED','WORSE'};assert c.get('reason')
          assert s['pipeline_model_version']=='FSFFL-Trade-Query-Pipeline-1.13';assert s['report_model_version']=='FSFFL-Trade-Decision-Report-1.6';assert s['canonical_model_entry_point'].endswith('run_trade_market_sweep_v28.py');assert pdf.exists() and 1<=len(PdfReader(str(pdf)).pages)<=3
          print(s['short_answer'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fsffl-trade-analysis
          path: /tmp/fsffl-trade-output/*
          if-no-files-found: error
          retention-days: 30
