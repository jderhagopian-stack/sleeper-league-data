name: Run FSFFL Trade Analysis

on:
  workflow_dispatch:
    inputs:
      scenario_json:
        description: 'Complete Decision Lab scenario JSON. Written only to /tmp; repository state is not mutated.'
        required: true
        type: string
      basename:
        description: 'Artifact/report basename'
        required: false
        default: 'trade-decision-report'
        type: string
      quick_sims:
        description: 'Market-screen simulations'
        required: false
        default: '100'
        type: string
      confirm_sims:
        description: 'Confirmation simulations for finalists'
        required: false
        default: '0'
        type: string
      search_depth:
        description: 'Candidate search depth'
        required: false
        default: '60'
        type: string

jobs:
  trade-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install report dependencies
        run: python -m pip install 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Materialize ephemeral scenario
        env:
          SCENARIO_JSON: ${{ inputs.scenario_json }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          scenario=json.loads(os.environ['SCENARIO_JSON'])
          assert scenario.get('focus_user_id'), 'focus_user_id is required'
          assert scenario.get('actions'), 'actions are required'
          Path('/tmp/fsffl-trade-scenario.json').write_text(json.dumps(scenario, indent=2), encoding='utf-8')
          print('Validated ephemeral scenario; canonical repository files unchanged')
          PY
      - name: Run standardized trade pipeline
        run: |
          mkdir -p /tmp/fsffl-trade-output
          python script/run_trade_report.py \
            --scenario /tmp/fsffl-trade-scenario.json \
            --out-dir /tmp/fsffl-trade-output \
            --basename '${{ inputs.basename }}' \
            --quick-sims '${{ inputs.quick_sims }}' \
            --confirm-sims '${{ inputs.confirm_sims }}' \
            --search-depth '${{ inputs.search_depth }}' \
            > /tmp/fsffl-trade-output/pipeline.log
      - name: Validate production output
        env:
          BASENAME: ${{ inputs.basename }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from pypdf import PdfReader
          base=os.environ['BASENAME'] or 'trade-decision-report'
          root=Path('/tmp/fsffl-trade-output')
          analysis=json.loads((root/f'{base}.json').read_text())
          summary=json.loads((root/f'{base}-summary.json').read_text())
          pdf=root/f'{base}.pdf'
          assert analysis['model_version']=='FSFFL-Counter-Market-Sweep-1.17'
          assert analysis['simulation']['canonical_state_mutated'] is False
          p=analysis['policy']
          assert p['continuous_state_weighting'] is True
          assert p['league_realistic_multi_asset_search'] is True
          assert p['competitive_state_treated_as_time_varying'] is True
          assert p['normal_recommendations_require_positive_focal_current_state_utility'] is True
          assert p['owner_behavior_conditioned_on_current_competitive_state'] is True
          assert p['historical_behavior_can_override_current_state_utility'] is False
          assert summary['pipeline_model_version']=='FSFFL-Trade-Query-Pipeline-1.4'
          assert summary['canonical_model_entry_point'].endswith('run_trade_market_sweep_v23.py')
          assert pdf.exists() and len(PdfReader(str(pdf)).pages)==1
          print(summary['short_answer'])
          PY
      - name: Upload analysis and standardized report
        uses: actions/upload-artifact@v4
        with:
          name: fsffl-trade-analysis
          path: |
            /tmp/fsffl-trade-output/*.json
            /tmp/fsffl-trade-output/*.pdf
            /tmp/fsffl-trade-output/pipeline.log
          if-no-files-found: error
          retention-days: 30
