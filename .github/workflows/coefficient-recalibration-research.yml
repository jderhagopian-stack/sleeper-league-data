name: Coefficient Recalibration Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'script/test_coefficient_invariance_monotonicity.py'
      - 'script/audit_strategy_outcome_readiness.py'
      - 'script/run_state_weight_shadow_research.py'
      - 'script/audit_simulator_calibration_chain.py'
      - 'script/audit_historical_team_outcome_evidence.py'
      - 'script/build_historical_trade_outcome_panel.py'
      - 'script/test_superflex_qb_opportunity_cost.py'
      - 'script/evaluate_state_weight_promotion_readiness.py'
      - 'data/model_governance/coefficient_family_research_findings.json'
      - 'script/test_simulator_backup_assignment_optimality.py'
      - 'data/model_governance/strategy_outcome_dataset_spec.json'
      - '.github/workflows/coefficient-recalibration-research.yml'
  workflow_call:

jobs:
  research-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit historical strategy-outcome readiness
        run: python script/audit_strategy_outcome_readiness.py
      - name: Run independent coefficient invariance suite
        run: python script/test_coefficient_invariance_monotonicity.py
      - name: Run non-authoritative state-weight shadow comparison
        run: python script/run_state_weight_shadow_research.py
      - name: Run non-authoritative state-weight shadow comparison
        run: python script/run_state_weight_shadow_research.py
      - name: Audit Simulator calibration chain
        run: python script/audit_simulator_calibration_chain.py
      - name: Audit committed historical team outcome evidence
        run: python script/audit_historical_team_outcome_evidence.py
      - name: Build non-causal historical trade outcome panel
        run: python script/build_historical_trade_outcome_panel.py
      - name: Test endogenous Superflex QB opportunity cost
        run: python script/test_superflex_qb_opportunity_cost.py
      - name: Evaluate evidence-tiered state-weight promotion readiness
        run: python script/evaluate_state_weight_promotion_readiness.py
      - name: Detect greedy backup-assignment suboptimality
        run: python script/test_simulator_backup_assignment_optimality.py
      - name: Assert non-authoritative research boundary
        run: |
          python - <<'PY'
          import json
          spec=json.load(open('data/model_governance/strategy_outcome_dataset_spec.json'))
          assert spec['authority']=='RESEARCH_SPEC_NON_AUTHORITATIVE'
          assert spec['production_behavior_changed'] is False
          assert spec['target_policy']['equal_weight_current_future_liquidity_resilience_composite_forbidden'] is True
          assert spec['target_policy']['candidate_weight_vector_may_not_define_target'] is True
          assert spec['missingness_policy']['current_market_values_cannot_backfill_historical_market_values'] is True
          assert spec['missingness_policy']['current_projections_cannot_backfill_historical_forecasts'] is True

          shadow=json.load(open('data/audit/state_weight_shadow_research.json'))
          assert shadow['authority']=='SHADOW_RESEARCH_NON_AUTHORITATIVE'
          assert shadow['production_behavior_changed'] is False
          assert shadow['candidate_selection_performed'] is False
          assert shadow['empirical_validation_claim'] is False
          assert shadow['hurts_so_good_used_as_target'] is False

          r=json.load(open('data/audit/strategy_outcome_readiness.json'))
          assert r['authority']=='RESEARCH_READINESS_ONLY'
          assert r['production_behavior_changed'] is False
          assert r['summary']['authoritative_empirical_state_weight_claim_allowed'] is False
          assert r['summary']['pristine_temporal_state_weight_calibration_ready'] is False
          assert r['summary']['pristine_frozen_projection_archive_detected'] is False
          assert r['summary']['pristine_frozen_market_archive_detected'] is False
          assert r['summary']['pristine_frozen_gm3_bundle_archive_detected'] is False
          assert r['policy']['filename_or_path_name_is_not_evidence_of_frozen_archive_status'] is True

          s=json.load(open('data/audit/state_weight_shadow_research.json'))
          assert s['authority']=='SHADOW_RESEARCH_NON_AUTHORITATIVE'
          assert s['production_behavior_changed'] is False
          assert s['candidate_selection_performed'] is False
          assert s['empirical_validation_claim'] is False
          assert s['hurts_so_good_used_as_target'] is False

          hist=json.load(open('data/audit/historical_team_outcome_evidence.json'))
          assert hist['authority']=='RESEARCH_DISCOVERY_ONLY'
          assert hist['production_behavior_changed'] is False
          assert hist['summary']['single_scalar_strategy_target_authorized'] is False
          assert hist['policy']['post_decision_team_outcome_is_not_causal_trade_effect'] is True

          panel=json.load(open('data/model_validation/historical_trade_outcome_panel.json'))
          assert panel['authority']=='RESEARCH_PANEL_NON_AUTHORITATIVE'
          assert panel['production_behavior_changed'] is False
          assert panel['summary']['rows_with_strategy_outcome_score']==0
          assert panel['summary']['rows_with_counterfactual_regret']==0
          assert panel['summary']['authoritative_training_rows']==0
          assert panel['policy']['post_decision_outcome_is_not_causal_effect'] is True

          promo=json.load(open('data/audit/state_weight_promotion_readiness.json'))
          assert promo['authority']=='GOVERNANCE_RESEARCH_ONLY'
          assert promo['production_behavior_changed'] is False
          assert promo['calibrator_promotion_flag_is_sufficient_for_production'] is False
          assert promo['production_promotion_allowed'] is False

          sim=json.load(open('data/audit/simulator_calibration_chain_audit.json'))
          assert sim['authority']=='RESEARCH_AUDIT_NON_AUTHORITATIVE'
          assert sim['production_behavior_changed'] is False
          assert sim['summary']['structural_chain_passed'] is True
          assert sim['summary']['arbitrary_points_to_wins_coefficient_detected'] is False
          assert sim['summary']['arbitrary_wins_to_title_coefficient_detected'] is False
          assert sim['summary']['authoritative_empirical_magnitude_claim_allowed'] is False

          print(json.dumps(r['summary'],indent=2))
          print(json.dumps({'shadow_sign_change_count':s['sign_change_count']},indent=2))
          print(json.dumps(sim['summary'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fsffl-coefficient-recalibration-research
          path: |
            data/audit/strategy_outcome_readiness.json
            data/audit/state_weight_shadow_research.json
            data/audit/simulator_calibration_chain_audit.json
            data/audit/historical_team_outcome_evidence.json
            data/model_validation/historical_trade_outcome_panel.json
            data/audit/state_weight_promotion_readiness.json
          retention-days: 30
