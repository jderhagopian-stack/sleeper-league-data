name: Alternate History Rookie Draft Validation

on:
  pull_request:
    paths:
      - 'script/alternate_history_historical_state.py'
      - 'script/alternate_history_rookie_draft_policy.py'
      - 'script/run_fsffl_predraft_particles.py'
      - 'script/run_fsffl_alternate_rookie_draft_particles.py'
      - 'data/alternate_history/**'
      - '.github/workflows/alternate-history-rookie-draft-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rookie-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile rookie-draft modules
        run: |
          python -m py_compile script/alternate_history_historical_state.py
          python -m py_compile script/alternate_history_rookie_draft_policy.py
          python -m py_compile script/run_fsffl_predraft_particles.py
          python -m py_compile script/run_fsffl_alternate_rookie_draft_particles.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Run state-aware 2024 alternate rookie draft
        run: python script/run_fsffl_alternate_rookie_draft_particles.py data/alternate_history/scenarios/puka_vs_van_2023.json --particles 50 --seed 20260824
