name: Trade Current-Evidence Cross-Case Validation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/trade-current-evidence-ensemble
    paths:
      - '.github/workflows/trade-current-evidence-cross-case.yml'

permissions:
  contents: read

jobs:
  cross-case:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout baseline main
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy 'reportlab>=4,<5' 'pypdf>=4,<7'

      - name: Materialize objective cross-case scenarios
        run: |
          mkdir -p /tmp/fsffl-cross-cases
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/fsffl-cross-cases')
          cases=[
            {
              "id":"01_warren_veteran_package",
              "category":"known_conflicting_evidence_regression",
              "focus":"844785316274483200",
              "a":"844785316274483200","b":"850548458887704576",
              "send":["12518"],"receive":["5012","5846"],
              "receive_picks":["pick:2029:R2:orig11","pick:2029:R3:orig11","pick:2029:R3:orig4"],
            },
            {
              "id":"02_young_to_win_now",
              "category":"young_asset_for_win_now_veteran",
              "focus":"846634401482792960",
              "a":"846634401482792960","b":"845157822193872896",
              "send":["13298"],"receive":["3198"],
            },
            {
              "id":"03_aging_to_young_future",
              "category":"aging_star_for_younger_long_term_asset",
              "focus":"845157822193872896",
              "a":"845157822193872896","b":"858530218330144768",
              "send":["4034"],"receive":["12517"],
            },
            {
              "id":"04_young_to_aging_win_now",
              "category":"younger_asset_for_aging_high_redraft_star",
              "focus":"858530218330144768",
              "a":"858530218330144768","b":"845157822193872896",
              "send":["12517"],"receive":["4034"],
            },
            {
              "id":"05_consolidation_two_for_one",
              "category":"consolidation_two_for_one",
              "focus":"846634401482792960",
              "a":"846634401482792960","b":"850548458887704576",
              "send":["9997","7525"],"receive":["6794"],
            },
            {
              "id":"06_diversification_one_for_two",
              "category":"diversification_one_for_two",
              "focus":"850548458887704576",
              "a":"850548458887704576","b":"846634401482792960",
              "send":["6794"],"receive":["9997","7525"],
            },
            {
              "id":"07_near_neutral_same_position",
              "category":"near_neutral_same_position",
              "focus":"844785316274483200",
              "a":"844785316274483200","b":"850548458887704576",
              "send":["9224"],"receive":["8151"],
            },
            {
              "id":"08_obvious_bad",
              "category":"obvious_bad_same_position",
              "focus":"844785316274483200",
              "a":"844785316274483200","b":"850548458887704576",
              "send":["7547"],"receive":["5846"],
            },
            {
              "id":"09_obvious_good",
              "category":"obvious_good_same_position",
              "focus":"850548458887704576",
              "a":"850548458887704576","b":"844785316274483200",
              "send":["5846"],"receive":["7547"],
            },
            {
              "id":"10_positional_repair_candidate",
              "category":"cross_position_need_repair_candidate",
              "focus":"846634401482792960",
              "a":"846634401482792960","b":"709546576091090944",
              "send":["6801"],"receive":["9484"],
            },
            {
              "id":"11_youth_age_without_current_gain",
              "category":"young_te_for_old_te_similar_redraft",
              "focus":"725401251478605824",
              "a":"725401251478605824","b":"844772511156670464",
              "send":["12506"],"receive":["4217"],
            },
          ]
          manifest=[]
          for c in cases:
              payload={
                "scenario_id":"cross_case_"+c["id"],
                "description":"Objective cross-case validation fixture: "+c["category"],
                "focus_user_id":c["focus"],
                "actions":[
                  {"type":"trade","from_user_id":c["a"],"to_user_id":c["b"],"players":c["send"],"picks":c.get("send_picks",[])},
                  {"type":"trade","from_user_id":c["b"],"to_user_id":c["a"],"players":c["receive"],"picks":c.get("receive_picks",[])},
                ],
              }
              (root/(c["id"]+".json")).write_text(json.dumps(payload,indent=2)+"\n")
              manifest.append({"id":c["id"],"category":c["category"],"focus_user_id":c["focus"]})
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps(manifest,indent=2))
          PY

      - name: Run baseline 2.0 and candidate 2.1 decision paths
        run: |
          mkdir -p /tmp/fsffl-cross-output/baseline /tmp/fsffl-cross-output/candidate
          for f in /tmp/fsffl-cross-cases/[0-9][0-9]_*.json; do
            id="$(basename "$f" .json)"
            (cd baseline && python script/run_roster_decision_lab.py \
              --scenario "$f" --sims 2500 \
              --output "/tmp/fsffl-cross-output/baseline/$id.json") \
              > "/tmp/fsffl-cross-output/baseline/$id.log"
            (cd candidate && python script/run_roster_decision_lab.py \
              --scenario "$f" --sims 2500 \
              --output "/tmp/fsffl-cross-output/candidate/$id.json") \
              > "/tmp/fsffl-cross-output/candidate/$id.log"
          done

      - name: Compare versions and classify recommendation changes
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          root=Path('/tmp/fsffl-cross-output')
          manifest=json.loads(Path('/tmp/fsffl-cross-cases/manifest.json').read_text())
          rows=[]
          for meta in manifest:
              cid=meta['id']
              old=json.loads((root/'baseline'/(cid+'.json')).read_text())
              new=json.loads((root/'candidate'/(cid+'.json')).read_text())
              def score(x): return float(x.get('shared_decision_utility_score') or 0.0)
              so,sn=score(old),score(new)
              od=((old.get('decision_attribution') or {}).get('diagnostics') or {})
              nd=((new.get('decision_attribution') or {}).get('diagnostics') or {})
              ev=nd.get('current_value_evidence') or {}
              def sign(v): return 'POS' if v>1e-9 else 'NEG' if v<-1e-9 else 'ZERO'
              rows.append({
                **meta,
                'baseline_model':old.get('shared_decision_utility_model_version'),
                'candidate_model':new.get('shared_decision_utility_model_version'),
                'baseline_score':round(so,2),
                'candidate_score':round(sn,2),
                'baseline_sign':sign(so),
                'candidate_sign':sign(sn),
                'sign_changed':sign(so)!=sign(sn),
                'simulator_current_value':ev.get('simulator_outcome_value'),
                'transaction_redraft_delta':ev.get('transaction_market_redraft_delta'),
                'starter_redraft_delta':ev.get('optimized_starter_redraft_delta'),
                'candidate_current_primitive':((new.get('decision_attribution') or {}).get('channels') or [{}])[0].get('primitive_value'),
                'candidate_future_primitive':((new.get('decision_attribution') or {}).get('channels') or [{},{}])[1].get('primitive_value'),
                'evidence_count':nd.get('current_value_evidence_count'),
              })
          summary={
            'cases':len(rows),
            'sign_changes':sum(r['sign_changed'] for r in rows),
            'stable_positive':sum(r['baseline_sign']=='POS' and r['candidate_sign']=='POS' for r in rows),
            'stable_negative':sum(r['baseline_sign']=='NEG' and r['candidate_sign']=='NEG' for r in rows),
            'baseline_model_versions':sorted({r['baseline_model'] for r in rows}),
            'candidate_model_versions':sorted({r['candidate_model'] for r in rows}),
          }
          out={'summary':summary,'cases':rows}
          (root/'cross_case_comparison.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          assert summary['baseline_model_versions']==['FSFFL-Shared-Decision-Utility-2.0']
          assert summary['candidate_model_versions']==['FSFFL-Shared-Decision-Utility-2.1']
          obvious={r['id']:r for r in rows}
          assert obvious['08_obvious_bad']['candidate_sign']=='NEG'
          assert obvious['09_obvious_good']['candidate_sign']=='POS'
          assert obvious['01_warren_veteran_package']['candidate_sign']=='NEG'
          assert obvious['11_youth_age_without_current_gain']['candidate_sign']=='NEG'
          PY

      - name: High-precision candidate confirmation on every cross-case
        run: |
          mkdir -p /tmp/fsffl-cross-output/confirmed
          for f in /tmp/fsffl-cross-cases/[0-9][0-9]_*.json; do
            id="$(basename "$f" .json)"
            (cd candidate && python script/run_trade_report.py \
              --scenario "$f" \
              --out-dir /tmp/fsffl-cross-output/confirmed \
              --basename "$id" \
              --quick-sims 200 \
              --adaptive-confirm-sims 10000 \
              --search-depth 30) \
              > "/tmp/fsffl-cross-output/confirmed/$id.pipeline.log"
          done

      - name: Consolidate production-path confirmations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/fsffl-cross-output')
          cmp=json.loads((root/'cross_case_comparison.json').read_text())
          rows=[]
          for r in cmp['cases']:
              cid=r['id']
              p=json.loads((root/'confirmed'/(cid+'.json')).read_text())
              cur=p.get('current_offer_evaluation') or {}
              rows.append({
                'id':cid,
                'category':r['category'],
                'screen_baseline_score':r['baseline_score'],
                'screen_candidate_score':r['candidate_score'],
                'screen_sign_changed':r['sign_changed'],
                'confirmed_recommended_next_action':p.get('recommended_next_action'),
                'confirmed_shared_decision_utility_score':cur.get('shared_decision_utility_score'),
                'confirmation_source':((p.get('adaptive_confirmation') or {}).get('final_metrics_source')),
                'confirmation_sims':((p.get('adaptive_confirmation') or {}).get('confirmation_sims')),
                'simulator_current_value':r['simulator_current_value'],
                'transaction_redraft_delta':r['transaction_redraft_delta'],
                'starter_redraft_delta':r['starter_redraft_delta'],
                'candidate_current_primitive':r['candidate_current_primitive'],
                'candidate_future_primitive':r['candidate_future_primitive'],
              })
          out={
            'validation_type':'CROSS_CASE_NOT_COEFFICIENT_FITTING',
            'owner_intuition_used_as_target':False,
            'new_coefficients_introduced':False,
            'player_specific_rules_introduced':False,
            'position_specific_rules_introduced':False,
            'cases':rows,
          }
          (root/'cross_case_confirmed_summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          by={x['id']:x for x in rows}
          assert by['01_warren_veteran_package']['confirmed_recommended_next_action']!='ACCEPT_NOW'
          assert by['08_obvious_bad']['confirmed_recommended_next_action']!='ACCEPT_NOW'
          assert by['09_obvious_good']['confirmed_recommended_next_action']=='ACCEPT_NOW'
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trade-current-evidence-cross-case
          path: |
            /tmp/fsffl-cross-cases/*
            /tmp/fsffl-cross-output/cross_case_comparison.json
            /tmp/fsffl-cross-output/cross_case_confirmed_summary.json
            /tmp/fsffl-cross-output/confirmed/*-summary.json
            /tmp/fsffl-cross-output/confirmed/*.pipeline.log
          if-no-files-found: warn
          retention-days: 30
