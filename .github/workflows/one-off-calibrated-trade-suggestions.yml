name: One-off Calibrated Trade Suggestions Hurts and Chef

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-calibrated-trade-suggestions.yml'

jobs:
  suggestions:
    strategy:
      matrix:
        include:
          - slug: hurts-so-good
            uid: "846634401482792960"
          - slug: chef-bodini
            uid: "709546576091090944"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'reportlab>=4,<5' 'pypdf>=4,<7'
      - run: python script/build_fsffl_full_projection_universe.py
      - name: Run calibrated Team Improvement Lab
        run: |
          mkdir -p /tmp/${{ matrix.slug }}
          python script/run_team_improvement_lab_v13.py \
            --focus-user-id ${{ matrix.uid }} \
            --quick-sims 200 \
            --confirm-sims 1000 \
            --trade-screen 60 \
            --waiver-screen 30 \
            --confirm-top 10 \
            --output /tmp/${{ matrix.slug }}/trade-suggestions.json
          python script/render_gm_action_report_v10.py \
            --input /tmp/${{ matrix.slug }}/trade-suggestions.json \
            --output /tmp/${{ matrix.slug }}/Trade_Suggestions_Report.pdf
      - name: Write top five summary
        run: |
          python - <<'PY'
          import json,os
          slug=os.environ['SLUG']
          r=json.load(open(f'/tmp/{slug}/trade-suggestions.json'))
          out={
            'model_version':r.get('model_version'),
            'team_name':r.get('team_name'),
            'team_state':r.get('team_state'),
            'ranking_calibration':r.get('ranking_calibration'),
            'search_summary':r.get('search_summary'),
            'top_5_trade_suggestions':[]
          }
          for i,x in enumerate((r.get('best_trade_options') or [])[:5],1):
            sim=x.get('simulation') or {}; d=sim.get('focus_delta') or {}; st=sim.get('strategic') or {}
            out['top_5_trade_suggestions'].append({
              'rank':i,'description':x.get('description'),'other_team':x.get('seller_team'),
              'acceptance_fit':x.get('acceptance_fit'),'actionable':x.get('actionable'),
              'expected_wins_delta':d.get('expected_wins'),
              'playoff_probability_delta':d.get('playoff_probability'),
              'bye_probability_delta':d.get('bye_probability'),
              'championship_probability_delta':d.get('championship_probability'),
              'expected_points_delta':d.get('expected_points_for'),
              'long_term_trade_value_delta':st.get('market_dynasty_delta'),
              'value_to_team_delta':st.get('base_franchise_value_delta'),
              'resale_safety_delta':st.get('break_glass_delta'),
              'overall_team_fit_score':x.get('team_improvement_score'),
              'dynasty_value_guardrail':x.get('dynasty_value_guardrail'),
              'deep_sim_count':sim.get('simulation_count')
            })
          json.dump(out,open(f'/tmp/{slug}/top-5-trades.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          PY
        env:
          SLUG: ${{ matrix.slug }}
      - name: Validate report
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          import os,json
          slug=os.environ['SLUG']
          r=json.load(open(f'/tmp/{slug}/trade-suggestions.json'))
          assert r['model_version']=='FSFFL-GM-Team-Improvement-Lab-1.4'
          assert r['ranking_calibration']['version']=='competitive-state-calibration-2.0'
          reader=PdfReader(f'/tmp/{slug}/Trade_Suggestions_Report.pdf')
          text='\n'.join((p.extract_text() or '') for p in reader.pages)
          assert '...' not in text and '\u2026' not in text
          print('pages',len(reader.pages))
          PY
        env:
          SLUG: ${{ matrix.slug }}
      - uses: actions/upload-artifact@v4
        with:
          name: calibrated-trade-suggestions-${{ matrix.slug }}-20260827
          path: /tmp/${{ matrix.slug }}/*
          if-no-files-found: error
          retention-days: 30
