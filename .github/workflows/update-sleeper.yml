name: Update Sleeper League Data

on:

  workflow_dispatch:

  schedule:

    - cron: "15 10 * * *"

permissions:

  contents: write

concurrency:

  group: sleeper-data-update

  cancel-in-progress: false

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Check out repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

      - name: Sync latest main

        run: |

          git fetch origin main

          git reset --hard origin/main

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install simulator dependency

        run: python -m pip install --disable-pip-version-check numpy

      - name: Fetch Sleeper data

        run: python script/update_sleeper.py

      - name: Fetch full FSFFL schedule

        run: python script/update_full_schedule.py

      - name: Build NFL schedule and matchup layer

        run: python script/build_fsffl_nfl_schedule_matchups.py

      - name: Build FSFFL projection sources

        run: python script/build_fsffl_player_projections.py

      - name: Build FSFFL scoring baseline

        run: python script/build_fsffl_scoring_baseline.py

      - name: Build FSFFL weekly projections

        run: python script/build_fsffl_weekly_projections.py

      - name: Apply dynamic in-season updates

        run: python script/apply_fsffl_dynamic_updates.py

      - name: Run production FSFFL Season Simulator

        env:

          FSFFL_SIMULATIONS: "50000"

        run: python script/run_fsffl_season_simulator_preproduction.py

      - name: Archive production simulator snapshot

        run: python script/archive_fsffl_simulator_snapshot.py

      - name: Build FSFFL GM Engine

        run: python script/build_fsffl_gm_engine.py

      - name: Commit updated data

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then

            echo "No data changes to commit."

          else

            git commit -m "Update Sleeper league and simulator data"

            git push origin HEAD:main

          fi
