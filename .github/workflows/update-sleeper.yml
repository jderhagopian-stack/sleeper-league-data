name: Update Sleeper League Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * *"

permissions:
  contents: write

concurrency:
  group: sleeper-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy pandas pyarrow

      - name: Verify GM 3.0.0 production baseline exists
        shell: bash
        run: |
          test -f data/gm30_reference/manifest.json
          test -f script/run_gm300_production_pipeline.sh
          echo "GM 3.0.0 production baseline and canonical runner found."

      - name: Fetch Sleeper data
        run: python script/update_sleeper.py

      - name: Fetch full FSFFL schedule
        run: python script/update_full_schedule.py

      - name: Build NFL schedule and matchup layer
        run: python script/build_fsffl_nfl_schedule_matchups.py

      - name: Build FSFFL projection sources
        run: python script/build_fsffl_player_projections.py

      - name: Build FSFFL scoring baseline
        run: python script/build_fsffl_scoring_baseline.py

      - name: Build FSFFL weekly projections
        run: python script/build_fsffl_weekly_projections.py

      - name: Apply dynamic in-season updates
        run: python script/apply_fsffl_dynamic_updates.py

      - name: Run production FSFFL Season Simulator
        env:
          FSFFL_SIMULATIONS: "50000"
        run: python script/run_fsffl_season_simulator_preproduction.py

      - name: Build FSFFL multiverse outliers
        env:
          FSFFL_SIMULATIONS: "50000"
        run: python script/run_fsffl_multiverse_outliers.py

      - name: Archive production simulator snapshot
        run: python script/archive_fsffl_simulator_snapshot.py

      - name: Run canonical GM 3.0.0 production pipeline
        env:
          GM30_FOCAL_MANAGER: "jimmygoodjob"
          GM30_CF_SCREEN_SIMS: "2500"
          GM30_CF_FOCAL_SCREEN_SIMS: "5000"
          GM30_CF_FINAL_SIMS: "15000"
          GM30_CF_GENERAL_TARGETS: "3"
          GM30_CF_GENERAL_PACKAGES: "1"
          GM30_CF_FOCAL_TARGETS: "6"
          GM30_CF_FOCAL_PACKAGES: "2"
          GM30_CF_FOCAL_FINALISTS: "3"
        run: bash script/run_gm300_production_pipeline.sh

      - name: Commit refreshed league, simulator, and GM 3.0.0 state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh Sleeper league and GM 3.0.0 production state"
            git push origin HEAD:main
          fi
