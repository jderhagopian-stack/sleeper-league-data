name: Test FSFFL Simulator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulator-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install simulator dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Build NFL schedule and matchup layer
        run: python script/build_fsffl_nfl_schedule_matchups.py

      - name: Build FSFFL projection sources
        run: python script/build_fsffl_player_projections.py

      - name: Build FSFFL scoring baseline
        run: python script/build_fsffl_scoring_baseline.py

      - name: Build FSFFL weekly projections
        run: python script/build_fsffl_weekly_projections.py

      - name: Apply dynamic in-season updates
        run: python script/apply_fsffl_dynamic_updates.py

      - name: Run launch-validation FSFFL Season Simulator
        env:
          FSFFL_SIMULATIONS: "50000"
        run: python script/run_fsffl_season_simulator.py

      - name: Archive launch-validation snapshot
        run: python script/archive_fsffl_simulator_snapshot.py

      - name: Commit simulator test outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/simulator/

          if git diff --cached --quiet; then
            echo "No simulator changes to commit."
          else
            git commit -m "Validate FSFFL Simulator 1.0 production launch"
            git push origin HEAD:main
          fi
