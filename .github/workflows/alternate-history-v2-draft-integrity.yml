name: Alternate History V2 Publication Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - feature/alternate-history-v2
    paths:
      - .github/workflows/alternate-history-v2-draft-integrity.yml
      - script/run_fsffl_alternate_history_magazine_v4.py
      - script/run_fsffl_alternate_history_magazine_v5.py
      - script/run_fsffl_alternate_history_magazine_v6.py
      - script/run_fsffl_alternate_history_magazine_v3.py
      - script/run_fsffl_next_draft_handoff.py
      - script/run_fsffl_alternate_rookie_draft_particles.py
      - script/alternate_history_rookie_draft_policy.py

jobs:
  reader-publication-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publication runtime
        run: python -m pip install --disable-pip-version-check numpy reportlab pypdf
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Prove historical round is not an eligibility wall
        run: |
          PYTHONPATH=script python - <<'PY'
          from alternate_history_rookie_draft_policy import candidate_distribution
          from run_fsffl_alternate_draft_candidates import raw_draft
          from run_fsffl_alternate_draft_policy import normalized_picks
          from run_fsffl_counterfactual_replay import player_positions

          positions = player_positions()
          for season in ('2024', '2025', '2026'):
              picks = normalized_picks(raw_draft(season))
              round1 = [p for p in picks if int(p['round']) == 1]
              dist = candidate_distribution(
                  round1,
                  current_pick_no=12,
                  controller_roster_id='1',
                  controller_user_id='',
                  revealed_player_ids=set(),
                  tendencies={},
                  state={'roster_players': {}},
                  positions=positions,
              )
              candidate_ids = {str(x['player']['player_id']) for x in dist}
              actual_round2 = {str(p['player_id']) for p in picks if int(p['round']) == 2}
              assert candidate_ids & actual_round2, f'{season}: 1.12 cannot consider any historical round-2 rookie'
          print('cross-round market eligibility validated for 2024-2026')
          PY
      - name: Build consensus-path causal smoke edition
        run: |
          time python script/run_fsffl_alternate_history_magazine_v6.py \
            data/alternate_history/scenarios/puka_vs_van_2023.json \
            --particles 20 --sims 20 --seed 20260824
      - name: Enforce V2 publication contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader

          root = Path('data/alternate_history/results/puka_vs_van_2023')
          path = root / 'alternate_history_magazine_1_0.json'
          pdf = root / 'alternate_history_magazine_1_0.pdf'
          data = json.loads(path.read_text())
          drafts = data.get('drafts') or []
          assert [d['draft_season'] for d in drafts] == ['2024', '2025', '2026']
          for draft in drafts:
              season = draft['draft_season']
              picks = draft.get('picks') or []
              assert len(picks) == 36, (season, len(picks))
              assert draft.get('publication_selection_semantics') == 'single_retained_sequential_particle_path'
              assert draft.get('representative_selection_method') == 'retained_path_maximizing_sum_log_pick_marginals'
              players = [p.get('representative_player_id') for p in picks]
              assert all(players), f'{season}: missing representative player'
              assert len(players) == len(set(players)), f'{season}: duplicate representative rookie'
              assert all(p.get('representative_controller_roster_id') for p in picks), f'{season}: missing alternate controller'
              assert all(p.get('representative_team') for p in picks), f'{season}: missing alternate team name'
              assert all(p.get('actual_team') for p in picks), f'{season}: missing historical team name'
              assert all(p.get('draft_order_explanation') for p in picks), f'{season}: missing draft-order provenance'
              assert all(0.0 <= float(p.get('selection_change_probability')) <= 1.0 for p in picks), f'{season}: invalid selection-change probability'
              assert all((p.get('alternate_choices') or [{}])[0].get('player_id') == p.get('representative_player_id') for p in picks)
          for season in data.get('seasons') or []:
              rows = season.get('alternate_expected_standings') or []
              assert all(r.get('most_likely_seed') for r in rows), season['season']
              assert all(r.get('likely_seed_low') and r.get('likely_seed_high') for r in rows), season['season']
          rosters = data['present_day']['rosters']
          assert len(rosters) == 12
          assert all(r.get('reader_roster_semantics') == 'complete coherent league state plus consensus membership probabilities' for r in rosters)
          assert all(r.get('representative_full_roster') for r in rosters)
          reader = PdfReader(str(pdf))
          text = '\n'.join((p.extract_text() or '') for p in reader.pages)
          assert 'WHERE EVERYONE ENDS UP' in text
          assert 'PRESENT-DAY POWER RANKINGS' in text
          assert 'WHY THE ORDER CHANGED' in text
          assert 'modal roster 1.0%' not in text.lower()
          assert 'forced_no_action' not in text
          assert 'preserve_historical_trade' not in text
          print({
              'pages': len(reader.pages),
              'drafts': [d['draft_season'] for d in drafts],
              'unique_players_each_draft': {d['draft_season']: len({p['representative_player_id'] for p in d['picks']}) for d in drafts},
              'high_change_slots': {d['draft_season']: sum(float(p['selection_change_probability']) >= .5 for p in d['picks']) for d in drafts},
              'reader_rosters': len(rosters),
              'technical_jargon_blocked': True,
          })
          PY
      - name: Upload V2 smoke publication
        uses: actions/upload-artifact@v4
        with:
          name: alternate-history-v2-reader-smoke
          path: |
            data/alternate_history/results/puka_vs_van_2023/alternate_history_magazine_1_0.json
            data/alternate_history/results/puka_vs_van_2023/alternate_history_magazine_1_0.pdf
