name: Alternate History V2 Draft Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - feature/alternate-history-v2
    paths:
      - .github/workflows/alternate-history-v2-draft-integrity.yml
      - script/run_fsffl_alternate_history_magazine_v4.py
      - script/run_fsffl_alternate_history_magazine_v3.py
      - script/run_fsffl_next_draft_handoff.py
      - script/run_fsffl_alternate_rookie_draft_particles.py
      - script/alternate_history_rookie_draft_policy.py

jobs:
  coherent-draft-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publication runtime
        run: python -m pip install --disable-pip-version-check numpy reportlab pypdf
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Build V2 coherent-draft smoke edition
        run: |
          python script/run_fsffl_alternate_history_magazine_v4.py \
            data/alternate_history/scenarios/puka_vs_van_2023.json \
            --particles 20 --sims 20 --seed 20260824
      - name: Enforce sequential draft publication contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/alternate_history/results/puka_vs_van_2023/alternate_history_magazine_1_0.json')
          data = json.loads(path.read_text())
          drafts = data.get('drafts') or []
          assert drafts, 'no drafts published'
          for draft in drafts:
              season = draft['draft_season']
              picks = draft.get('picks') or []
              assert len(picks) == 36, (season, len(picks))
              assert draft.get('publication_selection_semantics') == 'single_retained_sequential_particle_path'
              players = [p.get('representative_player_id') for p in picks]
              assert all(players), f'{season}: missing representative player'
              assert len(players) == len(set(players)), f'{season}: duplicate representative rookie'
              assert all(p.get('representative_controller_roster_id') for p in picks), f'{season}: missing alternate controller'
              assert all(p.get('representative_team') for p in picks), f'{season}: missing alternate team name'
              assert all(p.get('actual_team') for p in picks), f'{season}: missing historical team name'
              # The coherent representative player must be the first displayed
              # alternate so legacy renderer code cannot reintroduce duplicate
              # per-pick marginal modes into the published table.
              assert all((p.get('alternate_choices') or [{}])[0].get('player_id') == p.get('representative_player_id') for p in picks)
          print({
              'drafts': [d['draft_season'] for d in drafts],
              'unique_representative_players': {d['draft_season']: len({p['representative_player_id'] for p in d['picks']}) for d in drafts},
              'actual_team_attribution_complete': True,
              'alternate_team_attribution_complete': True,
          })
          PY
