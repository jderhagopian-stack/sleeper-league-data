name: State Weight Sensitivity

on:
  workflow_call:
jobs:
  state-weight-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy
      - run: python -m py_compile script/audit_state_weight_sensitivity.py script/gm_state_weighting.py
      - name: Validate Simulator-authoritative competitive strength
        run: |
          python - <<'PY'
          import importlib.util,json
          spec=importlib.util.spec_from_file_location('s','script/gm_state_weighting.py')
          s=importlib.util.module_from_spec(spec);spec.loader.exec_module(s)
          uid='846634401482792960'
          r=s.resolve({'user_id':uid,'contender_score':0.542,'dynasty_roster_score':0.458})
          inp=r['inputs']
          assert inp['competitive_strength_source']=='canonical_simulator_league_percentile', inp
          assert inp['competitive_strength_score'] > 0.80, inp
          assert abs(inp['roster_strength_score']-0.542) < 1e-9, inp
          assert r['adjustments']['championship_adjustment_policy']=='suppressed_to_avoid_simulator_double_counting'
          assert r['classification_status']=='PROVISIONAL_EXPERT_PRIOR_LABEL_ONLY'
          print(json.dumps(r,indent=2))
          PY
      - name: Run reasonable-weight perturbation
        run: |
          python script/audit_state_weight_sensitivity.py \
            --scenario data/decision_lab/full_validation_scenario.json \
            --quick-sims 100 --search-depth 40 \
            --output /tmp/state-weight-sensitivity.json
      - name: Validate audit
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/state-weight-sensitivity.json'))
          assert d['interpretation']['historical_validation'] is False
          assert d['interpretation']['coefficient_tuning'] is False
          assert d['perturbation']['within_configured_bounds'] is True
          assert set(d['comparisons'])=={'production_prior','current_heavy','future_heavy'}
          assert d['summary']['production_weights_empirically_authoritative'] is False
          print(json.dumps(d['summary'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: state-weight-sensitivity
          path: /tmp/state-weight-sensitivity.json
          retention-days: 30
