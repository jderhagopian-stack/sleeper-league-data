name: Alternate History Second Season Validation

on:
  workflow_dispatch:

concurrency:
  group: alternate-history-second-season-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-second-season:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile second-season modules
        run: |
          python -m py_compile script/alternate_history_dynamic_policy.py
          python -m py_compile script/alternate_history_postdraft_state.py
          python -m py_compile script/run_fsffl_second_season_particles.py
          python -m py_compile script/validate_fsffl_second_season_particles.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Validate dynamic 2024 second-season replay
        run: python script/validate_fsffl_second_season_particles.py
