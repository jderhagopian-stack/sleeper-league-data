name: Alternate History Next Draft Validation

on:
  workflow_dispatch:

concurrency:
  group: alternate-history-next-draft-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-next-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile next-draft modules
        run: |
          python -m py_compile script/run_fsffl_second_season_particles.py
          python -m py_compile script/run_fsffl_next_draft_handoff.py
          python -m py_compile script/validate_fsffl_next_draft_handoff.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Validate stateful 2025 rookie-draft handoff
        run: python script/validate_fsffl_next_draft_handoff.py
