name: Trade Current-Evidence Case 04 Focused

on:
  push:
    branches:
      - fix/trade-current-evidence-ensemble
    paths:
      - '.github/workflows/trade-current-evidence-case04-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Build scenario
        run: |
          cat > /tmp/case04.json <<'JSON'
          {
            "scenario_id":"case04_young_to_aging_win_now",
            "description":"Context-specific reciprocal age test: King B sends Colston Loveland for Christian McCaffrey.",
            "focus_user_id":"858530218330144768",
            "actions":[
              {"type":"trade","from_user_id":"858530218330144768","to_user_id":"845157822193872896","players":["12517"],"picks":[]},
              {"type":"trade","from_user_id":"845157822193872896","to_user_id":"858530218330144768","players":["4034"],"picks":[]}
            ]
          }
          JSON
          mkdir -p /tmp/c04/base /tmp/c04/cand
      - name: Baseline
        run: |
          (cd baseline && python script/run_trade_report.py --scenario /tmp/case04.json --out-dir /tmp/c04/base --basename result --quick-sims 200 --adaptive-confirm-sims 10000 --search-depth 1) > /tmp/c04/base/log.txt
      - name: Candidate
        run: |
          (cd candidate && python script/run_trade_report.py --scenario /tmp/case04.json --out-dir /tmp/c04/cand --basename result --quick-sims 200 --adaptive-confirm-sims 10000 --search-depth 1) > /tmp/c04/cand/log.txt
      - name: Compare
        run: |
          python - <<'PY'
          import json
          old=json.load(open('/tmp/c04/base/result.json'))
          new=json.load(open('/tmp/c04/cand/result.json'))
          oc=old['current_offer_evaluation']; nc=new['current_offer_evaluation']
          oa=oc['decision_attribution']; na=nc['decision_attribution']; nd=na['diagnostics']
          out={
            'id':'04_young_to_aging_win_now',
            'baseline_action':old.get('recommended_next_action'),
            'candidate_action':new.get('recommended_next_action'),
            'baseline_score':oc.get('shared_decision_utility_score'),
            'candidate_score':nc.get('shared_decision_utility_score'),
            'baseline_model':oa.get('shared_decision_utility_model_version'),
            'candidate_model':na.get('shared_decision_utility_model_version'),
            'current_evidence':nd.get('current_value_evidence'),
            'current_primitive':next((x.get('primitive_value') for x in na.get('channels',[]) if x.get('channel')=='current'),None),
            'future_primitive':next((x.get('primitive_value') for x in na.get('channels',[]) if x.get('channel')=='future'),None),
          }
          open('/tmp/c04/comparison.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          assert out['baseline_model']=='FSFFL-Shared-Decision-Utility-2.0'
          assert out['candidate_model']=='FSFFL-Shared-Decision-Utility-2.1'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case04-focused
          path: /tmp/c04/comparison.json
          if-no-files-found: warn
          retention-days: 30
