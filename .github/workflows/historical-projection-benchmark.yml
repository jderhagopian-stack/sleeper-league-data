name: Historical Projection Benchmark

on:
  pull_request:
    paths:
      - 'script/build_historical_projection_benchmark_input.py'
      - 'script/benchmark_historical_projections.py'
      - 'script/benchmark_historical_projections_common_cohort.py'
      - 'script/benchmark_native_vs_external_raw_stats.py'
      - 'script/run_native_vs_fftoday_historical_benchmark.py'
      - 'script/run_2014_multisource_raw_stat_benchmark.py'
      - 'script/analyze_native_projection_residuals.py'
      - 'script/normalize_ffa_historical_projection_archive.py'
      - 'script/normalize_current_projection_source.py'
      - 'script/audit_projection_source_sustainability.py'
      - 'script/benchmark_projection_championship_ensemble.py'
      - 'data/model_validation/historical_projection_source_inventory.json'
      - 'data/model_validation/projection_source_candidate_registry.json'
      - 'data/model_validation/projection_championship_ensemble_spec.json'
      - 'data/model_validation/projection_championship_expanded_source_board.json'
      - 'data/model_validation/projection_2026_source_freeze_manifest.json'
      - 'data/model_validation/projection_archive_research_inventory.json'
      - 'data/model_validation/projection_archive_2014_timestamp_qualification.json'
      - 'data/model_validation/native_vs_fftoday_external_scorecard.json'
      - '.github/workflows/historical-projection-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile benchmark harnesses
        run: |
          python -m py_compile script/build_historical_projection_benchmark_input.py
          python -m py_compile script/benchmark_historical_projections.py
          python -m py_compile script/benchmark_historical_projections_common_cohort.py
          python -m py_compile script/benchmark_native_vs_external_raw_stats.py
          python -m py_compile script/run_native_vs_fftoday_historical_benchmark.py
          python -m py_compile script/run_2014_multisource_raw_stat_benchmark.py
          python -m py_compile script/analyze_native_projection_residuals.py
          python -m py_compile script/normalize_ffa_historical_projection_archive.py
          python -m py_compile script/normalize_current_projection_source.py
          python -m py_compile script/audit_projection_source_sustainability.py
          python -m py_compile script/benchmark_projection_championship_ensemble.py
      - name: Run deterministic benchmark regression tests
        run: |
          python script/build_historical_projection_benchmark_input.py --self-test
          python script/benchmark_historical_projections.py --self-test
          python script/benchmark_historical_projections_common_cohort.py --self-test
          python script/benchmark_native_vs_external_raw_stats.py --self-test
          python script/audit_projection_source_sustainability.py --self-test
          python script/benchmark_projection_championship_ensemble.py --self-test
          python script/analyze_native_projection_residuals.py --self-test
          python script/normalize_ffa_historical_projection_archive.py --self-test
          python script/normalize_current_projection_source.py --self-test
          python script/run_2014_multisource_raw_stat_benchmark.py --self-test
          python script/audit_projection_source_sustainability.py
      - name: Validate source governance JSON
        run: |
          python -m json.tool data/model_validation/historical_projection_source_inventory.json > /dev/null
          python -m json.tool data/model_validation/projection_source_candidate_registry.json > /dev/null
          python -m json.tool data/model_validation/projection_championship_ensemble_spec.json > /dev/null
          python -m json.tool data/model_validation/projection_championship_expanded_source_board.json > /dev/null
          python -m json.tool data/model_validation/projection_2026_source_freeze_manifest.json > /dev/null
          python -m json.tool data/model_validation/projection_archive_research_inventory.json > /dev/null
          python -m json.tool data/model_validation/projection_archive_2014_timestamp_qualification.json > /dev/null
          python -m json.tool data/model_validation/native_vs_fftoday_external_scorecard.json > /dev/null

  real-native-vs-fftoday:
    if: github.event_name == 'workflow_dispatch'
    needs: benchmark-self-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run leakage-safe native vs FFToday benchmark
        run: |
          python script/run_native_vs_fftoday_historical_benchmark.py \
            --start-season 2016 \
            --longform-output data/model_validation/native_vs_fftoday_residual_cohort.csv \
            --output data/model_validation/native_vs_fftoday_historical_benchmark.json
          python script/analyze_native_projection_residuals.py \
            data/model_validation/native_vs_fftoday_residual_cohort.csv \
            --output data/model_validation/native_vs_fftoday_residual_diagnostic.json
      - name: Validate benchmark output
        run: |
          python -m json.tool data/model_validation/native_vs_fftoday_historical_benchmark.json > /dev/null
          python -m json.tool data/model_validation/native_vs_fftoday_residual_diagnostic.json > /dev/null
          test -s data/model_validation/native_vs_fftoday_residual_cohort.csv
      - uses: actions/upload-artifact@v4
        with:
          name: native-vs-fftoday-historical-benchmark
          path: |
            data/model_validation/native_vs_fftoday_historical_benchmark.json
            data/model_validation/native_vs_fftoday_residual_cohort.csv
            data/model_validation/native_vs_fftoday_residual_diagnostic.json
          retention-days: 14

  real-2014-expanded-championship:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'research/run-expanded-projection-championship'
    needs: benchmark-self-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 2014 timestamp-qualified four-source raw-stat comparison
        run: |
          python script/run_2014_multisource_raw_stat_benchmark.py \
            --output data/model_validation/projection_2014_multisource_raw_stat_scorecard.json
          python -m json.tool data/model_validation/projection_2014_multisource_raw_stat_scorecard.json > /dev/null
      - name: Print championship summary
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/model_validation/projection_2014_multisource_raw_stat_scorecard.json'))
          print(json.dumps(x['summary'], indent=2, sort_keys=True))
          for category, row in sorted(x['categories'].items()):
              print(category, row['winner_in_2014_cross_section'], 'n=', row['common_players'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: projection-2014-multisource-raw-stat-scorecard
          path: data/model_validation/projection_2014_multisource_raw_stat_scorecard.json
          retention-days: 14
