name: Trade Option Outcome Consistency

on:
  push:
    paths:
      - 'script/run_trade_market_sweep_v23.py'
      - 'script/run_trade_market_sweep_v27.py'
      - 'script/run_trade_market_sweep_v31.py'
      - 'script/trade_option_governance.py'
      - 'script/roster_interaction_overlay.py'
      - 'script/roster_resolution_governance.py'
      - 'script/trade_candidate_pools.py'
      - 'script/trade_behavioral_intelligence.py'
      - 'script/trade_historical_behavior.py'
      - 'script/run_trade_report.py'
      - 'script/audit_trade_option_outcome_consistency.py'
      - 'data/audit/skattebo_stevenson_option_regression.json'
      - '.github/workflows/trade-option-outcome-consistency.yml'
  pull_request:
    paths:
      - 'script/run_trade_market_sweep_v23.py'
      - 'script/run_trade_market_sweep_v27.py'
      - 'script/run_trade_market_sweep_v31.py'
      - 'script/trade_option_governance.py'
      - 'script/roster_interaction_overlay.py'
      - 'script/roster_resolution_governance.py'
      - 'script/trade_candidate_pools.py'
      - 'script/trade_behavioral_intelligence.py'
      - 'script/trade_historical_behavior.py'
      - 'script/run_trade_report.py'
      - 'script/audit_trade_option_outcome_consistency.py'
      - 'data/audit/skattebo_stevenson_option_regression.json'
      - '.github/workflows/trade-option-outcome-consistency.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install report dependencies
        run: python -m pip install 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Compile changed production modules
        run: |
          python -m py_compile \
            script/run_trade_market_sweep_v23.py \
            script/run_trade_market_sweep_v27.py \
            script/run_trade_market_sweep_v31.py \
            script/trade_option_governance.py \
            script/roster_interaction_overlay.py \
            script/roster_resolution_governance.py \
            script/trade_candidate_pools.py \
            script/trade_behavioral_intelligence.py \
            script/trade_historical_behavior.py \
            script/run_trade_report.py \
            script/audit_trade_option_outcome_consistency.py
      - name: Run option outcome consistency regression
        run: python script/audit_trade_option_outcome_consistency.py
      - name: Run final ranking governance audit
        run: python script/audit_final_trade_ranking_governance.py
      - name: Run Skattebo production regression
        run: |
          rm -rf /tmp/skattebo-regression
          python script/run_trade_report.py \
            --scenario data/audit/skattebo_stevenson_option_regression.json \
            --out-dir /tmp/skattebo-regression \
            --basename Hurts_So_Good_Skattebo_Regression \
            --quick-sims 200 \
            --disable-adaptive-confirmation \
            --search-depth 60
      - name: Validate production regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('/tmp/skattebo-regression/Hurts_So_Good_Skattebo_Regression.json'))
          s=json.load(open('/tmp/skattebo-regression/Hurts_So_Good_Skattebo_Regression-summary.json'))
          assert r['model_version']=='FSFFL-Counter-Market-Sweep-1.25'
          assert s['pipeline_model_version']=='FSFFL-Trade-Query-Pipeline-1.18'
          p=r['policy']
          g=r['governance']['option_outcome_consistency']
          assert p['unsupported_numeric_score_cutoff_used_for_better_worse'] is False
          assert p['acceptance_likelihood_is_separate_from_trade_valuation'] is True
          assert p['low_or_very_low_acceptance_changes_trade_quality_verdict'] is False
          assert p['descriptive_state_labels_create_focal_utility_cliffs'] is False
          assert p['descriptive_state_labels_create_action_cliffs'] is False
          assert p['historical_v24_executed_in_current_path'] is False
          assert p['canonical_historical_state_trade_behavior_shared_component'] is True
          assert p['historical_v26_executed_in_current_path'] is False
          assert p['canonical_trade_behavioral_intelligence_shared_component'] is True
          assert p['historical_v27_executed_in_current_path'] is False
          assert p['canonical_trade_candidate_pools_shared_component'] is True
          assert p['historical_v28_executed_in_current_path'] is False
          assert p['historical_v29_executed_in_current_path'] is False
          assert p['historical_v30_executed_in_current_path'] is False
          assert p['canonical_roster_resolution_governance_shared_component'] is True
          assert p['legacy_v30_option_comparison_not_executed_in_current_path'] is True
          assert g['categorical_score_threshold_removed'] is True
          assert g['post_sim_score_is_diagnostic_not_categorical_decision_rule'] is True
          assert g['acceptance_fit_affects_trade_valuation'] is False
          assert g['acceptance_fit_hard_gate_on_trade_quality'] is False

          better=[]
          for row in (r.get('suggested_counteroffers') or [])+(r.get('market_sweep_alternatives') or []):
              c=row.get('comparison_to_current_offer') or {}
              assert c.get('unsupported_numeric_score_cutoff_used') is False,c
              assert c.get('post_sim_score_role')=='DIAGNOSTIC_ONLY_NOT_CATEGORICAL_DECISION_RULE',c
              if c.get('decision_relation_vs_current_offer')=='DOMINATED_BY_CURRENT_OFFER':
                  assert c.get('verdict_vs_current_offer')=='WORSE',c
              if c.get('decision_relation_vs_current_offer')=='DOMINATES_CURRENT_OFFER':
                  assert c.get('verdict_vs_current_offer')=='BETTER',c
              if c.get('decision_relation_vs_current_offer')=='TRADEOFF_VS_CURRENT_OFFER':
                  assert c.get('verdict_vs_current_offer')=='MIXED',c
              fit=(row.get('counterparty_feasibility') or {})
              assert fit.get('affects_trade_valuation') is False,fit
              if c.get('verdict_vs_current_offer')=='BETTER':better.append(row)

          expected_action='SHOP_BEFORE_ACCEPTING' if any(x in (r.get('market_sweep_alternatives') or []) for x in better) else ('COUNTER_CURRENT_OFFEROR' if better else 'ACCEPT_NOW')
          assert r['recommended_next_action']==expected_action,(r['recommended_next_action'],expected_action)
          print({
            'recommended_next_action':r.get('recommended_next_action'),
            'action_basis':g.get('action_basis'),
            'objective_state':((r.get('current_offer_evaluation') or {}).get('simulation') or {}).get('strategic',{}).get('objective_state'),
            'market_alternatives':[(x.get('return_asset_names'),x.get('acceptance_likelihood'),(x.get('comparison_to_current_offer') or {}).get('verdict_vs_current_offer'),(x.get('comparison_to_current_offer') or {}).get('decision_relation_vs_current_offer')) for x in (r.get('market_sweep_alternatives') or [])[:5]],
          })
          assert Path('/tmp/skattebo-regression/Hurts_So_Good_Skattebo_Regression.pdf').exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: skattebo-option-regression
          path: /tmp/skattebo-regression/*
          if-no-files-found: error
          retention-days: 7
