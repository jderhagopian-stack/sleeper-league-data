name: Refresh Behavioral Intelligence 3.0 Cache

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: behavioral-intelligence-v3-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh compact production BI3 cache
        run: python script/refresh_behavioral_intelligence_v3.py
      - name: Validate production cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/behavioral/behavioral_intelligence_v3.json').read_text())
          m=json.loads(Path('data/behavioral/manifest.json').read_text())
          assert p['model_version']=='FSFFL-Behavioral-Intelligence-3.0'
          assert p['production_status']=='PRODUCTION'
          assert p['cache_policy']['interactive_history_rebuild'] is False
          assert p['owner_count']>=12
          assert all(abs(float(v))<=.20 for v in p['league_bias_audit'].values())
          assert m['profile_model_version']=='FSFFL-Behavioral-Intelligence-3.0'
          assert m['production_status']=='PRODUCTION'
          PY
      - name: Commit refreshed BI3 cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/behavioral/
          if git diff --cached --quiet; then
            echo "No BI3 cache changes to commit."
          else
            git commit -m "Refresh Behavioral Intelligence 3.0 production cache"
            git push origin HEAD:main
          fi
