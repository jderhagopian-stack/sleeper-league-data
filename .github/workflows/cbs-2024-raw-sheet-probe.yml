name: CBS 2024 Raw Sheet Probe

on:
  pull_request:
    paths:
      - '.github/workflows/cbs-2024-raw-sheet-probe.yml'
      - 'script/run_2024_cbs_vs_fftoday_qb_raw_stat_benchmark.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch published CBS 2024 preseason projection tabs
        run: |
          set -euo pipefail
          base='https://docs.google.com/spreadsheets/d/e/2PACX-1vRSLbPOpHYIzmkYX2H2QPlQVb2kvJVvZ0GRF5EPkQ_EuqCNZ-YG8I3CGC6eINcxqkfwufN-pZUaRb3t/pub'
          curl --fail --location --retry 3 --retry-delay 2 "$base?gid=0&single=true&output=csv" -o /tmp/cbs_2024_qb.csv
          curl --fail --location --retry 3 --retry-delay 2 "$base?gid=1994037829&single=true&output=csv" -o /tmp/cbs_2024_rb.csv
          curl --fail --location --retry 3 --retry-delay 2 "$base?gid=1433973441&single=true&output=csv" -o /tmp/cbs_2024_wr.csv
          curl --fail --location --retry 3 --retry-delay 2 "$base?gid=467492484&single=true&output=csv" -o /tmp/cbs_2024_te.csv
          test -s /tmp/cbs_2024_qb.csv
          test -s /tmp/cbs_2024_rb.csv
          test -s /tmp/cbs_2024_wr.csv
          test -s /tmp/cbs_2024_te.csv
      - name: Validate and print tab schemas
        run: |
          python - <<'PY'
          import csv, json, pathlib
          meta={
            'QB':('2024-08-29T23:39:00-04:00','/tmp/cbs_2024_qb.csv'),
            'RB':('2024-08-30T10:04:00-04:00','/tmp/cbs_2024_rb.csv'),
            'WR':('2024-08-30T13:14:00-04:00','/tmp/cbs_2024_wr.csv'),
            'TE':('2024-08-30T15:51:00-04:00','/tmp/cbs_2024_te.csv'),
          }
          out={}
          for pos,(published,path) in meta.items():
              rows=list(csv.reader(pathlib.Path(path).open(newline='',encoding='utf-8-sig')))
              if len(rows)<10:
                  raise SystemExit(f'{pos}: too few rows {len(rows)}')
              out[pos]={'published_at':published,'n_rows':len(rows)-1,'header':rows[0],'sample_rows':rows[1:3]}
          pathlib.Path('/tmp/cbs_2024_all_position_probe.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Run recent CBS vs FFToday all-position raw-stat championship
        run: python script/run_2024_cbs_vs_fftoday_qb_raw_stat_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: cbs-2024-preseason-projection-probe
          path: |
            /tmp/cbs_2024_qb.csv
            /tmp/cbs_2024_rb.csv
            /tmp/cbs_2024_wr.csv
            /tmp/cbs_2024_te.csv
            /tmp/cbs_2024_all_position_probe.json
            /tmp/cbs_fftoday_2024_all_position_scorecard.json
          retention-days: 14
