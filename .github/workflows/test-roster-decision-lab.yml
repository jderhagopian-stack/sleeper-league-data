name: Test Roster Decision Lab

on:
  workflow_call:
permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install simulator dependency
        run: python -m pip install numpy

      - name: Compile Decision Lab
        run: python -m py_compile script/run_roster_decision_lab.py

      - name: Run fast example scenario
        run: time python script/run_roster_decision_lab.py --scenario data/decision_lab/example_scenario.json --sims 250 --output /tmp/decision-lab-example.json

      - name: Assert canonical simulator baseline parity
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('dl','script/run_roster_decision_lab.py')
          dl=importlib.util.module_from_spec(spec);spec.loader.exec_module(dl)
          simmod,league,rosters,users,players,season,projections,schedule=dl.load_model_inputs()
          cached=dl.load_cached_lineups(season)
          reg=simmod.core.regular_season_weeks(league)
          ps=int((league.get('settings') or {}).get('playoff_week_start') or 15)
          weeks=sorted(set(reg+[ps,ps+1,ps+2]))
          fresh={}
          by_uid,by_rid=dl.roster_maps(rosters)
          for rid,roster in by_rid.items():
              fresh[rid]={w:simmod.optimize_fsffl_fast(roster,w,league,players,projections) for w in weeks}
          seed=simmod.deterministic_seed(league,season)
          a=dl.simulate_from_lineups(simmod,league,rosters,users,schedule,cached,1000,seed)
          b=dl.simulate_from_lineups(simmod,league,rosters,users,schedule,fresh,1000,seed)
          ai=dl.team_index(a);bi=dl.team_index(b)
          keys=('expected_wins','expected_points_for','playoff_probability','bye_probability','championship_probability')
          for uid in ai:
              for k in keys:
                  assert ai[uid][k]==bi[uid][k], (uid,k,ai[uid][k],bi[uid][k])
          print('Decision Lab cached-lineup baseline exactly matches fresh canonical Simulator baseline')
          PY

      - name: Validate output invariants
        run: |
          python - <<'PY'
          import json
          p = '/tmp/decision-lab-example.json'
          d = json.load(open(p))
          assert d['ephemeral_state'] is True
          assert d['canonical_state_mutated'] is False
          assert d['focus_user_id'] in d['team_comparisons']
          assert d['simulation']['common_random_numbers'] is True
          assert d['simulation']['execution_path'] == 'cached_lineups_plus_touched_team_reoptimization'
          assert len(d['simulation']['teams_reoptimized']) <= 2
          assert 'championship_probability' in d['team_comparisons'][d['focus_user_id']]['delta']
          assert d['recommendation']['band']
          print('Roster Decision Lab fast-path smoke test passed')
          PY
