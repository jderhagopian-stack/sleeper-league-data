name: Test Roster Decision Lab

on:
  pull_request:
    paths:
      - 'script/run_roster_decision_lab.py'
      - 'data/roster_decision_lab_architecture.json'
      - 'data/decision_lab/**'
      - '.github/workflows/test-roster-decision-lab.yml'
  push:
    branches: [main]
    paths:
      - 'script/run_roster_decision_lab.py'
      - 'data/roster_decision_lab_architecture.json'
      - 'data/decision_lab/**'
      - '.github/workflows/test-roster-decision-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Decision Lab
        run: python -m py_compile script/run_roster_decision_lab.py

      - name: Run fast example scenario
        run: time python script/run_roster_decision_lab.py --scenario data/decision_lab/example_scenario.json --sims 250 --output /tmp/decision-lab-example.json

      - name: Validate output invariants
        run: |
          python - <<'PY'
          import json
          p = '/tmp/decision-lab-example.json'
          d = json.load(open(p))
          assert d['ephemeral_state'] is True
          assert d['canonical_state_mutated'] is False
          assert d['focus_user_id'] in d['team_comparisons']
          assert d['simulation']['common_random_numbers'] is True
          assert d['simulation']['execution_path'] == 'cached_lineups_plus_touched_team_reoptimization'
          assert len(d['simulation']['teams_reoptimized']) <= 2
          assert 'championship_probability' in d['team_comparisons'][d['focus_user_id']]['delta']
          assert d['recommendation']['band']
          print('Roster Decision Lab fast-path smoke test passed')
          PY
