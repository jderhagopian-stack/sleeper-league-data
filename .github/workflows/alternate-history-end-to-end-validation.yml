name: Alternate History End-to-End Validation

on:
  pull_request:
    paths:
      - 'script/alternate_history_dynamic_policy.py'
      - 'script/alternate_history_roster_compliance.py'
      - 'script/alternate_history_performance_runtime.py'
      - 'script/alternate_history_season_cycle.py'
      - 'script/run_fsffl_generic_alternate_history.py'
      - 'script/run_fsffl_second_season_particles.py'
      - 'script/run_fsffl_third_season_particles.py'
      - 'script/run_fsffl_next_draft_handoff.py'
      - 'script/run_fsffl_present_day_particles.py'
      - 'script/run_fsffl_weighted_alternate_outlook.py'
      - 'script/run_fsffl_alternate_history_final_report.py'
      - 'script/run_gm30_alternate_history_review.py'
      - 'script/validate_fsffl_end_to_end_protocol.py'
      - 'script/validate_alternate_history_performance_equivalence.py'
      - 'script/run_fsffl_gm30_counterfactual.py'
      - 'script/run_fsffl_season_simulator_preproduction.py'
      - 'data/alternate_history/**'
      - '.github/workflows/alternate-history-end-to-end-validation.yml'
  workflow_dispatch:

concurrency:
  group: alternate-history-end-to-end-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Simulator runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile end-to-end modules
        run: |
          python -m py_compile script/run_fsffl_present_day_particles.py
          python -m py_compile script/run_fsffl_weighted_alternate_outlook.py
          python -m py_compile script/run_fsffl_alternate_history_final_report.py
          python -m py_compile script/validate_fsffl_end_to_end_protocol.py
          python -m py_compile script/validate_alternate_history_performance_equivalence.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Validate exact performance primitive equivalence
        run: python script/validate_alternate_history_performance_equivalence.py
      - name: Validate complete 2023-to-present weighted protocol in one pass
        run: python script/validate_fsffl_end_to_end_protocol.py

  benchmark-representative-runtime:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Simulator runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Run unprofiled representative production review
        run: |
          mkdir -p data/alternate_history/results/puka_vs_van_2023
          /usr/bin/time -v python script/run_gm30_alternate_history_review.py \
            data/alternate_history/scenarios/puka_vs_van_2023.json \
            --particles 20 --sims 100 --seed 20260824 \
            2> /tmp/alternate_history_20x100.time
      - name: Print representative resource usage
        run: |
          echo 'ALTERNATE_HISTORY_20x100_UNPROFILED_RESOURCE_USAGE'
          cat /tmp/alternate_history_20x100.time

  certify-production-scale:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Simulator runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile production review path
        run: |
          python -m py_compile script/run_gm30_alternate_history_review.py
          python -m py_compile script/run_fsffl_alternate_history_final_report.py
          python -m py_compile script/run_fsffl_generic_alternate_history.py
          python -m py_compile script/alternate_history_roster_compliance.py
          python -m py_compile script/validate_alternate_history_performance_equivalence.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Validate exact performance primitive equivalence
        run: python script/validate_alternate_history_performance_equivalence.py
      - name: Run 100-particle / 500-draw production certification
        run: |
          mkdir -p data/alternate_history/results/puka_vs_van_2023
          /usr/bin/time -v python script/run_gm30_alternate_history_review.py \
            data/alternate_history/scenarios/puka_vs_van_2023.json \
            --particles 100 --sims 500 --seed 20260824 \
            2> data/alternate_history/results/puka_vs_van_2023/production_time_100x500.txt
      - name: Print production certification summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/alternate_history/results/puka_vs_van_2023/final_report_1_0.json')
          report = json.loads(p.read_text())
          print('ALTERNATE_HISTORY_PRODUCTION_100x500')
          print(json.dumps({
              'configuration': report.get('configuration'),
              'summary': report.get('summary'),
              'season_by_season': report.get('season_by_season'),
              'present_day_roster': {
                  'expected_roster_size': (report.get('present_day_roster') or {}).get('expected_roster_size'),
                  'present_day_roster_divergence_score': (report.get('present_day_roster') or {}).get('present_day_roster_divergence_score'),
                  'notable_gains': (report.get('present_day_roster') or {}).get('notable_gains'),
                  'notable_losses': (report.get('present_day_roster') or {}).get('notable_losses'),
              },
              'present_day_simulator_outlook': report.get('present_day_simulator_outlook'),
          }, indent=2, sort_keys=True))
          print('RESOURCE_USAGE')
          print(Path('data/alternate_history/results/puka_vs_van_2023/production_time_100x500.txt').read_text())
          PY
      - name: Upload production certification report
        uses: actions/upload-artifact@v4
        with:
          name: alternate-history-production-100x500
          path: |
            data/alternate_history/results/puka_vs_van_2023/final_report_1_0.json
            data/alternate_history/results/puka_vs_van_2023/final_report_1_0.md
            data/alternate_history/results/puka_vs_van_2023/production_time_100x500.txt
