name: Alternate History End-to-End Validation

on:
  pull_request:
    paths:
      - 'script/alternate_history_dynamic_policy.py'
      - 'script/run_fsffl_second_season_particles.py'
      - 'script/run_fsffl_third_season_particles.py'
      - 'script/run_fsffl_next_draft_handoff.py'
      - 'script/run_fsffl_present_day_particles.py'
      - 'script/run_fsffl_weighted_alternate_outlook.py'
      - 'script/run_fsffl_alternate_history_final_report.py'
      - 'script/validate_fsffl_end_to_end_protocol.py'
      - 'script/run_fsffl_gm30_counterfactual.py'
      - 'script/run_fsffl_season_simulator_preproduction.py'
      - 'data/alternate_history/**'
      - '.github/workflows/alternate-history-end-to-end-validation.yml'
  workflow_dispatch:

concurrency:
  group: alternate-history-end-to-end-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Simulator runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile end-to-end modules
        run: |
          python -m py_compile script/run_fsffl_present_day_particles.py
          python -m py_compile script/run_fsffl_weighted_alternate_outlook.py
          python -m py_compile script/run_fsffl_alternate_history_final_report.py
          python -m py_compile script/validate_fsffl_end_to_end_protocol.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Validate complete 2023-to-present weighted protocol in one pass
        run: python script/validate_fsffl_end_to_end_protocol.py
      - name: Run Puka production scenario and final report
        run: |
          python script/run_fsffl_alternate_history_final_report.py \
            data/alternate_history/scenarios/puka_vs_van_2023.json \
            --particles 100 \
            --sims 500 \
            --seed 20260824
      - name: Print final human-readable report
        run: cat data/alternate_history/results/puka_vs_van_2023/final_report_1_0.md
      - name: Persist final report for ChatGPT retrieval
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p .run_outputs/alternate_history/puka_vs_van_2023
          cp data/alternate_history/results/puka_vs_van_2023/final_report_1_0.md .run_outputs/alternate_history/puka_vs_van_2023/final_report_1_0.md
          cp data/alternate_history/results/puka_vs_van_2023/final_report_1_0.json .run_outputs/alternate_history/puka_vs_van_2023/final_report_1_0.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .run_outputs/alternate_history/puka_vs_van_2023/final_report_1_0.md .run_outputs/alternate_history/puka_vs_van_2023/final_report_1_0.json
          if git diff --cached --quiet; then
            echo "Report unchanged; nothing to persist."
          else
            git commit -m "Store Puka Alternate History final report [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Upload final report package
        uses: actions/upload-artifact@v4
        with:
          name: puka-alternate-history-final-report
          path: |
            data/alternate_history/results/puka_vs_van_2023/final_report_1_0.md
            data/alternate_history/results/puka_vs_van_2023/final_report_1_0.json
          if-no-files-found: error
