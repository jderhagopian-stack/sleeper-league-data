name: Alternate History End-to-End Validation

on:
  pull_request:
    paths:
      - 'script/alternate_history_dynamic_policy.py'
      - 'script/run_fsffl_second_season_particles.py'
      - 'script/run_fsffl_third_season_particles.py'
      - 'script/run_fsffl_next_draft_handoff.py'
      - 'script/run_fsffl_present_day_particles.py'
      - 'script/run_fsffl_weighted_alternate_outlook.py'
      - 'script/validate_fsffl_end_to_end_protocol.py'
      - 'script/run_fsffl_gm30_counterfactual.py'
      - 'script/run_fsffl_season_simulator_preproduction.py'
      - 'data/alternate_history/**'
      - '.github/workflows/alternate-history-end-to-end-validation.yml'
  workflow_dispatch:

concurrency:
  group: alternate-history-end-to-end-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Simulator runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile end-to-end modules
        run: |
          python -m py_compile script/run_fsffl_present_day_particles.py
          python -m py_compile script/run_fsffl_weighted_alternate_outlook.py
          python -m py_compile script/validate_fsffl_end_to_end_protocol.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Validate complete 2023-to-present weighted protocol in one pass
        run: python script/validate_fsffl_end_to_end_protocol.py
