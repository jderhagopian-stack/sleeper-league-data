name: Trade Current-Evidence Case 04 Candidate Only

on:
  push:
    branches:
      - fix/trade-current-evidence-ensemble
    paths:
      - '.github/workflows/trade-current-evidence-case04-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Run case 04 candidate
        run: |
          cat > /tmp/case04.json <<'JSON'
          {
            "scenario_id":"case04_young_to_aging_win_now",
            "description":"Context-specific reciprocal age test: King B sends Colston Loveland for Christian McCaffrey.",
            "focus_user_id":"858530218330144768",
            "actions":[
              {"type":"trade","from_user_id":"858530218330144768","to_user_id":"845157822193872896","players":["12517"],"picks":[]},
              {"type":"trade","from_user_id":"845157822193872896","to_user_id":"858530218330144768","players":["4034"],"picks":[]}
            ]
          }
          JSON
          mkdir -p /tmp/c04
          python script/run_trade_report.py --scenario /tmp/case04.json --out-dir /tmp/c04 --basename result --quick-sims 200 --adaptive-confirm-sims 10000 --search-depth 1 > /tmp/c04/log.txt
          python - <<'PY'
          import json
          r=json.load(open('/tmp/c04/result.json'))
          c=r['current_offer_evaluation']; a=c['decision_attribution']; d=a['diagnostics']
          out={
            'candidate_action':r.get('recommended_next_action'),
            'candidate_score':c.get('shared_decision_utility_score'),
            'candidate_model':a.get('shared_decision_utility_model_version'),
            'current_evidence':d.get('current_value_evidence'),
            'current_primitive':next((x.get('primitive_value') for x in a.get('channels',[]) if x.get('channel')=='current'),None),
            'future_primitive':next((x.get('primitive_value') for x in a.get('channels',[]) if x.get('channel')=='future'),None),
            'confirmation':r.get('adaptive_confirmation'),
          }
          open('/tmp/c04/comparison.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          assert out['candidate_model']=='FSFFL-Shared-Decision-Utility-2.1'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case04-candidate-only
          path: /tmp/c04/comparison.json
          if-no-files-found: warn
          retention-days: 30
