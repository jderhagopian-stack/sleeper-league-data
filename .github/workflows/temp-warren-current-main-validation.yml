name: TEMP Warren Current Main Validation

on:
  pull_request:
    branches: [main]

jobs:
  warren-current-main:
    if: github.head_ref == 'fix/package-challenger-frozen-regression'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Run current production Warren report
        run: |
          rm -rf /tmp/warren-current-main
          python script/run_trade_report.py             --scenario data/model_validation/warren_current_main_regression.json             --out-dir /tmp/warren-current-main             --basename Warren_Current_Main             --quick-sims 200             --disable-adaptive-confirmation             --search-depth 60
      - name: Summarize current evidence, authority, forced cuts, and package sensitivity
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          report=json.load(open('/tmp/warren-current-main/Warren_Current_Main.json'))
          assets=json.load(open('data/fsffl_asset_values.json'))
          catalog={}
          for p in assets.get('players') or []:
              catalog[f"player:{p.get('player_id')}"]={
                  'name':p.get('name') or f"player:{p.get('player_id')}",
                  'market_dynasty':float(p.get('market_dynasty') or p.get('fsffl_value') or 0),
              }
          for p in assets.get('picks') or []:
              aid=str(p.get('asset_id') or '')
              if aid:
                  catalog[aid]={'name':p.get('name') or aid,'market_dynasty':float(p.get('market_dynasty') or p.get('fsffl_value') or 0)}

          curves={
              'additive_baseline':[1,1,1,1,1],
              'mild':[1,.92,.84,.78,.72],
              'midpoint':[1,.85,.73,.64,.57],
              'strong':[1,.78,.62,.50,.42],
          }
          def tail(curve,idx,name):
              if idx < len(curve): return curve[idx]
              if name=='mild': return .72
              if name=='strong': return max(.28,.42-.06*(idx-len(curve)+1))
              if name=='midpoint': return (tail(curves['mild'],idx,'mild')+tail(curves['strong'],idx,'strong'))/2
              return 1.0
          def effective(ids,curve,name):
              vals=sorted([catalog[x]['market_dynasty'] for x in ids if x in catalog],reverse=True)
              return round(sum(v*tail(curve,i,name) for i,v in enumerate(vals)),2)
          def channels(row):
              attr=row.get('decision_attribution') or {}
              out={x.get('channel'):x for x in attr.get('channels') or []}
              return out, attr.get('diagnostics') or {}
          def candidate_assets(row):
              sent=list(row.get('outgoing_assets') or [])
              recv=list(row.get('return_assets') or [])
              return [str(x) for x in sent],[str(x) for x in recv]
          def sensitivity(row):
              ch,diag=channels(row)
              current=float((ch.get('current') or {}).get('primitive_value') or 0)
              future=float((ch.get('future') or {}).get('primitive_value') or 0)
              wc=float((ch.get('current') or {}).get('objective_weight') or 0)
              wf=float((ch.get('future') or {}).get('objective_weight') or 0)
              wl=float((ch.get('liquidity') or {}).get('objective_weight') or 0)
              wr=float((ch.get('resilience') or {}).get('objective_weight') or 0)
              # Liquidity/resilience are currently unauthorized; preserve any authorized
              # non-package contribution exactly as emitted rather than inventing authority.
              base_score=float(row.get('shared_decision_utility_score') or row.get('post_sim_score') or 0)
              sent,recv=candidate_assets(row)
              raw=round(effective(recv,curves['additive_baseline'],'additive_baseline')-effective(sent,curves['additive_baseline'],'additive_baseline'),2)
              nontrade=round(future-raw,2)
              rows={}
              for name,curve in curves.items():
                  eff=round(effective(recv,curve,name)-effective(sent,curve,name),2)
                  challenger_future=round(eff+nontrade,2)
                  # Replace only the future primitive. Other channel contributions remain unchanged.
                  challenger=round(base_score + wf*(challenger_future-future),2)
                  rows[name]={
                      'effective_trade_delta':eff,
                      'challenger_future_primitive':challenger_future,
                      'challenger_score':challenger,
                  }
              vals=[rows[x]['challenger_score'] for x in ('mild','midpoint','strong')]
              robust='ROBUST POSITIVE across the prior range' if all(x>0 for x in vals) else 'ROBUST NEGATIVE across the prior range' if all(x<0 for x in vals) else 'SENSITIVE TO PRIOR RANGE'
              return {
                  'shared_decision_utility_score':round(base_score,2),
                  'current_primitive':round(current,2),
                  'future_primitive':round(future,2),
                  'future_objective_weight':round(wf,6),
                  'raw_trade_package_delta':raw,
                  'non_trade_future_value_preserved':nontrade,
                  'current_value_evidence':diag.get('current_value_evidence') or {},
                  'current_value_evidence_count':diag.get('current_value_evidence_count'),
                  'curves':rows,
                  'classification':robust,
              }

          current=report.get('current_offer_evaluation') or {}
          alternatives=(report.get('market_sweep_alternatives') or [])
          counters=(report.get('suggested_counteroffers') or [])
          rows=[('CURRENT_OFFER',current)]
          for i,x in enumerate(counters,1): rows.append((f'COUNTER_{i}',x))
          for i,x in enumerate(alternatives,1): rows.append((f'MARKET_{i}',x))
          summary={
              'model_version':report.get('model_version'),
              'recommended_next_action':report.get('recommended_next_action'),
              'current_offer':{
                  'return_asset_names':current.get('return_asset_names'),
                  'outgoing_asset_names':current.get('outgoing_asset_names'),
                  'automatic_roster_cut_actions':(current.get('simulation') or {}).get('automatic_roster_cut_actions') or current.get('automatic_roster_cut_actions') or [],
                  'sensitivity':sensitivity(current),
              },
              'suggested_counteroffers':[],
              'market_sweep_alternatives':[],
          }
          for label,row in rows[1:]:
              item={
                  'label':label,
                  'return_asset_names':row.get('return_asset_names'),
                  'outgoing_asset_names':row.get('outgoing_asset_names'),
                  'generated_option_action_eligible':row.get('generated_option_action_eligible'),
                  'report_role':row.get('report_role'),
                  'market_test_status':row.get('market_test_status'),
                  'actionable_better_than_current_offer':row.get('actionable_better_than_current_offer'),
                  'better_than_current_offer_but_market_test_only':row.get('better_than_current_offer_but_market_test_only'),
                  'comparison_to_current_offer':row.get('comparison_to_current_offer'),
                  'sensitivity':sensitivity(row),
              }
              if label.startswith('COUNTER_'): summary['suggested_counteroffers'].append(item)
              else: summary['market_sweep_alternatives'].append(item)

          # Hard guards requested for this validation.
          ev=summary['current_offer']['sensitivity']['current_value_evidence']
          assert set(ev) >= {'simulator_outcome_value','transaction_market_redraft_delta','optimized_starter_redraft_delta'}, ev
          assert summary['current_offer']['sensitivity']['current_value_evidence_count'] >= 3
          assert report.get('policy',{}).get('search_visibility_separate_from_action_authority') is True
          for item in summary['market_sweep_alternatives'] + summary['suggested_counteroffers']:
              if item['generated_option_action_eligible'] is False:
                  assert item['actionable_better_than_current_offer'] is False
          Path('/tmp/warren-current-main/warren-current-main-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: warren-current-main-validation
          path: /tmp/warren-current-main/*
          if-no-files-found: error
          retention-days: 3
