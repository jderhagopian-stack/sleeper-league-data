name: Alternate History V2 Runtime Profile

on:
  workflow_dispatch:
  push:
    branches:
      - feature/alternate-history-v2
    paths:
      - .github/workflows/alternate-history-v2-profile.yml
      - script/profile_fsffl_alternate_history_v2.py
      - script/run_fsffl_generic_alternate_history.py
      - script/run_fsffl_next_draft_handoff.py
      - script/alternate_history_rookie_draft_policy.py
      - script/run_fsffl_alternate_history_magazine.py
      - script/run_fsffl_alternate_history_magazine_v6.py

jobs:
  runtime-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy reportlab pypdf
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Profile 20x20 publication
        run: |
          python script/profile_fsffl_alternate_history_v2.py \
            data/alternate_history/scenarios/puka_vs_van_2023.json \
            --particles 20 --sims 20 --seed 20260824 | tee /tmp/ah-profile.log
          grep 'AH_PROFILE' /tmp/ah-profile.log
      - name: Upload profile publication
        uses: actions/upload-artifact@v4
        with:
          name: alternate-history-v2-runtime-profile
          path: |
            data/alternate_history/results/puka_vs_van_2023/alternate_history_magazine_1_0.json
            data/alternate_history/results/puka_vs_van_2023/alternate_history_magazine_1_0.pdf
