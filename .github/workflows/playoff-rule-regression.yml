name: Playoff Rule Regression

on:
  pull_request:
    paths:
      - 'script/build_fsffl_season_simulator.py'
      - 'script/run_roster_decision_lab.py'
      - 'script/audit_playoff_rules.py'
      - '.github/workflows/playoff-rule-regression.yml'
  workflow_dispatch:

jobs:
  playoff-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile script/build_fsffl_season_simulator.py script/run_roster_decision_lab.py script/audit_playoff_rules.py
      - name: Verify rule-defined playoff behavior
        run: python script/audit_playoff_rules.py
