name: Playoff Rule Regression

on:
  workflow_call:
jobs:
  playoff-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile script/league_rules.py script/build_fsffl_season_simulator.py script/run_roster_decision_lab.py script/audit_playoff_rules.py
      - name: Verify rule-defined playoff behavior
        run: python script/audit_playoff_rules.py
