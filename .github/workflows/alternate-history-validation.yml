name: Alternate History Validation

on:
  pull_request:
    paths:
      - 'script/alternate_history_engine.py'
      - 'script/run_fsffl_alternate_history.py'
      - 'script/run_fsffl_counterfactual_replay.py'
      - 'script/run_fsffl_postseason_consequences.py'
      - 'script/run_fsffl_postseason_consequences_v2.py'
      - 'script/run_fsffl_downstream_dependencies.py'
      - 'script/run_fsffl_downstream_dependencies_v2.py'
      - 'script/run_fsffl_downstream_dependencies_v3.py'
      - 'script/diagnose_alternate_history_event.py'
      - 'script/validate_alternate_history.py'
      - 'script/validate_alternate_history_replay.py'
      - 'script/validate_puka_counterfactual_replay.py'
      - 'data/alternate_history/**'
      - '.github/workflows/alternate-history-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile new Python modules
        run: |
          python -m py_compile script/alternate_history_engine.py
          python -m py_compile script/run_fsffl_alternate_history.py
          python -m py_compile script/run_fsffl_counterfactual_replay.py
          python -m py_compile script/run_fsffl_postseason_consequences.py
          python -m py_compile script/run_fsffl_postseason_consequences_v2.py
          python -m py_compile script/run_fsffl_downstream_dependencies.py
          python -m py_compile script/run_fsffl_downstream_dependencies_v2.py
          python -m py_compile script/run_fsffl_downstream_dependencies_v3.py
          python -m py_compile script/diagnose_alternate_history_event.py
          python -m py_compile script/validate_alternate_history.py
          python -m py_compile script/validate_alternate_history_replay.py
          python -m py_compile script/validate_puka_counterfactual_replay.py
      - name: Run isolated regression validation
        run: python script/validate_alternate_history.py
      - name: Run no-fork historical replay validation
        run: python script/validate_alternate_history_replay.py
      - name: Validate Puka direct counterfactual fixture
        run: python script/validate_puka_counterfactual_replay.py
      - name: Run 0.4 postseason and draft-order consequences
        run: python script/run_fsffl_postseason_consequences_v2.py data/alternate_history/scenarios/puka_vs_van_2023.json
      - name: Diagnose historical ownership gap
        run: python script/diagnose_alternate_history_event.py data/alternate_history/scenarios/puka_vs_van_2023.json
      - name: Run 0.5a gap-aware downstream dependency replay
        run: python script/run_fsffl_downstream_dependencies_v3.py data/alternate_history/scenarios/puka_vs_van_2023.json
