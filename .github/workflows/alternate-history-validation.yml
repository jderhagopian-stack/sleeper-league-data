name: Alternate History Validation

on:
  pull_request:
    paths:
      - 'script/alternate_history_engine.py'
      - 'script/alternate_history_branching.py'
      - 'script/alternate_history_maxpf.py'
      - 'script/backfill_alternate_history_sleeper.py'
      - 'script/run_fsffl_alternate_history.py'
      - 'script/run_fsffl_counterfactual_replay.py'
      - 'script/run_fsffl_postseason_consequences.py'
      - 'script/run_fsffl_postseason_consequences_v2.py'
      - 'script/run_fsffl_postseason_consequences_v3.py'
      - 'script/infer_fsffl_historical_draft_order.py'
      - 'script/run_fsffl_alternate_draft_candidates.py'
      - 'script/run_fsffl_alternate_draft_policy.py'
      - 'script/report_fsffl_alternate_draft_policy.py'
      - 'script/run_fsffl_downstream_dependencies.py'
      - 'script/run_fsffl_downstream_dependencies_v2.py'
      - 'script/run_fsffl_downstream_dependencies_v3.py'
      - 'script/run_fsffl_downstream_dependencies_v4.py'
      - 'script/run_fsffl_historical_policy_triage.py'
      - 'script/run_fsffl_historical_usage_policy.py'
      - 'script/run_fsffl_historical_usage_policy_v2.py'
      - 'script/run_fsffl_historical_usage_policy_v3.py'
      - 'script/run_fsffl_historical_trade_policy.py'
      - 'script/run_fsffl_historical_trade_policy_v2.py'
      - 'script/run_fsffl_historical_trade_policy_v3.py'
      - 'script/run_fsffl_multiseason_branch_replay.py'
      - 'script/run_fsffl_multiseason_branch_replay_v2.py'
      - 'script/run_fsffl_multiseason_branch_replay_v3.py'
      - 'script/run_fsffl_multiseason_particle_replay.py'
      - 'script/run_fsffl_multiseason_particle_replay_v2.py'
      - 'script/run_fsffl_multiseason_particle_replay_v3.py'
      - 'script/run_fsffl_reference_present_day.py'
      - 'script/run_fsffl_alternate_current_outlook.py'
      - 'script/diagnose_alternate_history_event.py'
      - 'script/validate_alternate_history.py'
      - 'script/validate_alternate_history_replay.py'
      - 'script/validate_puka_counterfactual_replay.py'
      - 'script/validate_alternate_history_branching.py'
      - 'script/validate_fsffl_multiseason_branch_replay.py'
      - 'script/validate_fsffl_multiseason_particle_replay.py'
      - 'script/validate_fsffl_fork_season_feedback.py'
      - 'data/alternate_history/**'
      - '.github/workflows/alternate-history-validation.yml'
  workflow_dispatch:

concurrency:
  group: alternate-history-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Install Simulator 1.0 runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile new Python modules
        run: |
          python -m py_compile script/alternate_history_engine.py
          python -m py_compile script/alternate_history_branching.py
          python -m py_compile script/alternate_history_maxpf.py
          python -m py_compile script/backfill_alternate_history_sleeper.py
          python -m py_compile script/run_fsffl_alternate_history.py
          python -m py_compile script/run_fsffl_counterfactual_replay.py
          python -m py_compile script/run_fsffl_postseason_consequences.py
          python -m py_compile script/run_fsffl_postseason_consequences_v2.py
          python -m py_compile script/run_fsffl_postseason_consequences_v3.py
          python -m py_compile script/infer_fsffl_historical_draft_order.py
          python -m py_compile script/run_fsffl_alternate_draft_candidates.py
          python -m py_compile script/run_fsffl_alternate_draft_policy.py
          python -m py_compile script/report_fsffl_alternate_draft_policy.py
          python -m py_compile script/run_fsffl_downstream_dependencies.py
          python -m py_compile script/run_fsffl_downstream_dependencies_v2.py
          python -m py_compile script/run_fsffl_downstream_dependencies_v3.py
          python -m py_compile script/run_fsffl_downstream_dependencies_v4.py
          python -m py_compile script/run_fsffl_historical_policy_triage.py
          python -m py_compile script/run_fsffl_historical_usage_policy.py
          python -m py_compile script/run_fsffl_historical_usage_policy_v2.py
          python -m py_compile script/run_fsffl_historical_usage_policy_v3.py
          python -m py_compile script/run_fsffl_historical_trade_policy.py
          python -m py_compile script/run_fsffl_historical_trade_policy_v2.py
          python -m py_compile script/run_fsffl_historical_trade_policy_v3.py
          python -m py_compile script/run_fsffl_multiseason_branch_replay.py
          python -m py_compile script/run_fsffl_multiseason_branch_replay_v2.py
          python -m py_compile script/run_fsffl_multiseason_branch_replay_v3.py
          python -m py_compile script/run_fsffl_multiseason_particle_replay.py
          python -m py_compile script/run_fsffl_multiseason_particle_replay_v2.py
          python -m py_compile script/run_fsffl_multiseason_particle_replay_v3.py
          python -m py_compile script/run_fsffl_reference_present_day.py
          python -m py_compile script/run_fsffl_alternate_current_outlook.py
          python -m py_compile script/diagnose_alternate_history_event.py
          python -m py_compile script/validate_alternate_history.py
          python -m py_compile script/validate_alternate_history_replay.py
          python -m py_compile script/validate_puka_counterfactual_replay.py
          python -m py_compile script/validate_alternate_history_branching.py
          python -m py_compile script/validate_fsffl_multiseason_branch_replay.py
          python -m py_compile script/validate_fsffl_multiseason_particle_replay.py
          python -m py_compile script/validate_fsffl_fork_season_feedback.py
      - name: Validate 0.7 branch manager invariants
        run: python script/validate_alternate_history_branching.py
      - name: Backfill authoritative raw Sleeper history (isolated cache)
        run: python script/backfill_alternate_history_sleeper.py
      - name: Run isolated regression validation
        run: python script/validate_alternate_history.py
      - name: Run no-fork historical replay validation
        run: python script/validate_alternate_history_replay.py
      - name: Validate Puka direct counterfactual fixture
        run: python script/validate_puka_counterfactual_replay.py
      - name: Run 0.4 postseason and raw draft-order consequences
        run: python script/run_fsffl_postseason_consequences_v3.py data/alternate_history/scenarios/puka_vs_van_2023.json
      - name: Infer draft-order components
        run: python script/infer_fsffl_historical_draft_order.py data/alternate_history/scenarios/puka_vs_van_2023.json
      - name: Build 0.6a alternate draft candidate windows
        run: python script/run_fsffl_alternate_draft_candidates.py data/alternate_history/scenarios/puka_vs_van_2023.json
      - name: Run 0.6b probabilistic historical draft policy
        run: python script/run_fsffl_alternate_draft_policy.py data/alternate_history/scenarios/puka_vs_van_2023.json --sims 3000
      - name: Report 0.6b per-controlled-pick distributions
        run: python script/report_fsffl_alternate_draft_policy.py data/alternate_history/scenarios/puka_vs_van_2023.json --sims 3000
      - name: Diagnose historical ownership gap
        run: python script/diagnose_alternate_history_event.py data/alternate_history/scenarios/puka_vs_van_2023.json
      - name: Run 0.5a relevance-pruned downstream dependency replay
        run: python script/run_fsffl_downstream_dependencies_v4.py data/alternate_history/scenarios/puka_vs_van_2023.json
      - name: Run 0.5b historical policy triage
        run: python script/run_fsffl_historical_policy_triage.py data/alternate_history/scenarios/puka_vs_van_2023.json
      - name: Run 0.5c historical usage policy
        run: python script/run_fsffl_historical_usage_policy_v3.py data/alternate_history/scenarios/puka_vs_van_2023.json
      - name: Run 0.5d historical trade policy
        run: python script/run_fsffl_historical_trade_policy_v2.py data/alternate_history/scenarios/puka_vs_van_2023.json
      - name: Expand 0.5e modified historical trade branches
        run: python script/run_fsffl_historical_trade_policy_v3.py data/alternate_history/scenarios/puka_vs_van_2023.json
      - name: Validate grouped-particle chronological replay
        run: python script/validate_fsffl_multiseason_particle_replay.py
      - name: Validate 0.7d fork-season standings and Max PF feedback
        run: python script/validate_fsffl_fork_season_feedback.py
      - name: Build present-day deterministic reference snapshot
        run: python script/run_fsffl_reference_present_day.py data/alternate_history/scenarios/puka_vs_van_2023.json
      - name: Run current Simulator 1.0 reference outlook
        env:
          ALTERNATE_HISTORY_CURRENT_SIMS: '500'
        run: python script/run_fsffl_alternate_current_outlook.py data/alternate_history/scenarios/puka_vs_van_2023.json --sims 500
