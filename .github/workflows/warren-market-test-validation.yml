name: Warren Market Test Validation

on:
  push:
    branches:
      - fix/trade-market-test-options
    paths:
      - '.github/workflows/warren-market-test-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trade-market-test-options
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Build Warren scenario
        run: |
          cat > /tmp/mocha.json <<'JSON'
          {
            "scenario_id":"mocha_warren_market_test_validation",
            "focus_user_id":"844785316274483200",
            "actions":[
              {"type":"trade","from_user_id":"844785316274483200","to_user_id":"850548458887704576","players":["12518"],"picks":[]},
              {"type":"trade","from_user_id":"850548458887704576","to_user_id":"844785316274483200","players":["5012","5846"],"picks":["pick:2029:R2:orig11","pick:2029:R3:orig11","pick:2029:R3:orig4"]}
            ]
          }
          JSON
      - name: Run production trade report
        run: |
          mkdir -p /tmp/out
          python script/run_trade_report.py --scenario /tmp/mocha.json --out-dir /tmp/out --basename warren --quick-sims 200 --adaptive-confirm-sims 50000 --search-depth 60 > /tmp/out/pipeline.log
      - name: Validate market-test visibility
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/out/warren.json'))
          ms=r.get('market_sweep_alternatives') or []
          assert ms, 'expected focal-positive market-test alternatives'
          assert any(x.get('generated_option_action_eligible') is False for x in ms)
          assert any(x.get('market_test_status')=='MARKET_TEST_BUYER_FEASIBILITY_UNVALIDATED' for x in ms)
          assert r.get('recommended_next_action')=='DECLINE'
          out={
            'action':r.get('recommended_next_action'),
            'market_count':len(ms),
            'counter_count':len(r.get('suggested_counteroffers') or []),
            'markets':[{
              'buyer':x.get('buyer_team'),
              'buyer_user_id':x.get('buyer_user_id'),
              'return_asset_names':x.get('return_asset_names'),
              'shared_utility':x.get('shared_decision_utility_score'),
              'status':x.get('market_test_status'),
              'action_eligible':x.get('generated_option_action_eligible'),
              'comparison':(x.get('comparison_to_current_offer') or {}).get('verdict_vs_current_offer')
            } for x in ms]
          }
          print(json.dumps(out,indent=2))
          open('/tmp/out/market-test-results.json','w').write(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: warren-market-test-validation
          path: /tmp/out/*
          retention-days: 14
