name: Opportunity Utility Sanity Audit

on:
  pull_request:
    paths:
      - 'script/audit_opportunity_utility_sanity.py'
      - 'script/decision_utility.py'
      - 'script/strategic_posture.py'
      - 'script/gm3/team_improvement.py'
      - 'script/run_team_improvement_lab.py'
      - 'script/run_team_improvement_lab_v16.py'
      - '.github/workflows/opportunity-utility-sanity.yml'
  workflow_dispatch:

jobs:
  sanity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Compile audit path
        run: |
          python -m py_compile \
            script/audit_opportunity_utility_sanity.py \
            script/decision_utility.py \
            script/strategic_posture.py \
            script/gm3/team_improvement.py
      - name: Refresh governed inputs
        run: |
          python script/build_fsffl_full_projection_universe.py
          python script/refresh_behavioral_intelligence_v3.py
      - name: Build production Team Improvement trade universe
        run: |
          mkdir -p /tmp/utility-sanity
          python script/gm3/team_improvement.py \
            --focus-user-id 846634401482792960 \
            --quick-sims 500 \
            --confirm-sims 2500 \
            --trade-screen 75 \
            --waiver-screen 50 \
            --confirm-top 15 \
            --trade-packages-per-target 12 \
            --price-frontier-targets 16 \
            --price-frontier-packages-per-target 18 \
            --seed 20260821 \
            --output /tmp/utility-sanity/team-improvement.json
      - name: Run repeated-seed posture sanity set
        run: |
          python script/audit_opportunity_utility_sanity.py \
            --input /tmp/utility-sanity/team-improvement.json \
            --focus-user-id 846634401482792960 \
            --simulations 500 \
            --seeds 20260821,20260822,20260823,20260824 \
            --postures AUTO,BALANCED_CONTENDER,PUSH_CHIPS_IN,PRESERVE_FUTURE_VALUE \
            --output /tmp/utility-sanity/opportunity-utility-sanity.json \
            --markdown /tmp/utility-sanity/Opportunity_Utility_Sanity_Audit.md
      - name: Validate audit governance
        run: |
          python - <<'PY'
          import json
          p='/tmp/utility-sanity/opportunity-utility-sanity.json'
          a=json.load(open(p))
          assert a['authority']=='DIAGNOSTIC_ONLY'
          assert a['coefficient_change_supported_by_this_audit'] is False
          assert a['owner_intuition_used_as_fitted_target'] is False
          assert a['new_utility_created'] is False
          assert len(a['cases'])==7
          assert set(a['postures'])=={
              'AUTO','BALANCED_CONTENDER','PUSH_CHIPS_IN','PRESERVE_FUTURE_VALUE'
          }
          valid={'STABLE_POSITIVE','STABLE_NEGATIVE','ZERO_ACROSS_SEEDS','SIGN_UNSTABLE'}
          for case in a['cases']:
              for posture,row in case['postures'].items():
                  assert row['summary']['sign_stability'] in valid
                  assert len(row['runs'])==4
          print('Opportunity utility sanity audit governance passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opportunity-utility-sanity-audit
          path: /tmp/utility-sanity/*
          if-no-files-found: warn
          retention-days: 30
