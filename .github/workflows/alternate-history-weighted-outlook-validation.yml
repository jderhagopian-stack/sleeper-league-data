name: Alternate History Weighted Outlook Validation

on:
  workflow_dispatch:

concurrency:
  group: alternate-history-weighted-outlook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-weighted-outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Simulator runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile generic weighted-outlook modules
        run: |
          python -m py_compile script/alternate_history_season_cycle.py
          python -m py_compile script/run_fsffl_generic_alternate_history.py
          python -m py_compile script/run_fsffl_weighted_alternate_outlook.py
          python -m py_compile script/validate_fsffl_weighted_alternate_outlook.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Run generic weighted Simulator 1.0 smoke validation
        run: python script/validate_fsffl_weighted_alternate_outlook.py
