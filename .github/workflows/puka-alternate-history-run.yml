name: Puka Alternate History Final Report

on:
  pull_request:
    paths:
      - '.github/workflows/puka-alternate-history-run.yml'
  workflow_dispatch:
    inputs:
      particles:
        description: 'Historical particle count'
        required: false
        default: '50'
      sims:
        description: 'Total Simulator 1.0 draws'
        required: false
        default: '500'

concurrency:
  group: puka-alternate-history-final-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-puka-final-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Simulator runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile final report renderer
        run: python -m py_compile script/run_fsffl_alternate_history_final_report.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Run Puka Alternate History protocol once and render final report
        shell: bash
        run: |
          PARTICLES="${{ inputs.particles || '50' }}"
          SIMS="${{ inputs.sims || '500' }}"
          python script/run_fsffl_alternate_history_final_report.py \
            data/alternate_history/scenarios/puka_vs_van_2023.json \
            --particles "$PARTICLES" \
            --sims "$SIMS" \
            --seed 20260824
      - name: Print final human-readable report
        run: cat data/alternate_history/results/puka_vs_van_2023/final_report_1_0.md
      - name: Persist final report for ChatGPT retrieval
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p .run_outputs/alternate_history/puka_vs_van_2023
          cp data/alternate_history/results/puka_vs_van_2023/final_report_1_0.md \
            .run_outputs/alternate_history/puka_vs_van_2023/final_report_1_0.md
          cp data/alternate_history/results/puka_vs_van_2023/final_report_1_0.json \
            .run_outputs/alternate_history/puka_vs_van_2023/final_report_1_0.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .run_outputs/alternate_history/puka_vs_van_2023/final_report_1_0.md \
                  .run_outputs/alternate_history/puka_vs_van_2023/final_report_1_0.json
          if git diff --cached --quiet; then
            echo "Report unchanged; nothing to persist."
          else
            git commit -m "Store Puka Alternate History final report [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Upload final report package
        uses: actions/upload-artifact@v4
        with:
          name: puka-alternate-history-final-report
          path: |
            data/alternate_history/results/puka_vs_van_2023/final_report_1_0.md
            data/alternate_history/results/puka_vs_van_2023/final_report_1_0.json
          if-no-files-found: error
