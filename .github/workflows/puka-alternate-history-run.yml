name: Puka Alternate History Scenario Run

on:
  push:
    branches:
      - ops/puka-scenario-run
    paths:
      - '.github/workflows/puka-alternate-history-run.yml'
  workflow_dispatch:

concurrency:
  group: puka-alternate-history-scenario
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-puka-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Simulator runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Run Puka Alternate History scenario
        run: |
          python script/run_fsffl_weighted_alternate_outlook.py \
            data/alternate_history/scenarios/puka_vs_van_2023.json \
            --particles 20 \
            --sims 250 \
            --seed 20260824
      - name: Persist Puka result on isolated branch
        run: |
          cp data/alternate_history/results/puka_vs_van_2023/weighted_current_outlook_1_0_generic.json \
             data/alternate_history/results/puka_vs_van_2023/production_20p_250s.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alternate_history/results/puka_vs_van_2023/production_20p_250s.json
          git commit -m "Persist Puka Alternate History 20p 250s result"
          git push
      - name: Upload Puka result
        uses: actions/upload-artifact@v4
        with:
          name: puka-alternate-history-20p-250s
          path: data/alternate_history/results/puka_vs_van_2023/production_20p_250s.json
