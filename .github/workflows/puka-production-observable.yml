name: Puka Production Observable Run

on:
  pull_request:
    paths:
      - '.github/workflows/puka-production-observable.yml'

permissions:
  contents: read

jobs:
  run-puka:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aa9aae9b69f2e0aabc08db7d887e79674baec23b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Simulator runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Run Puka Alternate History scenario
        run: |
          python script/run_fsffl_weighted_alternate_outlook.py \
            data/alternate_history/scenarios/puka_vs_van_2023.json \
            --particles 20 \
            --sims 250 \
            --seed 20260824
      - name: Print Puka result
        run: cat data/alternate_history/results/puka_vs_van_2023/weighted_current_outlook_1_0_generic.json
      - name: Upload Puka result
        uses: actions/upload-artifact@v4
        with:
          name: puka-production-20p-250s
          path: data/alternate_history/results/puka_vs_van_2023/weighted_current_outlook_1_0_generic.json
