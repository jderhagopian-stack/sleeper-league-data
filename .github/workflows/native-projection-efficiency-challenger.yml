name: Native Projection Efficiency Challenger

on:
  pull_request:
    paths:
      - 'script/run_native_projection_efficiency_benchmark.py'
      - 'script/run_native_projection_age_benchmark.py'
      - 'script/run_native_projection_nflverse_benchmark.py'
      - 'script/native_projection_challenger.py'
      - '.github/workflows/native-projection-efficiency-challenger.yml'

jobs:
  efficiency-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile experiment
        run: python -m py_compile script/run_native_projection_efficiency_benchmark.py
      - name: Run rolling 2021-2025 efficiency benchmark
        run: |
          python script/run_native_projection_efficiency_benchmark.py \
            --start-season 2016 \
            --end-season 2025 \
            --first-holdout 2021 \
            --output data/model_validation/native_projection_efficiency_benchmark.json
      - name: Validate output
        run: python -m json.tool data/model_validation/native_projection_efficiency_benchmark.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: native-projection-efficiency-benchmark
          path: data/model_validation/native_projection_efficiency_benchmark.json
          retention-days: 14
