name: Emergency Cancel Actions Backlog

# retrigger: cancel long-running validation
on:
  push:
    branches:
      - ops/cancel-actions-backlog
    paths:
      - .github/workflows/emergency-cancel-actions-backlog.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel every other queued or in-progress run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          api = "https://api.github.com"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "fsffl-actions-backlog-cleaner",
          }

          def request(method, path):
              req = urllib.request.Request(api + path, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode("utf-8")
                      return resp.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  return exc.code, body

          def list_runs(status):
              code, payload = request(
                  "GET",
                  f"/repos/{repo}/actions/runs?status={status}&per_page=100&page=1",
              )
              if code != 200:
                  raise RuntimeError(f"Failed listing {status} runs: HTTP {code}: {payload}")
              return payload.get("workflow_runs", [])

          def cancel(run_id):
              code, body = request("POST", f"/repos/{repo}/actions/runs/{run_id}/cancel")
              if code in (202, 409):
                  return code, "cancel"
              force_code, force_body = request(
                  "POST", f"/repos/{repo}/actions/runs/{run_id}/force-cancel"
              )
              if force_code in (202, 409):
                  return force_code, "force-cancel"
              return force_code, f"failed normal={code}:{body} force={force_code}:{force_body}"

          cancelled = 0
          seen = set()

          for round_no in range(1, 31):
              targets = []
              for status in ("in_progress", "queued"):
                  for run in list_runs(status):
                      run_id = int(run["id"])
                      if run_id == current_run_id:
                          continue
                      targets.append((run_id, status, run.get("name", "")))

              deduped = []
              for item in targets:
                  if item[0] not in seen:
                      seen.add(item[0])
                      deduped.append(item)

              if not deduped:
                  remaining = []
                  for status in ("in_progress", "queued"):
                      remaining.extend(
                          r for r in list_runs(status)
                          if int(r["id"]) != current_run_id
                      )
                  if not remaining:
                      print(f"Backlog clear. Cancel requests sent: {cancelled}")
                      break
                  seen.clear()
                  time.sleep(1)
                  continue

              print(f"Round {round_no}: cancelling {len(deduped)} runs")
              for run_id, status, name in deduped:
                  code, mode = cancel(run_id)
                  if code in (202, 409):
                      cancelled += 1
                      print(f"  {run_id} [{status}] {name}: {mode} HTTP {code}")
                  else:
                      print(f"  {run_id} [{status}] {name}: {mode}")

              time.sleep(2)
          else:
              raise RuntimeError("Cleanup reached safety round limit before backlog cleared")
          PY
