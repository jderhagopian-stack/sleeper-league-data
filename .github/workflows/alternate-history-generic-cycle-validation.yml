name: Alternate History Generic Cycle Validation

on:
  pull_request:
    paths:
      - 'script/alternate_history_season_cycle.py'
      - 'script/run_fsffl_generic_alternate_history.py'
      - 'script/validate_fsffl_generic_alternate_history.py'
      - 'script/alternate_history_dynamic_policy.py'
      - 'script/alternate_history_historical_state.py'
      - 'script/run_fsffl_season_boundary_particles.py'
      - 'script/run_fsffl_predraft_particles.py'
      - 'script/run_fsffl_next_draft_handoff.py'
      - 'data/alternate_history/**'
      - '.github/workflows/alternate-history-generic-cycle-validation.yml'
  workflow_dispatch:

concurrency:
  group: alternate-history-generic-cycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-generic-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile generic cycle modules
        run: |
          python -m py_compile script/alternate_history_season_cycle.py
          python -m py_compile script/run_fsffl_generic_alternate_history.py
          python -m py_compile script/validate_fsffl_generic_alternate_history.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Validate arbitrary-year 2022 and 2023 forks to active season
        run: python script/validate_fsffl_generic_alternate_history.py
