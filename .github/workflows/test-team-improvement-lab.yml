name: Test Team Improvement Lab

on:
  pull_request:
    paths:
      - 'script/run_team_improvement_lab.py'
      - 'script/run_team_improvement_lab_v11.py'
      - 'script/roster_aware_trade.py'
      - 'script/run_roster_decision_lab.py'
      - 'script/run_trade_market_sweep_v13.py'
      - '.github/workflows/test-team-improvement-lab.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Team Improvement Lab
        run: python -m py_compile script/run_team_improvement_lab.py script/run_team_improvement_lab_v11.py script/roster_aware_trade.py script/run_roster_decision_lab.py script/run_trade_market_sweep_v13.py
      - name: Run Team Improvement Lab smoke test
        run: |
          mkdir -p /tmp/team-improvement
          python script/run_team_improvement_lab_v11.py \
            --focus-user-id 846634401482792960 \
            --quick-sims 50 \
            --confirm-sims 100 \
            --trade-screen 8 \
            --waiver-screen 8 \
            --confirm-top 3 \
            --output /tmp/team-improvement/report.json
      - name: Validate output invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/team-improvement/report.json')
          r=json.loads(p.read_text())
          assert r['model_version']=='FSFFL-GM-Team-Improvement-Lab-1.1'
          assert r['generated_for_user_id']=='846634401482792960'
          assert r['hold_benchmark']['team_improvement_score']==0
          assert r['policy']['hold_is_explicit_benchmark'] is True
          assert r['policy']['roster_aware_trade_resolution'] is True
          assert r['policy']['waiver_adds_include_endogenous_optimal_drop'] is True
          assert r['policy']['forced_cuts_included_in_simulation_and_value'] is True
          assert r['policy']['canonical_state_mutated'] is False
          assert r['recommended_action']['channel'] in {'TRADE','WAIVER','HOLD'}
          assert r['search_summary']['waiver_candidates_screened'] > 0, 'full projection pool should produce waiver candidates'
          for row in r.get('top_cross_channel_options') or []:
              sim=row.get('simulation') or {}
              rr=sim.get('roster_resolution') or {}
              assert rr
              assert all(x.get('roster_legal') is True for x in rr.values())
              assert row.get('team_improvement_score') is not None
              if row.get('channel')=='TRADE':
                  assert row.get('acceptance_fit') in {'HIGH','MEDIUM','LOW','VERY_LOW'}
          for row in r.get('best_waiver_options') or []:
              assert row.get('waiver_discovery_source')=='full_simulator_projection_pool'
          print('Team Improvement Lab 1.1 validation passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-improvement-lab-smoke-test
          path: /tmp/team-improvement/*
          if-no-files-found: error
          retention-days: 14
