name: Test Team Improvement Lab

on:
  workflow_call:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install report dependencies
        run: python -m pip install numpy 'reportlab>=4,<5' 'pypdf>=4,<7'
      - name: Compile Team Improvement Lab
        run: python -m py_compile script/run_team_improvement_lab.py script/run_team_improvement_lab_v13.py script/run_team_improvement_lab_v16.py script/decision_attribution.py script/gm3/team_improvement.py script/build_fsffl_full_projection_universe.py script/render_gm_action_report_v10.py script/roster_aware_trade.py script/run_roster_decision_lab.py script/run_trade_market_sweep_v13.py
      - name: Unit test shared decision utility
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('lab','script/run_team_improvement_lab.py')
          lab=importlib.util.module_from_spec(spec); spec.loader.exec_module(lab)
          sim={
            'focus_delta':{
              'expected_wins':.35,'expected_points_for':35,
              'playoff_probability':.03,'championship_probability':.045
            },
            'strategic':{
              'market_dynasty_delta':-250,
              'optionality_value_delta':40,
              'liquidity_value_delta':20,
              'resilience_value_delta':15,
              'objective_weights':{'current':.50,'future':.30,'liquidity':.08,'resilience':.12},
            },
            'net_title_equity_swing_against_focus':0.0,
          }
          score=lab.unified_score('x',sim)
          assert isinstance(score,float)
          original=lab.state_weights
          try:
              lab.state_weights=lambda uid: ('descriptive_state',{'current':.5,'future':.3,'liquidity':.08,'resilience':.12})
              row={'channel':'TRADE','outgoing':[{'market_dynasty':5000}]}
              g=lab.dynasty_value_guardrail('x',row,sim)
              assert g['passed'] is True
              assert g['policy']=='DIAGNOSTIC_ONLY_SHARED_UTILITY_ALREADY_PRICES_FUTURE_VALUE'
              cg=lab.contender_guardrail('x',sim)
              assert cg['passed'] is True
          finally:
              lab.state_weights=original
          print('shared decision utility unit tests passed')
          PY
      - name: Build full projection universe
        run: python script/build_fsffl_full_projection_universe.py
      - name: Run Team Improvement Lab smoke test
        run: |
          mkdir -p /tmp/team-improvement
          python script/gm3/team_improvement.py --focus-user-id 846634401482792960 --quick-sims 50 --confirm-sims 100 --trade-screen 8 --waiver-screen 8 --confirm-top 3 --output /tmp/team-improvement/report.json
          python script/render_gm_action_report_v10.py --input /tmp/team-improvement/report.json --output /tmp/team-improvement/GM_Action_Report.pdf
      - name: Validate output invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          r=json.load(open('/tmp/team-improvement/report.json'))
          assert r['model_version']=='FSFFL-GM-Team-Improvement-Lab-1.6'
          assert r['projection_universe']['model_version']=='FSFFL-Full-Projection-Universe-1.0'
          assert r['projection_universe']['coverage']['final_projection_players'] > r['projection_universe']['coverage']['native_projection_players']
          assert r['hold_benchmark']['team_improvement_score']==0
          assert r['policy']['roster_aware_trade_resolution'] is True
          assert r['policy']['waiver_adds_include_endogenous_optimal_drop'] is True
          assert r['policy']['waiver_candidates_use_canonical_full_projection_universe'] is True
          assert r['policy']['waiver_pre_screen_uses_fixed_cross_unit_coefficients'] is False
          assert r['policy']['waiver_discovery_is_scale_free_multilane'] is True
          assert r['policy']['trade_discovery_is_governed_multilane'] is True
          assert r['policy']['trade_discovery_preserves_bilateral_utility_lane'] is True
          assert r['policy']['trade_discovery_preserves_negotiation_fit_lane'] is True
          assert r['policy']['trade_discovery_preserves_target_diversity_lane'] is True
          assert r['policy']['trade_package_pre_screen_score_owned_by_upstream_gm3'] is True
          assert r['policy']['canonical_state_mutated'] is False
          assert r['policy']['competitive_state_tilts_but_does_not_dominate'] is True
          assert r['policy']['championship_probability_uses_diminishing_returns'] is False
          assert r['policy']['dynasty_value_destruction_guardrail'] is False
          assert r['ranking_calibration']['version']=='shared-decision-utility-2.0'
          assert r['search_summary']['waiver_candidates_screened'] > 0
          assert r['recommended_action']['channel'] in {'TRADE','WAIVER','HOLD'}
          observed_non_hold=0
          for row in r.get('top_cross_channel_options') or []:
              assert all(x.get('roster_legal') is True for x in ((row.get('simulation') or {}).get('roster_resolution') or {}).values())
              if row.get('channel')!='HOLD':
                  observed_non_hold += 1
                  a=row.get('decision_attribution') or {}
                  assert a.get('reconciles') is True, a
                  assert abs(float(a.get('component_sum') or 0)-float(a.get('final_shared_decision_utility') or 0)) <= .02
                  channels={x['channel']:x for x in a.get('channels') or []}
                  for name in ('liquidity','resilience'):
                      if channels.get(name) and channels[name].get('authorized_for_final_utility') is False:
                          assert float(channels[name].get('objective_weight') or 0)==0.0
                          assert float(channels[name].get('numeric_contribution') or 0)==0.0
              if row.get('channel')=='TRADE':
                  assert row.get('acceptance_fit') in {'HIGH','MEDIUM','LOW','VERY_LOW'}
                  sim=row.get('simulation') or {}
                  assert 'competitive_externality' in sim
                  assert 'net_title_equity_swing_against_focus' in sim
                  assert row.get('focal_decision_attribution',{}).get('reconciles') is True
                  if sim.get('counterparty'):
                      assert row.get('counterparty_decision_attribution',{}).get('reconciles') is True
                      assert row.get('counterparty_shared_decision_utility_source')=='same_simulation_same_shared_utility_as_focal'
          assert observed_non_hold > 0
          for row in r.get('best_waiver_options') or []:
              assert row.get('waiver_discovery_source')=='canonical_full_projection_universe_scale_free_multilane'
              assert row.get('pre_screen_weighted_score_used') is False
              assert row.get('projection_source_model')=='FSFFL-Full-Projection-Universe-1.0'
              features=((row.get('simulation') or {}).get('simulator_features') or {})
              assert features.get('decision_lab_projection_override_used') is True
              assert int(features.get('decision_lab_projection_player_count') or 0)==int(r['projection_universe']['coverage']['final_projection_players'])
          pdf=Path('/tmp/team-improvement/GM_Action_Report.pdf')
          assert pdf.exists() and pdf.stat().st_size > 2500
          reader=PdfReader(str(pdf))
          assert len(reader.pages)==1
          text=' '.join((p.extract_text() or '') for p in reader.pages)
          assert 'FSFFL GM ACTION REPORT' in text
          assert '...' not in text and '\u2026' not in text, text
          samples=[]
          for row in (r.get('top_cross_channel_options') or [])[:3]:
              samples.append({
                  'description':row.get('description'),
                  'channel':row.get('channel'),
                  'team_improvement_score':row.get('team_improvement_score'),
                  'attribution':row.get('decision_attribution'),
                  'counterparty_shared_decision_utility_score':row.get('counterparty_shared_decision_utility_score'),
                  'counterparty_attribution':row.get('counterparty_decision_attribution'),
              })
          print(json.dumps({'decision_path_reconciliation_samples':samples},indent=2))
          print('Team Improvement Lab 1.6 governed multi-lane discovery validation passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-improvement-lab-smoke-test
          path: /tmp/team-improvement/*
          if-no-files-found: error
          retention-days: 14
