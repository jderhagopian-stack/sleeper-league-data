name: Alternate History Present Day Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-present-day:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Compile present-day modules
        run: |
          python -m py_compile script/run_fsffl_present_day_particles.py
          python -m py_compile script/validate_fsffl_present_day_particles.py
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Run complete 2023 to present-day validation
        run: python script/validate_fsffl_present_day_particles.py
