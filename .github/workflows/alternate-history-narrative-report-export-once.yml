name: Alternate History Narrative Report Export Once

on:
  workflow_dispatch:
  push:
    branches:
      - feature/alternate-history-0.1
    paths:
      - .github/workflows/alternate-history-narrative-report-export-once.yml

jobs:
  export-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Simulator runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Restore completed-season Sleeper history cache
        uses: actions/cache@v4
        with:
          path: data/alternate_history/source_history/sleeper_history.json
          key: alternate-history-sleeper-completed-2022-2025-v1
      - name: Backfill authoritative raw Sleeper history
        run: python script/backfill_alternate_history_sleeper.py
      - name: Run certified-scale narrative report
        run: |
          python script/run_gm30_alternate_history_review.py \
            data/alternate_history/scenarios/puka_vs_van_2023.json \
            --particles 100 --sims 500 --seed 20260824
      - name: Upload narrative report
        uses: actions/upload-artifact@v4
        with:
          name: alternate-history-narrative-report-100x500
          path: |
            data/alternate_history/results/puka_vs_van_2023/final_report_1_1.json
            data/alternate_history/results/puka_vs_van_2023/final_report_1_1.md
            data/alternate_history/results/puka_vs_van_2023/final_report_1_0.json
            data/alternate_history/results/puka_vs_van_2023/final_report_1_0.md
